<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes sway-brinda { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .mascot-sway-brinda { animation: sway-brinda 3s ease-in-out infinite; transform-origin: 150px 250px; }
  
    /* IL RESPIRO — 1,5%: sotto la soglia di ciò che si nota, sopra
       quella di ciò che si sente. È questo che separa un
       personaggio da un disegno. */
    @keyframes respiro-brinda{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,0.99)}}
    .respira-brinda{animation:respiro-brinda 4.1s ease-in-out infinite;transform-origin:150px 280px}
    /* L'AMMICCO — due periodi non multipli (4,3 e 7,1 s) così
       l'occhio non trova mai il ritmo: un blink regolare è la cosa
       più inquietante che si possa fare a una faccia. */
    @keyframes ammicco-brinda{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
    @keyframes ammicco2-brinda{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(0.12)}}
    .occhi-brinda{animation:ammicco-brinda 4.3s infinite,ammicco2-brinda 7.1s infinite;
      transform-origin:150px 185px}

    /* il brindisi: alza appena, come chi fa cin cin */
    @keyframes cincin-brinda{0%,100%{transform:translateY(0) rotate(0)}
      50%{transform:translateY(-3px) rotate(2deg)}}
    .corpo-brinda{animation:cincin-brinda 2.3s ease-in-out infinite;transform-origin:150px 280px}
    /* LE SOPRACCIGLIA — è qui che vive l'espressione. Due linee
       corte che si alzano di due gradi cambiano l'umore di una
       faccia più di qualunque altra cosa: il cinema d'animazione
       lo sa da cent'anni. */
    @keyframes so-brinda{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(-3px)}}
    .sopracciglia-brinda{animation:so-brinda 5.7s ease-in-out infinite;transform-origin:150px 159px}
    /* LA BOCCA si muove POCO e con un periodo diverso da tutto
       il resto: se battesse a tempo col respiro sembrerebbe un
       meccanismo, non una creatura. */
    @keyframes bocca-brinda{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,1.1)}}
    .bocca-brinda{animation:bocca-brinda 5.3s ease-in-out infinite;transform-origin:150px 223px}
    /* IL DONDOLIO — un grado e mezzo, lentissimo: nessuno lo nota
       guardando, tutti lo notano se manca. */
    @keyframes ondeggio-brinda{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    .ondeggia-brinda{animation:ondeggio-brinda 6.7s ease-in-out infinite;transform-origin:150px 280px}
    /* LE GUANCE del brindisi restano accese: è il calore di una
       cosa bella che sta succedendo adesso. */
    @keyframes guance-brinda{0%,100%{opacity:.3}50%{opacity:.5}}
    .guance-brinda{animation:guance-brinda 4.4s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-brinda" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-brinda" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="ondeggia-brinda"><g class="respira-brinda"><g class="corpo-brinda"><g class="mascot-sway-brinda">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-brinda)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-brinda)"/>
    <g class="occhi-brinda"><path d="M 110,185 Q 120,195 130,185" fill="none" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
    <path d="M 170,185 Q 180,195 190,185" fill="none" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/></g>
    <path d="M 140,215 Q 150,225 160,215" fill="none" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
      <g class="sopracciglia-brinda" opacity=".85"><path d="M 111 159 q 9 -5 18 0" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 171 159 q 9 -5 18 0" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/></g>
    <path class="bocca-brinda" d="M 138 223 q 12 10 24 0" stroke="#1A4D40" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g></g></g></g>
  <g class="guance-brinda" fill="#FF7F50" opacity=".3">
      <circle cx="104" cy="204" r="10"/><circle cx="196" cy="204" r="10"/></g>
</svg>
