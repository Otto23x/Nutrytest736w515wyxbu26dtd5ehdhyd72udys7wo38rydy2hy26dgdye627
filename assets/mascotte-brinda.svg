<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes sway-brinda { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .mascot-sway-brinda { animation: sway-brinda 3s ease-in-out infinite; transform-origin: 150px 250px; }
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-brinda" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-brinda" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="mascot-sway-brinda">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-brinda)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-brinda)"/>
    <path d="M 110,185 Q 120,195 130,185" fill="none" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
    <path d="M 170,185 Q 180,195 190,185" fill="none" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
    <path d="M 140,215 Q 150,225 160,215" fill="none" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
