<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes scanMove-cerca { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .mascot-scan-cerca { animation: scanMove-cerca 4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-cerca" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-cerca" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="mascot-scan-cerca">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-cerca)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-cerca)"/>
    <circle cx="120" cy="190" r="11" fill="#1A4D40"/>
    <circle cx="180" cy="190" r="11" fill="#1A4D40"/>
    <circle cx="120" cy="196" r="3.5" fill="#FFFFFF"/>
    <circle cx="180" cy="196" r="3.5" fill="#FFFFFF"/>
    <circle cx="150" cy="216" r="5" fill="#1A4D40"/>
  </g>
</svg>
