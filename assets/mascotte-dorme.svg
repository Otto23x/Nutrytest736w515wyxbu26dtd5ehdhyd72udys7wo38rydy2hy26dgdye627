<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes sleepBreath-dorme { 0%, 100% { transform: scaleY(1) scaleX(1); } 50% { transform: scaleY(0.95) scaleX(1.03); } }
    .mascot-sleep-dorme { animation: sleepBreath-dorme 4.5s ease-in-out infinite; transform-origin: 150px 280px; }
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-dorme" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-dorme" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="mascot-sleep-dorme">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-dorme)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-dorme)"/>
    <line x1="110" y1="185" x2="130" y2="185" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="185" x2="190" y2="185" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="215" r="3" fill="#1A4D40"/>
  </g>
</svg>
