<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes sleepBreath-dorme { 0%, 100% { transform: scaleY(1) scaleX(1); } 50% { transform: scaleY(0.95) scaleX(1.03); } }
    .mascot-sleep-dorme { animation: sleepBreath-dorme 4.5s ease-in-out infinite; transform-origin: 150px 280px; }
  
    /* IL RESPIRO — 1,5%: sotto la soglia di ciò che si nota, sopra
       quella di ciò che si sente. È questo che separa un
       personaggio da un disegno. */
    @keyframes respiro-dorme{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,0.99)}}
    .respira-dorme{transform-origin:150px 280px}
    /* L'AMMICCO — due periodi non multipli (4,3 e 7,1 s) così
       l'occhio non trova mai il ritmo: un blink regolare è la cosa
       più inquietante che si possa fare a una faccia. */
    @keyframes ammicco-dorme{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
    @keyframes ammicco2-dorme{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(0.12)}}
    .occhi-dorme{animation:ammicco-dorme 4.3s infinite,ammicco2-dorme 7.1s infinite;
      transform-origin:150px 185px}

    /* il sonno profondo: respiro più lento e ampio degli altri */
    @keyframes sonno-dorme{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,0.985)}}
    .corpo-dorme{animation:sonno-dorme 5.5s ease-in-out infinite;transform-origin:150px 280px}
    /* LE SOPRACCIGLIA — è qui che vive l'espressione. Due linee
       corte che si alzano di due gradi cambiano l'umore di una
       faccia più di qualunque altra cosa: il cinema d'animazione
       lo sa da cent'anni. */
    @keyframes so-dorme{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
    .sopracciglia-dorme{animation:so-dorme 6.9s ease-in-out infinite;transform-origin:150px 159px}
    /* LA BOCCA si muove POCO e con un periodo diverso da tutto
       il resto: se battesse a tempo col respiro sembrerebbe un
       meccanismo, non una creatura. */
    @keyframes bocca-dorme{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,1.1)}}
    .bocca-dorme{animation:bocca-dorme 5.3s ease-in-out infinite;transform-origin:150px 223px}
    /* IL DONDOLIO — un grado e mezzo, lentissimo: nessuno lo nota
       guardando, tutti lo notano se manca. */
    @keyframes ondeggio-dorme{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    .ondeggia-dorme{animation:ondeggio-dorme 6.7s ease-in-out infinite;transform-origin:150px 280px}
    /* LE ZETA salgono e si dissolvono, una dopo l'altra: è il
       modo più antico e più leggibile di dire «sta dormendo». */
    @keyframes z1-dorme{0%{transform:translate(0,0) scale(.6);opacity:0}
      25%{opacity:.8}100%{transform:translate(14px,-34px) scale(1.1);opacity:0}}
    .z1-dorme{animation:z1-dorme 3.6s ease-out infinite}
    .z2-dorme{animation:z1-dorme 3.6s ease-out infinite 1.2s}
    .z3-dorme{animation:z1-dorme 3.6s ease-out infinite 2.4s}
    /* il respiro del sonno è il più lento di tutti */
    @keyframes sonnoprof-dorme{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
    .respira-dorme{animation:sonnoprof-dorme 5.4s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-dorme" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-dorme" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="ondeggia-dorme"><g class="respira-dorme"><g class="corpo-dorme"><g class="mascot-sleep-dorme">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-dorme)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-dorme)"/>
    <g class="occhi-dorme"><line x1="110" y1="185" x2="130" y2="185" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="185" x2="190" y2="185" stroke="#1A4D40" stroke-width="5" stroke-linecap="round"/></g>
    <circle cx="150" cy="215" r="3" fill="#1A4D40"/>
      <g class="sopracciglia-dorme" opacity=".85"><path d="M 111 159 q 9 -3 18 0" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 171 159 q 9 -3 18 0" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/></g>
    <path class="bocca-dorme" d="M 143 223 q 7 6 14 0" stroke="#1A4D40" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g></g></g></g>
  <g fill="#1A4D40" opacity=".55" font-family="Georgia,serif" font-size="20" font-weight="700">
      <text class="z1-dorme" x="205" y="150">z</text>
      <text class="z2-dorme" x="212" y="140">z</text>
      <text class="z3-dorme" x="219" y="130">z</text></g>
</svg>
