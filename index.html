/* ═══ MINIMO CALORICO ═══════════════════════════════════════════════
   Il pavimento segue il CORPO, non il sesso: 1200 per una donna e 1500 per
   un uomo sono medie di popolazione che non dicono nulla su chi le usa —
   una donna alta e muscolosa consuma più di un uomo minuto. Qui il minimo è
   l'85% del metabolismo basale, con una soglia di sicurezza assoluta a
   1200 kcal sotto la quale non si scende comunque. */
function kcalFloorMin(){
  if(+S.profile.kcalMin>0)return +S.profile.kcalMin;   /* valore scritto a mano */
  const b=bmr();
  if(!(b>0))return 1200;                                /* profilo non ancora compilato */
  return Math.max(1200,Math.round(b*0.85/10)*10);}
function kcalFloorWhy(){
  if(+S.profile.kcalMin>0)return "valore impostato da te";
  const b=bmr();if(!(b>0))return "soglia di sicurezza, profilo da completare";
  return Math.round(b*0.85)<=1200?"soglia di sicurezza assoluta":"85% del tuo basale ("+b+" kcal)";}
function kcalFloor(){
  /* in allattamento e in gravidanza il pavimento di sicurezza si alza
     insieme al fabbisogno: sotto quella soglia non si scende mai */
  return kcalFloorMin()+lactKcal()+pregKcal();}
/* Gli allenamenti NON alzano le calorie da mangiare: il target dei pasti nasce
   solo dal fabbisogno di base meno il deficit scelto. Le calorie bruciate con lo
   sport servono a un'altra cosa — a stimare in quanto tempo si arriva
   all'obiettivo — e le usa soltanto la proiezione (vedi wkForecastBurn). */
function wkForecastBurn(){
  try{return plannedActivityBurnFor(+S.profile.w||70)||0;}catch(e){return 0;}}
function dayTargetKBase(){return Math.max(kcalFloor(),Math.round(tdeeTarget()+physBonus()-deficitTarget()));}
function dayTargetK(){
  let k=dayTargetKBase();
  if(reverseOn())k+=reverseBonus();          /* uscita morbida: si risale */
  if(bankOn())k+=bankAdjust(viewIdx());      /* tassa infrasettimanale, restituita il sabato */
  return Math.max(kcalFloor(),Math.round(k));}
/* Proteine: si calcolano sul peso di RIFERIMENTO, non su quello attuale.
   Con un forte sovrappeso il grasso non "richiede" proteine: usare il peso
   pieno gonfia il numero (ed è il motivo per cui uscivano 182 g).
   Ordine di preferenza: massa magra → peso obiettivo → peso corretto. */
/* Da dove esce il peso di riferimento: serve poterlo leggere, invece di
   vedere comparire un numero diverso da quello inserito senza spiegazioni. */
function refWeightWhy(){
  const p=S.profile,fat=parseFloat(p.fatp);
  const gw=goalWeightSet();
  if(gw&&gw<p.w)return "il peso obiettivo che hai impostato tu ("+gw+" kg)";
  if(fat>0)return "massa magra stimata dal "+fat+"% di grasso, +15% di margine";
  const tw=parseFloat((S.diet||{}).obiettivoPeso);
  if(tw>0&&tw<p.w)return "il tuo peso obiettivo ("+tw+" kg)";
  const h=+p.h||0;
  if(h>0){const ideal=(p.gender==="f"?21.5:22.5)*Math.pow(h/100,2);
    if(p.w>ideal)return "peso corretto: ideale per l'altezza ("+Math.round(ideal)+" kg) più un quarto dell'eccesso";}
  return "il tuo peso attuale";}
/* Unico punto di scrittura dell'obiettivo di peso: i due campi storici
   restano allineati, e nessuna funzione lo cambia di nascosto. */
function setGoalWeight(v){
  const n=parseFloat(String(v==null?"":v).replace(",","."));
  if(!(n>20&&n<350))return goalWeightSet()||null;   /* vuoto o assurdo: NON tocca nulla */
  const ok=Math.round(n*10)/10;
  S.profile.goalW=ok;S.diet.obiettivoPeso=ok;
  return ok;}
/* L'unico modo per togliere l'obiettivo è chiederlo esplicitamente */
function clearGoalWeight(){S.profile.goalW=null;S.diet.obiettivoPeso="";}
function goalWeightSet(){
  /* letto da entrambi i campi: quello degli Obiettivi e quello dell'onboarding */
  const a=parseFloat(S.profile.goalW),b=parseFloat((S.diet||{}).obiettivoPeso);
  const v=(a>0?a:(b>0?b:0));
  return v>20&&v<350?v:0;}
function refWeight(){
  const p=S.profile,fat=parseFloat(p.fatp);
  /* se hai scritto tu un peso obiettivo, quello comanda: è una tua scelta
     esplicita e va rispettata invece di sostituirla con una stima */
  const gw=goalWeightSet();
  if(gw&&gw<p.w)return Math.round(gw);
  if(fat>0)return Math.round(p.w*(1-fat/100)*1.15);   // magra + margine
  const tw=parseFloat((S.diet||{}).obiettivoPeso);
  if(tw>0&&tw<p.w)return Math.round(tw);
  const h=+p.h||0;                                     // peso corretto: ideale + 25% dell'eccesso
  if(h>0){const ideal=(p.gender==="f"?21.5:22.5)*Math.pow(h/100,2);
    if(p.w>ideal)return Math.round(ideal+(p.w-ideal)*0.25);}
  return Math.round(p.w);}
/* g/kg proteici automatici. Riferimento standard: 1,5 g per kg di peso di
   RIFERIMENTO (non il peso della bilancia — vedi refWeight: il grasso
   corporeo non richiede proteine, quindi in forte sovrappeso calcolarle sul
   peso pieno gonfia il numero senza motivo). Sedentari puri 1,2 ·
   aumento massa 1,8. Il valore scritto nelle Regole ha la precedenza.
   In gravidanza e allattamento il fabbisogno proteico sale ancora. */
function protKgAuto(){
  const g=(S.profile.goal||"").toLowerCase();
  if(/massa|aument/.test(g))return 1.8;
  if(pregOn()!=="no"||lactKcal())return 1.7;
  const act=+S.profile.act||1.3;
  if(act<=1.25&&!goalWkTotal())return 1.2;
  return 1.5;}
function dayTargetP(){
  const gk=(S.profile.protKg!=null?+S.profile.protKg:protKgAuto());
  return Math.round(refWeight()*gk);}
/* ── Target degli altri macro, ricavati dal target calorico del giorno ──
   Grassi ~28% delle kcal · carboidrati = quello che resta · fibre 14 g ogni
   1.000 kcal (minimo 25) · zuccheri: un TETTO, non un obiettivo (10% kcal). */
function dayTargetF(){return Math.max(30,Math.round(dayTargetK()*0.28/9));}
function dayTargetC(){
  const rest=dayTargetK()-dayTargetP()*4-dayTargetF()*9;
  return Math.max(50,Math.round(rest/4));}
function dayTargetFib(){return Math.max(25,Math.round(dayTargetK()/1000*14));}
function dayTargetZ(){return Math.max(25,Math.round(dayTargetK()*0.10/4));}
/* ═══ QUALITÀ NUTRIZIONALE DEL CIBO (0-100) ════════════════════════
   Un punteggio per pasto, calcolato dall'AI quando lo spunti, mostrato
   come pallino colorato. Cinque fasce, come una scala del semaforo. */
const QBANDS=[[20,"#DC4444","molto scarsa"],[40,"#EA8A1F","scarsa"],
              [60,"#E8C33A","nella media"],[80,"#7BC96F","buona"],[100,"#16A34A","ottima"]];
function qBand(q){const n=Math.max(0,Math.min(100,Math.round(+q||0)));
  return QBANDS.find(b=>n<=b[0])||QBANDS[QBANDS.length-1];}
function qColor(q){return qBand(q)[1];}
function qLabel(q){return qBand(q)[2];}
/* Pallino: q null = non ancora valutato (contorno vuoto) */
function qDot(q,size,title){
  const d=size||13;
  if(q==null)return `<span class="qdot empty" style="width:${d}px;height:${d}px" title="Qualità non ancora valutata"></span>`;
  const n=Math.round(q);
  return `<span class="qdot" style="width:${d}px;height:${d}px;background:${qColor(n)}" title="${esc(title||("Qualità del cibo: "+n+"% — "+qLabel(n)))}"></span>`;}
function qKey(d){return String(d||"").toLowerCase().replace(/\s+/g," ").replace(/ · porzioni [+−]\d+%[^·]*/,"").trim().slice(0,140);}
/* Il punteggio si chiede all'AI una volta per descrizione e si tiene in cache:
   lo stesso piatto non viene rivalutato ogni volta che lo spunti. */
async function foodQuality(desc){
  const k=qKey(desc);if(!k)return null;
  S.qCache=S.qCache||{};
  if(S.qCache[k]!=null)return S.qCache[k];
  if(!aiOn())return null;
  const t=await aiAsk('Valuta la QUALITÀ NUTRIZIONALE di questo pasto: "'+String(desc).slice(0,300)+'". '+
    'Dai un punteggio da 0 a 100 dove: 0-20 = cibo ultraprocessato, fritto, ricco di zuccheri e grassi saturi, povero di nutrienti; '+
    '21-40 = scarso, poco equilibrato; 41-60 = nella media, accettabile; 61-80 = buono, cibo vero e bilanciato; '+
    '81-100 = ottimo, ingredienti integrali e non processati, verdura, buone proteine, grassi buoni. '+
    'Giudica la QUALITÀ degli alimenti, non la quantità di calorie. Rispondi SOLO JSON: {"q":numero}');
  const j=parseAIJSON(t);
  const q=Math.max(0,Math.min(100,Math.round(+((j&&j.q)||0))));
  if(!q)return null;
  S.qCache[k]=q;save();
  return q;}
/* Qualità media della giornata, pesata sulle calorie: un piatto da 700 kcal
   conta più di uno spuntino da 100. Solo su ciò che è stato davvero mangiato. */
function dayQuality(di){
  let num=0,den=0;
  dayItems(di).forEach(it=>{const st=S.week.days[it.pdi].meals[it.mi];
    if(!st.done||st.skip)return;
    const o=mealOpt(it.pdi,it.mi),q=qOf(st,o&&o.d);
    if(q==null)return;
    const k=Math.max(1,(o&&o.k)||0);num+=q*k;den+=k;});
  (S.week.days[di].extras||[]).forEach(e=>{if(e.st==="skip")return;
    const q=qOf(e,e.d);if(q==null)return;
    const k=Math.max(1,e.k||0);num+=q*k;den+=k;});
  return den?Math.round(num/den):null;}
/* Serie di giorni consecutivi con qualità almeno "buona" (61%+), a ritroso
   da ieri: oggi è ancora in corso e non fa testo finché non è chiuso. */
/* ── Validità del punteggio ────────────────────────────────────────
   Il voto vale solo per la DESCRIZIONE su cui è stato calcolato: insieme
   al punteggio si salva anche quella (qFor). Se il pasto cambia — matita,
   foto, barcode, ribilancio, alternativa, piatto dal frigo… — le due non
   coincidono più e il voto decade da solo, senza dover ricordare di
   invalidarlo in ognuno dei punti che modificano un pasto. */
function qOf(obj,desc){
  if(!obj||obj.q==null)return null;
  return (obj.qFor===qKey(desc))?obj.q:null;}
let QPEND={},QFAIL={};      /* richieste in volo · descrizioni che l'AI non ha saputo valutare */
function qAsk(obj,desc,tag){
  const k=qKey(desc);
  if(!k||QPEND[tag]||QFAIL[k])return;
  QPEND[tag]=1;
  foodQuality(desc).then(q=>{
    delete QPEND[tag];
    if(q==null){QFAIL[k]=1;return;}
    if(qKey(desc)!==k)return;            /* nel frattempo il pasto è cambiato */
    obj.q=q;obj.qFor=k;save();render(cur);
  }).catch(()=>{delete QPEND[tag];QFAIL[k]=1;});}
function qRefreshMeal(pdi,mi){
  const st=S.week.days[pdi]&&S.week.days[pdi].meals[mi];if(!st)return;
  const o=mealOpt(pdi,mi);if(!o||!o.d)return;
  qAsk(st,o.d,"m"+pdi+"_"+mi);}
function qRefreshExtra(di,ei){
  const e=S.week.days[di]&&S.week.days[di].extras[ei];if(!e||!e.d)return;
  qAsk(e,e.d,"e"+di+"_"+ei);}
/* Passata sul giorno mostrato: chiede il voto per tutto ciò che risulta
   mangiato e non ha (più) un punteggio valido. */
function qSweep(di){
  if(!aiOn()||!S.week||!S.week.days[di])return;
  dayItems(di).forEach(it=>{const st=S.week.days[it.pdi].meals[it.mi];
    if(!st.done||st.skip)return;
    const o=mealOpt(it.pdi,it.mi);
    if(o&&o.d&&qOf(st,o.d)==null)qRefreshMeal(it.pdi,it.mi);});
  (S.week.days[di].extras||[]).forEach((e,ei)=>{
    if(e.st==="skip")return;
    if(e.d&&qOf(e,e.d)==null)qRefreshExtra(di,ei);});}
function qStreak(){
  let n=0;const oggi=new Date();
  for(let back=1;back<=60;back++){
    const d=new Date(oggi);d.setDate(d.getDate()-back);
    const di=wd(d);
    if(iso(d)<S.week.started)break;      /* fuori dalla settimana in memoria */
    const q=dayQuality(di);
    if(q==null||q<61)break;
    n++;}
  return n;}

<div class="card"><h2>🧠 Come funziona il sistema</h2>
<div class="hint">Se leggi una cosa sola, leggi questa: spiega il modello su cui è costruita tutta l'app.</div>

<div class="gsec">1 · Due numeri, non uno</div>
<p style="font-size:14.5px;line-height:1.55">Ogni giorno Nutry tiene separati <b>quello che era previsto</b> e <b>quello che hai davvero mangiato</b>.
Il <b>Piano</b> è un modello fisso: la somma dei pasti previsti per quel giorno. Non cambia mai da solo — se ribilanci, fotografi un piatto o correggi con ✏️, cambia la <b>giornata</b> in Oggi, non il piano.
Il <b>mangiato</b> è la somma dei pasti spuntati ✓ più gli extra non barrati. I pasti con la ✗ e gli extra con la ✗ non contano.
Dalla distanza fra questi due numeri nasce tutto il resto: recap, ribilanciamenti, recuperi, analisi dei pattern.</p>

<div class="gsec">2 · Il fabbisogno</div>
<p style="font-size:14.5px;line-height:1.55">Il <b>metabolismo basale</b> si calcola su peso, altezza, età e sesso; si moltiplica per l'<b>attività di base</b> (lavoro e vita quotidiana) e si corregge sui <b>passi base</b>, quelli che fai comunque ogni giorno (riferimento 3.000). Il risultato è il <b>fabbisogno</b>.
Gli allenamenti non sono dentro: si sommano a parte, con la formula <b>(MET dello sport × intensità − 1) × peso × ore</b>. Quel −1 toglie il metabolismo a riposo, che nel fabbisogno c'è già: senza, ogni allenamento risulterebbe più generoso del reale.
<b>Il deficit</b> = fabbisogno + sport − mangiato. Se cali di peso il basale scende, quindi aggiornando la pesata cala anche il fabbisogno: il dimagrimento rallenta da solo, ed è normale.</p>

<div class="gsec">2 bis · Il target del piano (e perché non è il fabbisogno)</div>
<p style="font-size:14.5px;line-height:1.55">Le calorie del piano non coincidono col fabbisogno: sono <b>fabbisogno meno il deficit</b>. Il deficit si fissa in due modi, a scelta in <b>Regole</b>: come <b>percentuale</b> del fabbisogno (20% significa mangiare l'80% di quello che consumi) oppure partendo dai <b>chili a settimana</b> desiderati, sapendo che un chilo di grasso vale circa 7.700 kcal. Il tetto è il 30%.
<br><br>Il metabolismo basale <b>non</b> è un pavimento: per dimagrire bisogna stare sotto il consumo totale, e quando c'è grasso da consumare è normale — e sostenibile — mangiare anche sotto il basale stimato, perché la differenza la copre il corpo. Il limite vero è un <b>minimo calorico</b> (l'85% del tuo metabolismo basale, mai sotto 1.200 kcal, modificabile) sotto il quale diventa difficile coprire proteine e micronutrienti. Se il target scende sotto il basale, l'app te lo segnala: è una fase spinta, da tenere per periodi limitati e con proteine alte.
<br><br>Il moltiplicatore di attività resta però una stima, e se le tue giornate sono più ferme di così il fabbisogno risulta gonfiato. Per questo in <b>Regole</b> ci sono due strumenti: la <b>prudenza</b>, che abbassa di una percentuale il fabbisogno usato per i target, e soprattutto la <b>verifica sui tuoi dati</b>, che ricava il fabbisogno reale da quanto hai mangiato e da come è cambiato il peso — una misura, non una stima — e permette di allineare il moltiplicatore con un tocco.
<br><br>Le proteine si calcolano sul <b>peso di riferimento</b> (massa magra, peso obiettivo o peso corretto), non su quello attuale: il grasso non richiede proteine, e usare il peso pieno gonfia il numero.</p>

<div class="gsec">3 · Ribilanciare la giornata</div>
<p style="font-size:14.5px;line-height:1.55">⚖️ <b>Ribilancia pasti</b> ragiona a <b>budget</b>: pianificato del giorno meno quello già mangiato. Se i pasti che restano stanno dentro il budget non tocca nulla e te lo dice.
Se invece eccedono, riscrive i pasti <b>ancora da consumare</b>: prima abbassa le grammature, poi — solo se il piatto diventa poco saziante — sostituisce un ingrediente con uno più leggero. Le proteine non si riducono mai, nessun pasto scende sotto il minimo impostato, e le proposte che abbassano solo i numeri lasciando il piatto identico vengono scartate prima di arrivarti sotto gli occhi.</p>

<div class="gsec">4 · Recuperare i giorni passati</div>
<p style="font-size:14.5px;line-height:1.55">Il menu <b>Recupero</b> (riga Evento, solo su oggi) mostra le calorie ancora da recuperare degli ultimi 5 giorni. Tre regole di sicurezza:
sotto la <b>soglia di tolleranza</b> lo sforo non viene nemmeno proposto (è dentro l'errore di stima delle porzioni);
in un giorno si taglia al massimo il <b>tetto</b> impostato, in percentuale o in kcal;
nessun pasto scende sotto il <b>minimo</b>. Se lo sforo è grande il resto resta in coda per i giorni dopo. Una festa non si paga con un giorno di digiuno.</p>

<div class="gsec">5 · La settimana</div>
<p style="font-size:14.5px;line-height:1.55">La settimana <b>archiviata</b> va da lunedì a domenica (la spesa e la ricalibratura, invece, partono dal giorno in cui le fai). Alla fine viene <b>archiviata da sola</b> con quello che c'è: nessun bottone da premere, e resta sempre modificabile da Storico → Settimane passate → ✏️.
Le medie si calcolano sui giorni tracciati. I giorni con un <b>evento</b> (Natale, trasferta, giornata no) restano registrati ma escono dalle medie e non spezzano la serie 🔥.</p>

<div class="gsec">6 · Cosa sa l'AI di te</div>
<p style="font-size:14.5px;line-height:1.55">Ogni richiesta all'AI porta con sé le <b>regole numeriche</b> attive e le tue <b>caratteristiche alimentari</b>: tipo di dieta, intolleranze, cibi da evitare, preferenze, tempo per cucinare, pasti liberi, condizioni da tenere presenti.
Le trovi tutte nella sezione <b>📐 Regole</b>, dove sono modificabili — e con "Vedi cosa legge l'AI" puoi leggere il testo esatto che viene allegato. L'AI propone sempre: la spunta e la conferma restano tue.</p>

<div class="gsec">7 · I tuoi dati</div>
<p style="font-size:14.5px;line-height:1.55">Tutto vive sul telefono, senza account e senza server di Nutry. Il backup su Drive è facoltativo e finisce sul <b>tuo</b> account Google; la chiave AI resta su questo dispositivo. <b>Lo sviluppatore non ha accesso a nulla</b>: né ai dati, né al Drive, né alla chiave — non esiste un posto dove potrebbero arrivare.
Da <b>Storico → Esporta i dati</b> scarichi qualsiasi periodo come tabella: una riga per giorno con pianificato, mangiato, macro completi, sport, sonno, relax, umore, acqua, evento, periodo di dieta, ribilanciamenti e recuperi. In CSV per il foglio di calcolo, oppure lasci che sia Nutry a cercarci i <b>pattern</b>. Il backup completo dell'app, quello che serve per rimettere tutto su un altro telefono, si scarica invece da <b>Io → Backup</b>.</p>
</div>

<div class="card"><h2>🔧 Configurazione API: Google Drive e Gemini</h2>
<div class="gsec">Parte 1 — Google Drive</div>
<div class="hint">
<b>A) Progetto e API</b><br>
1. Vai su <b>console.cloud.google.com</b><br>
2. Crea un progetto (in alto a sinistra → "Nuovo progetto") o apri quello dell'app<br>
3. Menu ☰ → "API e servizi" → "Libreria"<br>
4. Cerca <b>"Google Drive API"</b> → Abilita<br><br>
<b>B) Consenso OAuth e utente di test</b><br>
Finché l'app è in "Testing", Google blocca le email non autorizzate:<br>
1. Menu ☰ → "API e servizi" → "Schermata di consenso OAuth"<br>
2. Tipo <b>"Esterno"</b> → compila Nome App e la tua Email<br>
3. Scorri fino a "Utenti di test" → <b>"+ ADD USERS"</b><br>
4. Digita la <b>tua</b> email Google (quella con cui userai l'app)<br>
5. <b>Fondamentale:</b> clicca SALVA per confermare<br><br>
<b>C) Credenziali</b><br>
1. Menu ☰ → "API e servizi" → "Credenziali"<br>
2. "Crea credenziali" → <b>"ID client OAuth"</b><br>
3. Tipo di applicazione: <b>"App web"</b><br>

1. Vai su <b>Io → Sincronizzazione Google Drive</b><br>

/* Composizione in kg derivata da peso + percentuali. Il "resto" della massa
   magra non è "liquidi": è acqua extra-muscolare, ossa e organi. */
function compLine(p){const fat=parseFloat(p.fatp),mus=parseFloat(p.musp);
  if(!(fat>0))return "";
  const gK=(p.w*fat/100),lbmK=p.w-gK;
  let s="La tua composizione: <b>magra "+lbmK.toFixed(1)+" kg</b> · <b>grasso "+gK.toFixed(1)+" kg</b>";
  if(mus>0){const mK=p.w*mus/100,rest=lbmK-mK;
    s+=" — della magra: muscolo "+mK.toFixed(1)+" kg, il resto ("+rest.toFixed(1)+" kg) è acqua extra-muscolare, ossa e organi";}
  return `<div class="hint" style="margin:2px 0 6px">${s}. I calcoli (Katch-McArdle) usano la magra derivata dalla % di grasso.</div>`;}
/* Proiezione verso l'obiettivo: regressione lineare sulle ultime pesate */
function goalProj(){const p=S.profile,ws=p.weights.slice(-8);
  if(!p.goalW||ws.length<2)return "";
  const t0=new Date(ws[0].d).getTime(),days=(new Date(ws[ws.length-1].d).getTime()-t0)/864e5;
  if(days<5)return "";
  const xs=ws.map(x=>(new Date(x.d).getTime()-t0)/864e5),ys=ws.map(x=>x.w);
  const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2;});
  const slope=den?num/den:0; // kg/giorno
  if(slope>=-0.005)return "Il peso al momento non sta scendendo: la proiezione verso l'obiettivo apparirà quando ci sarà un trend in discesa.";
  if(ys[ys.length-1]<=p.goalW)return "🎉 Obiettivo raggiunto!";
  const dLeft=(ys[ys.length-1]-p.goalW)/(-slope);
  const eta=new Date(Date.now()+dLeft*864e5);
  return "Al ritmo attuale (~"+(slope*7).toFixed(1).replace("-","−")+" kg/settimana) dovresti raggiungere <b>"+p.goalW+" kg</b> intorno al <b>"+eta.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})+"</b>. Stima indicativa: il ritmo rallenta man mano che scendi.";}

  if(b<16)return{ok:false,label:"gravemente sottopeso",msg:"È un peso a rischio per la salute: sconsigliato."};
  if(b<18.5)return{ok:false,label:"sottopeso",msg:"Sotto la soglia sana: valuta un obiettivo un po' più alto."};
  if(b<25)return{ok:true,label:"normopeso",msg:"Rientra nella fascia sana."};
  if(b<30)return{ok:true,label:"sovrappeso",msg:"Ancora sopra la fascia normopeso: obiettivo sensato."};
  if(b<35)return{ok:true,label:"obesità I",msg:""};
  if(b<40)return{ok:true,label:"obesità II",msg:""};
  return{ok:true,label:"obesità III",msg:""};}

/* La pesata è l'unico salvataggio che AGGIUNGE una riga allo storico. */
/* Il piano viene costruito su un certo peso. Scendendo, il fabbisogno cala:
   con lo stesso piano il deficit si assottiglia e il calo rallenta. Qui si
   controlla lo scarto e si propone (mai in automatico) di rifare i conti. */
const PLANW_TRIGGER=3;            /* kg di scarto oltre i quali vale la pena */
function planWeightDrift(){
  const base=+S.planW||0,now=+S.profile.w||0;
  if(!base||!now)return 0;
  return Math.round((base-now)*10)/10;}
window.checkPlanAge=async()=>{
  const d=planWeightDrift();
  if(Math.abs(d)<PLANW_TRIGGER)return;
  if(planIsEmpty())return;
  const key="planw_"+Math.round(S.profile.w);
  if(S.ui&&S.ui[key])return;                       /* già chiesto per questo peso */
  S.ui=S.ui||{};S.ui[key]=1;save();
  const oldT=Math.round(bmrForWeight(+S.planW)*(+S.profile.act||1.3));
  const newT=tdee(),diff=oldT-newT;
  const giu=d>0;
  const msg=(giu?"🎉 Hai perso "+d+" kg":"📈 Sei salito di "+Math.abs(d)+" kg")+
    " da quando è stato costruito questo piano ("+S.planW+" kg → "+S.profile.w+" kg)."+
    "\n\nIl fabbisogno cambia con il peso: adesso è di ~"+newT+" kcal al giorno invece di ~"+oldT+
    " ("+(diff>0?"−":"+")+Math.abs(diff)+" kcal). Con il piano di prima il deficit "+
    (giu?"si è ridotto e il calo rallenta":"è aumentato più del previsto")+"."+
    "\n\nIl target aggiornato sarebbe ~"+dayTargetK()+" kcal al giorno."+
    "\n\nPosso ritarare le grammature del piano attuale sui nuovi numeri, tenendo gli stessi piatti. Oppure lasci tutto com'è: i calcoli del diario usano comunque il peso di oggi.";
  if(!await dlgConfirm(msg,{ok:"Ritara il piano",ko:"Lascia com'è"}))return;
  if(!aiOn())return dlgAlert("Per ritarare serve la chiave AI. Puoi comunque rigenerare il piano a mano dal Piano.");
  if(await retunePlan()){S.planW=S.profile.w;save();await genShop(true);return planForecast(true,true);}
};

/* Modifica di una pesata già registrata: si possono correggere i valori o
   aggiungere quelli che mancavano, anche molto dopo. */
window.editWeight=async i=>{
  const W=S.profile.weights||[],x=W[i];if(!x)return;
  const gg=new Date(x.d).toLocaleDateString("it-IT");
  const ask=async (lbl,cur,unit)=>{
    const v=await dlgPrompt("Pesata del "+gg+" — "+lbl+(unit?" ("+unit+")":"")+"\n\nLascia vuoto per non registrare nulla; scrivi «-» per cancellare il valore.",
      cur!=null&&cur!==""?String(cur):"");
    if(v===null)return {abort:true};
    const t=String(v).trim();
    if(t==="")return {keep:true};
    if(t==="-")return {val:null};
    return {val:t};};
  const kg=await ask("peso","","kg");if(kg.abort)return;
  if(kg.val!=null&&!kg.keep){const n=parseFloat(String(kg.val).replace(",","."));
    if(!(n>20&&n<400))return dlgAlert("Peso non valido: la pesata resta come era.");
    x.w=Math.round(n*10)/10;}
  const fat=await ask("massa grassa",x.fat,"%");if(fat.abort)return;
  if(!fat.keep)x.fat=fat.val==null?null:(parseFloat(String(fat.val).replace(",","."))||null);
  const mus=await ask("massa muscolare",x.mus,"%");if(mus.abort)return;
  if(!mus.keep)x.mus=mus.val==null?null:(parseFloat(String(mus.val).replace(",","."))||null);
  const pa=await ask("pressione","",x.pa?"":"es. 120/80");if(pa.abort)return;
  if(!pa.keep)x.pa=pa.val==null?null:String(pa.val);
  const sp=await ask("saturazione",x.spo2,"%");if(sp.abort)return;
  if(!sp.keep)x.spo2=sp.val==null?null:(parseInt(sp.val)||null);
  /* se è l'ultima pesata, l'app allinea anche il peso corrente del profilo */
  const isLast=(i===W.length-1);
  if(isLast){S.profile.w=x.w;if(x.fat)S.profile.fatp=x.fat;if(x.mus)S.profile.musp=x.mus;}
  save();render("io");toast("Pesata del "+gg+" aggiornata ✓");};

/* ═══════════════════════════════════════════════════════════════
   16. GOOGLE DRIVE SYNC (GSI + Drive REST, scope drive.appdata)
       Funziona solo da origine http/https registrata nel progetto.
   ═══════════════════════════════════════════════════════════════ */
let DTOKEN=null,tokenClient=null,driveReauthed=false;
/* Cache del token d'accesso Drive: dopo il primo consenso, entro la sua durata
   (~1h) l'app riusa il token salvato senza chiedere di nuovo l'accesso, anche
   dopo un riavvio. Alla scadenza si rinnova in silenzio. */
const DTOK_KEY="diario_dtoken";
// Questo dispositivo ha già completato una sincronizzazione con Drive? Serve a
// distinguere il PRIMO collegamento di un nuovo dispositivo (dove non bisogna
// mai spingere un profilo vuoto sopra un backup con dati veri di un altro
// dispositivo) dalle sincronizzazioni successive (dove basta confrontare i
// timestamp di contenuto).
const SYNCED_ONCE_KEY="diario_synced_once";
function hasRealLocalContent(){
  return !!(S.profile&&S.profile.dob) || (S.history&&S.history.length>0) || (S.profile&&S.profile.weights&&S.profile.weights.length>0);
}
function driveSaveToken(t){try{if(t&&t.access_token){DTOKEN=t.access_token;
  const exp=Date.now()+(((+t.expires_in||3600)-90)*1000);
  localStorage.setItem(DTOK_KEY,JSON.stringify({tok:t.access_token,exp}));}}catch(e){}}
function driveCachedToken(){try{const c=JSON.parse(localStorage.getItem(DTOK_KEY)||"null");
  if(c&&c.tok&&c.exp&&Date.now()<c.exp)return c.tok;}catch(e){}return null;}
function driveClearToken(){DTOKEN=null;try{localStorage.removeItem(DTOK_KEY);}catch(e){}}
/* Riacquisizione silenziosa del token (nessun popup se la sessione Google è
   attiva e il consenso è già stato dato in passato su questo dispositivo). */
function driveSilentAuth(){
  loadGSI(()=>{try{
    tokenClient=google.accounts.oauth2.initTokenClient({client_id:S.drive.cid,
      scope:"https://www.googleapis.com/auth/drive.appdata",
      callback:async t=>{if(t&&t.access_token){driveSaveToken(t);await driveSyncOnStart();
        const st=document.getElementById("driveStatus");if(st)st.textContent="✅ Sincronizzato con Drive.";}},
      error_callback:()=>{}});
    tokenClient.requestAccessToken({prompt:""});
  }catch(e){}});}
function loadGSI(cb){if(window.google&&google.accounts)return cb();
  const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";
  s.onload=cb;s.onerror=()=>dlgAlert("Impossibile caricare Google Identity (offline?).");document.head.appendChild(s);}
window.driveConnect=()=>{

  if(!S.drive.cid)return dlgAlert("Inserisci il CLIENT_ID.");

  loadGSI(()=>{
    tokenClient=google.accounts.oauth2.initTokenClient({client_id:S.drive.cid,
      scope:"https://www.googleapis.com/auth/drive.appdata",
      callback:async t=>{driveSaveToken(t);S.drive.on=true;save();
        document.getElementById("driveStatus").textContent="✅ Connesso. Sincronizzo…";
        await driveSyncOnStart();render("io");}});
    tokenClient.requestAccessToken();});};
async function driveFind(){
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27diario_backup.json%27&fields=files(id,modifiedTime)",
    {headers:{Authorization:"Bearer "+DTOKEN}});
  if(r.status===401){driveClearToken();throw new Error("auth");}
  const j=await r.json();return (j.files&&j.files[0])||null;}
/* Quanti "dati veri" contiene uno stato: serve per accorgersi se stiamo per
   sovrascrivere un backup pieno con uno molto più povero. */
function dataWeight(st){
  try{let n=0;
    n+=(st.history||[]).length*50;
    n+=(st.periods||[]).length*10;
    n+=((st.profile||{}).weights||[]).length*3;
    ((st.week||{}).days||[]).forEach(d=>{
      n+=(d.meals||[]).filter(m=>m.done||m.skip||m.custom).length;
      n+=(d.extras||[]).length+(d.workouts||[]).length;});
    return n;}catch(e){return 0;}}
window.driveUpload=async(silent)=>{
  if(!DTOKEN)return silent?null:dlgAlert("Connettiti prima a Drive.");
  try{const f=await driveFind();
    // controllo di sicurezza: se il backup remoto contiene molti più dati di
    // quelli locali, qualcosa non torna. Meglio chiedere che cancellare.
    if(f&&!S.drive.forceUp){try{
      const rr=await fetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media",{headers:{Authorization:"Bearer "+DTOKEN}});
      if(rr.ok){const remote=await rr.json();
        const wl=dataWeight(S),wr=dataWeight(remote);
        if(wr>0&&wl<wr*0.6){
          const ok=await dlgConfirm("⚠️ Attenzione: il backup su Drive contiene molti più dati di quelli presenti su questo dispositivo.\n\nSe hai perso dei dati, NON sovrascrivere: annulla e usa «Ripristina da Drive».\n\nOK = sovrascrivo comunque il backup · Annulla = lascio il backup intatto");
          if(!ok){const st0=document.getElementById("driveStatus");
            if(st0)st0.textContent="⏸️ Caricamento sospeso per sicurezza: il backup remoto è più completo.";
            drivePending=false;return;}
          S.drive.forceUp=true;}
      }}catch(e){}}
    const meta={name:"diario_backup.json",parents:f?undefined:["appDataFolder"]};
    const boundary="-------diario";const body=
      "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
      "\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(S)+"\r\n--"+boundary+"--";
    const url="https://www.googleapis.com/upload/drive/v3/files"+(f?"/"+f.id:"")+"?uploadType=multipart";
    await fetch(url,{method:f?"PATCH":"POST",
      headers:{Authorization:"Bearer "+DTOKEN,"Content-Type":"multipart/related; boundary="+boundary},body});
    const st=document.getElementById("driveStatus");if(st)st.textContent="✅ Salvato su Drive alle "+new Date().toLocaleTimeString("it-IT");
    try{localStorage.setItem(SYNCED_ONCE_KEY,"1");localStorage.setItem(SYNC_LAST_KEY,String(Date.now()));}catch(e2){}
    drivePending=false;
    driveDailyCopy();   // copia datata, così le versioni precedenti restano
  }catch(e){if(!silent)dlgAlert("Errore Drive: "+e.message);}};
/* Copia datata giornaliera su Drive: diario_YYYY-MM-DD.json, ne teniamo 7.
   Il file principale può essere sovrascritto, ma le versioni dei giorni
   scorsi restano recuperabili. */
async function driveDailyCopy(){
  try{
    const today=iso(new Date()),name="diario_"+today+".json";
    const q=encodeURIComponent("name contains 'diario_2'");
    const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+q+"&fields=files(id,name,modifiedTime)",
      {headers:{Authorization:"Bearer "+DTOKEN}});
    if(!r.ok)return;
    const files=((await r.json()).files||[]).filter(x=>/^diario_\d{4}-\d{2}-\d{2}\.json$/.test(x.name));
    if(files.some(x=>x.name===name))return;           // copia di oggi già fatta
    const meta={name,parents:["appDataFolder"]};
    const b="-------diarioC";const body=
      "--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
      "\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(S)+"\r\n--"+b+"--";
    await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {method:"POST",headers:{Authorization:"Bearer "+DTOKEN,"Content-Type":"multipart/related; boundary="+b},body});
    // rotazione: teniamo le 7 copie più recenti
    files.sort((a,b2)=>a.name<b2.name?1:-1);
    for(let i=6;i<files.length;i++)
      fetch("https://www.googleapis.com/drive/v3/files/"+files[i].id,{method:"DELETE",headers:{Authorization:"Bearer "+DTOKEN}}).catch(()=>{});
  }catch(e){}}
/* Avvio: riconnessione silenziosa se già autorizzato su questo dispositivo.
   1) se ho un token valido in cache lo riuso senza contattare Google (nessun
      popup, nessun "accesso a Drive"); 2) altrimenti provo il rinnovo silenzioso. */
function tryDriveAuto(){
  if(!(S.drive.on&&S.drive.cid)||location.protocol==="file:")return;
  const cached=driveCachedToken();
  if(cached){DTOKEN=cached;
    driveSyncOnStart().then(()=>{const st=document.getElementById("driveStatus");if(st)st.textContent="✅ Sincronizzato con Drive.";}).catch(()=>{});
    return;}
  driveSilentAuth();}
/* Importa da Drive su richiesta: scarica il backup e sostituisce i dati locali */
/* Elenco delle copie disponibili su Drive: il backup principale più le copie
   datate degli ultimi giorni, così si può tornare a una versione precedente. */
window.driveVersions=async()=>{
  if(!DTOKEN)return dlgAlert("Connettiti prima a Drive.");
  try{
    const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime,size)",
      {headers:{Authorization:"Bearer "+DTOKEN}});
    const files=((await r.json()).files||[]).filter(x=>/^diario_/.test(x.name))
      .sort((a,b)=>a.modifiedTime<b.modifiedTime?1:-1);
    if(!files.length)return dlgAlert("Nessuna copia trovata su Drive.");
    const list=files.map((f,i)=>(i+1)+") "+f.name.replace("diario_","").replace(".json","")+
      " — "+new Date(f.modifiedTime).toLocaleString("it-IT")+(f.size?" ("+Math.round(f.size/1024)+" KB)":"")).join("\n");
    const n=(await dlgPrompt("Copie disponibili su Drive:\n\n"+list+"\n\nScrivi il NUMERO della copia da ripristinare.\nPer cancellarne una scrivi «elimina» e il numero (es. elimina 2), oppure «elimina tutte»."))||"";
    if(!n.trim())return;
    const mDel=String(n).trim().toLowerCase().match(/^elimina\s*(\d+|tutte)$/);
    if(mDel){
      const tutte=(mDel[1]==="tutte");
      const target=tutte?files:[files[parseInt(mDel[1])-1]].filter(Boolean);
      if(!target.length)return dlgAlert("Numero non valido.");
      if(!await dlgConfirm(tutte?("Elimino da Drive tutte le "+files.length+" copie datate?\n\nIl backup principale non viene toccato."):("Elimino da Drive la copia «"+target[0].name+"»?"),{ok:"Elimina",ko:"No"}))return;
      for(const f of target)
        await fetch("https://www.googleapis.com/drive/v3/files/"+f.id,{method:"DELETE",headers:{Authorization:"Bearer "+DTOKEN}});
      toast("Eliminate da Drive: "+target.length+" ✓");
      return driveVersions();      /* riapre la lista aggiornata */
    }
    const f=files[parseInt(n)-1];if(!f)return dlgAlert("Numero non valido.");
    if(!await dlgConfirm("Ripristino «"+f.name+"» del "+new Date(f.modifiedTime).toLocaleString("it-IT")+"?\n\nI dati attuali del dispositivo vengono prima salvati in un'istantanea locale."))return;
    snapSave("prima del ripristino da Drive");
    const rr=await fetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media",{headers:{Authorization:"Bearer "+DTOKEN}});
    const data=await rr.text();
    localStorage.setItem(KEY,data);location.reload();
  }catch(e){dlgAlert("Errore Drive: "+e.message);}};

/* Elimina il backup da Drive: azione che riguarda TUTTI i dispositivi collegati */
window.driveDelete=async(silent)=>{
  if(!DTOKEN){if(!silent)dlgAlert("Connettiti prima a Drive.");return;}
  if(!silent&&!await dlgConfirm("Eliminare il backup da Google Drive?\n\nATTENZIONE: sparirà da TUTTI i dispositivi collegati a questo account, non solo da questo. I dati locali di questo dispositivo restano finché non li cancelli a parte."))return;
  try{
    /* va eliminato TUTTO: il backup principale e le copie datate, altrimenti
       restano visibili in "Versioni precedenti" */
    const all=await driveListAll();
    for(const f of all)
      await fetch("https://www.googleapis.com/drive/v3/files/"+f.id,{method:"DELETE",headers:{Authorization:"Bearer "+DTOKEN}});
    if(!silent){const st=document.getElementById("driveStatus");if(st)st.textContent="🗑️ Backup eliminati da Drive ("+all.length+").";
      render("io");dlgAlert("Eliminati da Drive: "+all.length+" file (backup principale e copie datate).");}
  }catch(e){if(!silent)dlgAlert("Errore eliminazione: "+e.message);}};
/* Tutti i file dell'app su Drive: backup principale + copie datate */
async function driveListAll(){
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime,size)",
    {headers:{Authorization:"Bearer "+DTOKEN}});
  return ((await r.json()).files||[]).filter(x=>/^diario/.test(x.name))
    .sort((a,b)=>a.modifiedTime<b.modifiedTime?1:-1);}
async function driveSyncOnStart(){ // confronta i timestamp DI CONTENUTO e allinea in silenzio
  try{const f=await driveFind();if(!f){try{localStorage.setItem(SYNCED_ONCE_KEY,"1");}catch(e2){}return driveUpload();}
    // Scarico il contenuto e confronto remote.meta.updated con S.meta.updated:
    // sono entrambi scritti dallo stesso save(), quindi sullo STESSO dispositivo
    // combaciano (niente più falso avviso "versione più recente" a ogni avvio).
    // Non uso f.modifiedTime (ora del file sul server), che è sempre leggermente
    // successiva al contenuto e faceva scattare l'avviso ogni volta.
    const r=await fetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media",{headers:{Authorization:"Bearer "+DTOKEN}});
    if(r.status===401){driveClearToken();throw new Error("auth");}
    const remote=await r.json();
    const rT=new Date((remote&&remote.meta&&remote.meta.updated)||0).getTime();
    const lT=new Date((S&&S.meta&&S.meta.updated)||0).getTime();
    const firstSyncOnThisDevice=!localStorage.getItem(SYNCED_ONCE_KEY);

    if(firstSyncOnThisDevice){
      // Primo collegamento di QUESTO dispositivo: un dispositivo appena aperto
      // non ha un timestamp di contenuto significativo (è solo il momento in
      // cui il profilo vuoto è stato creato), quindi non va MAI usato per
      // decidere di sovrascrivere un backup che può contenere i dati veri di
      // un altro dispositivo — è esattamente il bug che impediva la
      // sincronizzazione tra telefono e tablet. Se qui non c'è nulla di
      // reale, adottiamo sempre il backup in silenzio; se invece questo
      // dispositivo ha già dati suoi mai sincronizzati, chiediamo una sola volta.
      if(!hasRealLocalContent()){
        S=remote;localStorage.setItem(KEY,JSON.stringify(S));
        try{localStorage.setItem(SYNCED_ONCE_KEY,"1");}catch(e2){}
        location.reload();return;
      }
      const useRemote=await dlgConfirm("Questo dispositivo non si è mai sincronizzato con Drive. È già presente un backup del "+
        new Date(remote.meta&&remote.meta.updated||f.modifiedTime).toLocaleString("it-IT")+
        ".\n\nQuali dati tengo? Con quelli di Drive perdi ciò che esiste solo su questo dispositivo; tenendo quelli locali sovrascrivi il backup.",
        {ok:"Uso quelli di Drive",ko:"Tengo quelli locali"});
      try{localStorage.setItem(SYNCED_ONCE_KEY,"1");}catch(e2){}
      if(useRemote){S=remote;localStorage.setItem(KEY,JSON.stringify(S));location.reload();}
      else{await driveUpload();}
      return;
    }

    if(rT>lT+2000){ // il remoto è davvero più recente (modifica da un altro dispositivo): lo adotto in silenzio
      S=remote;localStorage.setItem(KEY,JSON.stringify(S));location.reload();
    }else if(lT>rT+2000){ // il locale è più recente: aggiorno Drive
      await driveUpload();
    } // altrimenti sono allineati: non faccio nulla
  }catch(e){ if(String(e&&e.message)==="auth"&&!driveReauthed){driveReauthed=true;driveSilentAuth();} }}

/* Banner (non popup) per gli allenamenti di ieri dimenticati */
function yIdx(){const y=new Date();y.setDate(y.getDate()-1);return wd(y);}
function unmarkedOfDay(di){return dayItems(di).filter(it=>{const st=S.week.days[it.pdi].meals[it.mi];return !st.done&&!st.skip;}).length;}
function dayCompleted(di){return dayItems(di).length>0&&unmarkedOfDay(di)===0;}
/* Settimana "scaduta": è iniziata prima del lunedì corrente e va convalidata */
function weekStale(){const m=new Date();m.setHours(12,0,0,0);m.setDate(m.getDate()-wd(m));return S.week.started<iso(m);}

/* v5 — Revisione persistente: i giorni passati con pasti non spuntati (o ieri
   senza sport) restano in un banner FISSO finché non premi "Completa" su
   ciascuno. Sopravvive al cambio di giorno (non è più "solo per oggi"). */
function pendingReviewDays(){ // promemoria di IERI: pasti, sport e acqua
  S.ui.reviewDone=S.ui.reviewDone||{};
  if(wd(new Date())===0)return [];      // lunedì: ieri è nella settimana chiusa
  const di=yIdx(),dISO=isoOfPdi(di);
  if(S.ui.reviewDone[dISO])return [];
  const missMeals=unmarkedOfDay(di)>0;
  const missSport=S.week.days[di].workouts.length===0;
  const missWater=(S.week.days[di].water||0)===0;
  return (missMeals||missSport||missWater)?[{di,dISO,missMeals,missSport,missWater}]:[];}
function isoOfPdi(di){ // ISO del giorno di piano `di` nella settimana corrente
  const mon=new Date();mon.setHours(12,0,0,0);mon.setDate(mon.getDate()-wd(mon));
  const d=new Date(mon);d.setDate(mon.getDate()+di);return iso(d);}

window.goReview=(di)=>{const mon=new Date();mon.setHours(12,0,0,0);mon.setDate(mon.getDate()-wd(mon)+di);VIEW=mon;renderHeader();render("oggi");};

/* ═══════════════════════════════════════════════════════════════
   FX ENGINE — reveal allo scroll, header dinamico, zoom grafici.
   Rispetta prefers-reduced-motion (le animazioni CSS si spengono
   da sole; qui evitiamo anche di nascondere gli elementi).
   ═══════════════════════════════════════════════════════════════ */
const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let _rvObs=null;

/* ── ZOOM GRAFICI: tap su un grafico → overlay con pinch/rotella/drag ── */
let ZM={s:1,x:0,y:0,drag:null,pinch:0};
function ensureZoomOv(){
  let ov=document.getElementById("zoomOv");
  if(ov)return ov;
  ov=document.createElement("div");ov.id="zoomOv";
  ov.innerHTML=`<div class="zhint">🔍 Rotella / pinch per zoom · trascina per muoverti · doppio tap per resettare</div>
  <img id="zoomImg" alt="grafico ingrandito">
  <div class="ztools">
    <button onclick="zoomBy(1.35)" title="Zoom +">＋</button>
    <button onclick="zoomBy(1/1.35)" title="Zoom −">－</button>
    <button onclick="zoomReset()" title="Reimposta">⤾</button>
    <button onclick="closeZoom()" title="Chiudi">✕</button></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{if(e.target===ov)closeZoom();});
  const img=ov.querySelector("#zoomImg");
  ov.addEventListener("wheel",e=>{e.preventDefault();zoomBy(e.deltaY<0?1.18:1/1.18);},{passive:false});
  img.addEventListener("pointerdown",e=>{e.preventDefault();ZM.drag={x:e.clientX-ZM.x,y:e.clientY-ZM.y};img.setPointerCapture(e.pointerId);img.style.cursor="grabbing";});
  img.addEventListener("pointermove",e=>{if(!ZM.drag)return;ZM.x=e.clientX-ZM.drag.x;ZM.y=e.clientY-ZM.drag.y;applyZoom();});
  img.addEventListener("pointerup",()=>{ZM.drag=null;img.style.cursor="grab";});
  img.addEventListener("dblclick",zoomReset);
  let lastTap=0;
  img.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTap<300)zoomReset();lastTap=now;});
  ov.addEventListener("touchmove",e=>{ // pinch a due dita
    if(e.touches.length===2){e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(ZM.pinch)zoomBy(d/ZM.pinch,true);
      ZM.pinch=d;}
  },{passive:false});
  ov.addEventListener("touchend",()=>{ZM.pinch=0;});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeZoom();});
  return ov;
}
function applyZoom(){const img=document.getElementById("zoomImg");
  if(img)img.style.transform=`translate(${ZM.x}px,${ZM.y}px) scale(${ZM.s})`;}
window.zoomBy=(f,raw)=>{ZM.s=Math.max(.5,Math.min(8,ZM.s*(raw?f:f)));applyZoom();};
window.zoomReset=()=>{ZM={s:1,x:0,y:0,drag:null,pinch:0};applyZoom();};
window.closeZoom=()=>{const ov=document.getElementById("zoomOv");if(ov)ov.classList.remove("on");};
window.openZoom=(dataURL)=>{const ov=ensureZoomOv();
  ov.querySelector("#zoomImg").src=dataURL;zoomReset();ov.classList.add("on");};

/* ═══ AGGIORNAMENTO AUTOMATICO ══════════════════════════════════════
   L'app è un singolo file servito via HTTP: all'avvio scarichiamo la copia
   fresca dal server (bypassando la cache) e confrontiamo la versione.
   Se ce n'è una più nuova: primo tentativo = ricarica automatica silenziosa;
   se la cache resiste, la nuova pagina viene applicata direttamente dal testo
   appena scaricato. L'utente non deve fare niente. */
function cmpVer(a,b){const pa=String(a).split(".").map(Number),pb=String(b).split(".").map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pa[i]||0)-(pb[i]||0);if(d)return d;}return 0;}
async function checkAppUpdate(){
  try{
    if(location.protocol!=="http:"&&location.protocol!=="https:")return;
    const url=location.href.split("#")[0];
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok)return;
    const t=await r.text();
    const m=t.match(/APP_VER\s*=\s*"([\d.]+)"/);
    if(!m||cmpVer(m[1],APP_VER)<=0)return;
    const remote=m[1];
    const k="nutryUpd_"+remote;
    if(!sessionStorage.getItem(k)){
      sessionStorage.setItem(k,"1");
      toast("Nuova versione "+remote+": aggiorno Nutry…");
      setTimeout(()=>location.reload(),800);
      return;
    }
    /* la ricarica non è bastata (cache ostinata): applichiamo direttamente
       l'HTML appena scaricato — i dati in localStorage restano intatti */
    if(await dlgConfirm("È disponibile Nutry "+remote+" (stai usando la "+APP_VER+").\n\nAggiorno adesso? I tuoi dati restano al loro posto.")){
      try{document.open();document.write(t);document.close();}
      catch(e){location.reload();}
    }
  }catch(_){}
}

(function(){

})();

/* Prompt d'installazione automatico: quando il browser segnala che l'app è
   installabile mostriamo un banner "Installa". */
(function(){
  let deferredPrompt=null;
  const KEY_DISMISS="nutri_install_dismiss";
  function isStandalone(){return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;}
  function showBanner(){
    if(isStandalone())return;
    if(document.getElementById("install-banner"))return;
    if(!document.body){document.addEventListener("DOMContentLoaded",showBanner);return;}
    const b=document.createElement("div");
    b.id="install-banner";
    b.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:9999;background:linear-gradient(135deg,#0F3D20,#2F7D3B);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-family:inherit;";
    b.innerHTML='<span style="font-size:22px">📲</span><div style="flex:1;font-size:13px;line-height:1.35"><b>Installa Nutry</b><br><span style="opacity:.9;font-size:12px">Aggiungila alla schermata Home per aprirla come app.</span></div>'+
      '<button id="install-yes" style="background:#fff;color:#0F3D20;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer">Installa</button>'+
      '<button id="install-no" aria-label="Chiudi" style="background:transparent;color:#d6e6da;border:0;font-size:18px;cursor:pointer;padding:4px 6px">✕</button>';
    document.body.appendChild(b);
    document.getElementById("install-no").onclick=()=>{try{localStorage.setItem(KEY_DISMISS,String(Date.now()));}catch(e){}b.remove();};
    document.getElementById("install-yes").onclick=async()=>{
      if(deferredPrompt){b.remove();deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;}
      else{dlgAlert('Per installare: apri il menu del browser (⋮) e scegli "Installa app" oppure "Aggiungi a schermata Home".');}
    };
  }
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();deferredPrompt=e;
    let dis=0;try{dis=+localStorage.getItem(KEY_DISMISS)||0;}catch(e2){}
    if(Date.now()-dis>7*24*3600*1000)showBanner();
  });
  window.addEventListener("appinstalled",function(){const b=document.getElementById("install-banner");if(b)b.remove();deferredPrompt=null;try{localStorage.removeItem(KEY_DISMISS);}catch(e){}});
})();
/* Caricamento su Drive anche quando esci dall'app: così il ritardo non
   diventa un rischio di perdere l'ultima mezz'ora di lavoro. */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")driveFlush();});
window.addEventListener("pagehide",driveFlush);
/* Qualsiasi errore non gestito diventa visibile invece di lasciare
   una schermata bianca. */
window.addEventListener("error",function(ev){
  try{
    if(document.querySelector(".page.active")&&document.querySelector(".page.active").innerHTML.trim())return;
    const el=document.querySelector(".page.active")||document.getElementById("pg-oggi");
    if(el&&!el.innerHTML.trim())el.innerHTML=errorCardHTML(cur||"avvio",ev.error||ev.message);
  }catch(_){}
});
/* Avvio protetto: se qualcosa esplode, l'app resta comunque utilizzabile
   e mostra come recuperare. */
(function boot(){
  try{snapSave("giornaliera");}catch(e){}
  try{applyTheme();}catch(e){}
  try{bumpStreak();}catch(e){}
  try{renderHeader();}catch(e){}
  try{tryDriveAuto();}catch(e){}
  let start="oggi";
  try{start=S.onboard.done?(S.profile.dob?"oggi":"io"):"benvenuto";}catch(e){}
  try{show(start);}
  catch(e){
    try{
      const el=document.getElementById("pg-oggi");
      if(el){el.classList.add("active");el.innerHTML=errorCardHTML("avvio",e);}
    }catch(_){
      document.body.innerHTML='<div style="padding:24px;font-family:system-ui">'+
        '<h2>Nutry non è riuscita a partire</h2><p>I dati sono ancora sul dispositivo.</p>'+
        '<p><a href="javascript:location.reload()">Ricarica</a></p></div>';}
  }
  try{if(weekStale())autoCloseStaleWeeks().then(()=>{renderHeader();render(cur);}).catch(()=>{});}catch(e){}
})();
</script>
