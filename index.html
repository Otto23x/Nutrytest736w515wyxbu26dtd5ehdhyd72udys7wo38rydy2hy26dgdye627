/* ═══ 🗺️ PIATTI TIPICI DI DOVE SEI ═══════════════════════════════
   In viaggio il piano non aiuta granché: qui si parte dalla cucina del
   posto e si arriva a cosa ordinare restando nel target del pasto.
   La posizione serve solo a capire REGIONE e NAZIONE: le coordinate
   vengono arrotondate (~11 km), non vengono mai salvate e l'unica cosa
   che viaggia è quella coppia di numeri dentro la richiesta all'AI. */
let GEO={place:"",dishes:[],seen:[],at:0};
const GEO_TTL=60*60*1000;   /* la zona vale un'ora: poi si richiede dove sei */
function geoFresh(){if(GEO.at&&Date.now()-GEO.at>GEO_TTL)GEO={place:"",dishes:[],seen:[],at:0};}
function geoPos(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej(new Error("nogeo"));
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:Math.round(p.coords.latitude*10)/10,lon:Math.round(p.coords.longitude*10)/10}),
    e=>rej(new Error(e&&e.code===1?"negato":"nogeo")),
    {timeout:12000,maximumAge:600000,enableHighAccuracy:false});});}
async function geoAskPlace(motivo){
  const v=await dlgPrompt(motivo+"\n\nScrivi dove ti trovi — basta la regione o la città, il paese se sei all'estero (es. «Trentino», «Napoli», «Andalusia, Spagna»).\n\nLascia vuoto per uscire.",GEO.place||"");
  const t=String(v||"").trim();
  return t||null;}
window.geoDishes=async(di,ancora)=>{
  if(!aiOn())return aiFail(new Error("nokey"));
  const box=document.getElementById("geoOut");
  geoFresh();
  let place=GEO.place,coords=null;
  if(!ancora||!place){
    if(!place){
      box.style.display="block";box.textContent="📍 Chiedo la posizione…";
      try{coords=await geoPos();}
      catch(e){
        const motivo=(e.message==="negato")
          ? "📍 Senza la posizione non posso sapere quali piatti regionali suggerirti."
          : "📍 Non riesco a leggere la posizione (GPS spento, permesso mai dato o segnale assente).";
        box.textContent="";
        place=await geoAskPlace(motivo);
        if(!place)return;                       /* l'utente esce */
        GEO.place=place;GEO.seen=[];
      }
    }
  }
  const tgt=selTarget("geoTarget",di);
  box.style.display="block";
  box.textContent=(ancora?"🗺️ Cerco altre proposte":"🗺️ Cerco i piatti tipici")+(place?" di "+place:" della zona")+"…";
  try{
    const dove=place
      ? 'La persona si trova in: '+place+'. Se è una città, ragiona sulla REGIONE a cui appartiene.'
      : 'Coordinate approssimate della persona (arrotondate a ~11 km): latitudine '+coords.lat+', longitudine '+coords.lon+
        '. Deduci REGIONE e NAZIONE (non il comune) e dichiarale nella prima riga.';
    const t=await aiAsk(dove+
      ' In questo momento, secondo il mio piano, dovrei mangiare: '+tgt.slot+' da circa '+tgt.kAdj+' kcal e '+tgt.p+' g di proteine.'+compNote(tgt)+' '+rulesForAI()+
      (GEO.seen.length?' NON riproporre questi piatti, già suggeriti: '+GEO.seen.join("; ")+'.':'')+
      ' Proponi 3 piatti TIPICI di quella regione (o della cucina nazionale se la regione non ha piatti propri adatti) che rispettino i miei vincoli e stiano vicini al target.'+
      ' FONDAMENTALE: devono essere adatti al pasto «'+tgt.slot+'». Per colazione o metà mattina proponi ciò che davvero si mangia lì a quell\'ora — dolci da forno tradizionali, latticini, pane, frutta, bevande tipiche — e MAI secondi di carne, primi o piatti da pranzo. Per pranzo e cena proponi piatti completi. Per merenda o aperitivo qualcosa di piccolo e tipico del posto.'+
      ' Per ciascuno: nome del piatto, una riga su cos\'è e perché è tipico di lì, come ordinarlo o adattarlo per rientrare nel target (porzione, contorno, condimento a parte), kcal e proteine stimate.'+
      ' Se un piatto tipico della zona è incompatibile con i miei vincoli, dillo e spiega perché invece di proporlo.'+
      ' Rispondi SOLO JSON: {"zona":"Regione, Nazione","piatti":[{"nome":"...","tipico":"...","come":"...","kcal":n,"prot":n}]}');
    const j=parseAIJSON(t);
    const zona=String(j.zona||place||"zona sconosciuta");
    const arr=(j.piatti||[]).filter(x=>x&&x.nome);
    if(!arr.length)throw new Error("nessun piatto proposto");
    GEO.place=GEO.place||zona;GEO.at=Date.now();
    GEO.dishes=arr;
    arr.forEach(x=>GEO.seen.push(String(x.nome)));
    let h="📍 <b>"+esc(zona)+"</b>"+(GEO.seen.length>arr.length?" · altre proposte":"")+"\n\n";
    arr.forEach((x,i)=>{
      h+="<b>"+esc(x.nome)+"</b> — ~"+Math.round(x.kcal||0)+" kcal · "+Math.round(x.prot||0)+" g prot\n"+
         esc(x.tipico||"")+"\n<i>"+esc(x.come||"")+"</i>\n"+
         '<div class="btngrid3" style="margin:6px 0 14px">'+
         '<button class="btn small" onclick="geoUse('+di+','+i+')">Usa per il pasto</button>'+
         '<button class="btn ghost small" onclick="geoExtra('+di+','+i+')">+ Extra</button>'+
         '<button class="btn ghost small" onclick="geoSave('+i+')">⭐ Salva</button></div>';
    });
    h+='<div class="btngrid2" style="margin-top:4px">'+
       '<button class="btn ghost small" onclick="geoDishes('+di+',true)">🔄 Altre proposte</button>'+
       '<button class="btn ghost small" onclick="geoReset('+di+')">📍 Cambia posto</button></div>';
    box.innerHTML=h;
  }catch(e){box.textContent="";aiFail(e);}};

/* Il piano è un MODELLO statico: niente spunte, niente extra (quelli stanno in
   Oggi). Le modifiche fatte qui (opzione / ✏️ / 🎲) sono PERMANENTI: restano
   effettive anche nelle settimane successive, perché vivono in S.permMeals. */
function templateOpt(pdi,mi){const perm=S.permMeals[pdi+"_"+mi];if(perm)return perm;return PLAN[pdi].meals[mi].o[0];}
function plannedTemplateOfDay(di){let k=0,p=0,c=0,f=0,fib=0,z=0;PLAN[di].meals.forEach((m,mi)=>{const o=templateOpt(di,mi);k+=o.k;p+=o.p;c+=(o.c||0);f+=(o.f||0);fib+=(o.fib||0);z+=(o.z||0);});return{k,p,c,f,fib,z};}
function mealCardStatic(pdi,mi){const m=PLAN[pdi].meals[mi];const o=templateOpt(pdi,mi);
  const permObj=S.permMeals[pdi+"_"+mi];const isCustom=!!permObj;
  let h=`<div class="meal"><div class="mbody">
    <div class="mtop"><span class="mname">${esc(m.n)}</span><span class="mtime">${m.t.replace(/\s*\(portatile\)/,"")}</span></div>
    <div class="mdesc">${esc(o.d)}</div>
    <div class="mkcal">~${o.k} kcal · ${o.p} g P${o.c!=null?` · ${o.c} g C`:""}${o.f!=null?` · ${o.f} g G`:""}${o.fib!=null?` · ${o.fib} g F`:""}${o.z!=null?` · ${o.z} g Z`:""} ${isCustom?'<span class="badge ai">modificato</span>':""}</div>`;
  if(m.o.length>1){h+=`<div class="mopts">`+m.o.map((x,oi)=>{
      const sel=isCustom?(permObj.d===x.d):(oi===0);
      return `<button class="${sel?"sel":""}" onclick="setPermOpt(${pdi},${mi},${oi})">${optLabel(x,oi)}</button>`;}).join("")+`</div>`;}
  h+=`<div class="mtools" style="margin-top:4px">
    <button class="ibtn" title="Modifica permanente" onclick="editMealPerm(${pdi},${mi})">✏️</button>
    <button class="ibtn" title="Alternativa AI a parità di macro (permanente)" onclick="altMealPerm(${pdi},${mi})">🎲</button>`;
  if(isCustom)h+=`<button class="ibtn" title="Ripristina originale" onclick="resetPerm(${pdi},${mi})">↩️</button>`;
  h+=`</div></div></div>`;return h;}
window.setPermOpt=(d,m,oi)=>{const o=PLAN[d].meals[m].o[oi];
  if(oi===0)delete S.permMeals[d+"_"+m];else S.permMeals[d+"_"+m]={d:o.d,k:o.k,p:o.p,c:o.c!=null?o.c:null,f:o.f!=null?o.f:null};

window.resetPerm=(d,m)=>{delete S.permMeals[d+"_"+m];save();render("piano");};
window.editMealPerm=async(d,m)=>{const o=templateOpt(d,m);const nd=await dlgPrompt("Modifica permanente del piano (resta effettiva sempre):",o.d);
  if(nd==null||!nd.trim())return;let k=o.k,p=o.p,c=o.c,f=o.f;
  if(aiOn()&&await dlgConfirm("Vuoi che l'AI ristimi kcal e macro del pasto modificato?")){
    try{const t=await aiAsk('Stima calorie e macro di questo pasto: "'+nd+'". Rispondi SOLO JSON: {"kcal":numero,"prot":numero,"carb":numero,"gras":numero}');
      const j=parseAIJSON(t);k=Math.round(j.kcal);p=Math.round(j.prot);c=Math.round(j.carb)||null;f=Math.round(j.gras)||null;}catch(e){aiFail(e);return;}}

/* Accessibilità: le spunte custom espongono il loro stato agli screen reader */
function ariaSync(root){
  const el=root||document;
  el.querySelectorAll(".ck").forEach(l=>{
    const inp=l.querySelector("input[type=checkbox],input[type=radio]");
    if(!inp)return;
    l.setAttribute("role",inp.type==="radio"?"radio":"checkbox");
    l.setAttribute("aria-checked",inp.checked?"true":"false");
    if(!inp._ariaBound){inp._ariaBound=true;
      inp.addEventListener("change",()=>l.setAttribute("aria-checked",inp.checked?"true":"false"));}});
  el.querySelectorAll(".water span").forEach((sp,i)=>{
    sp.setAttribute("role","checkbox");
    sp.setAttribute("aria-checked",sp.className.indexOf("f")>-1?"true":"false");
    sp.setAttribute("aria-label","Bicchiere "+(i+1));});
  el.querySelectorAll(".chk").forEach(c=>{
    c.setAttribute("role","checkbox");
    c.setAttribute("aria-checked",c.className.indexOf("c")>-1?"true":"false");});}

let scanner=null;

window.scanStart=(di,pdi,mi,ei)=>{

/* ═══════════════════════════════════════════════════════════════
   SPESA DAL PIANO (senza AI): calcola la lista considerando per ogni
   pasto UNA SOLA opzione — sempre quella "a casa" (mai mensa, mai il
   LIBERO che prevede di mangiare fuori). Così se poi mangi fuori, la
   roba avanzata resta buona per la settimana dopo. Sincronizzazione
   con anteprima delle differenze e conferma esplicita.
   ═══════════════════════════════════════════════════════════════ */
/* Opzione "a casa" di un pasto per la spesa (o null se si mangia fuori) */
function homeOptForShop(m){
  if(!m||!m.o||!m.o.length)return null;
  /* se i pasti fuori casa te li prepari tu, gli ingredienti vanno comprati */
  if(m.type==="mensa")return outTypeIsPorto()?m.o[0]:null;
  if(m.type==="free"){ // tra le due opzioni scegli quella NON "fuori"
    const home=m.o.find(o=>!/^\s*(libero|mensa)\b/i.test(o.d||""));
    return home||null;
  }
  return m.o[0];
}
/* Come homeOptForShop, ma decide sui GIORNI fuori casa dalle spunte della
   settimana (più affidabile del type, che nei piani vecchi può essere sbagliato):
   se quel pasto è nei giorni fuori casa, entra nella spesa solo se lo prepari tu. */
function shopOptOf(d,m){
  if(!m||!m.o||!m.o.length)return null;
  const fm=parseMensa(outThisWeek());
  const dk=MENSA_DAYS.find(x=>x[1]===d.day);const v=dk?fm[dk[0]]:null;
  const sl=String(m.n||"").toLowerCase();
  const isOut=v&&((v==="entrambi"&&/pranzo|cena/.test(sl))||(v==="pranzo"&&/pranzo/.test(sl))||(v==="cena"&&/cena/.test(sl)));
  if(isOut)return outTypeIsPorto()?m.o[0]:null;
  return homeOptForShop(m);
}
/* Categoria della spesa in base a parole chiave dell'ingrediente */
/* Classificazione per REPARTO, non per macronutriente: le stesse categorie
   generiche usate anche dall'AI, così un prodotto finisce sempre nello stesso
   posto sia che la lista la calcoli l'app sia che la generi l'AI. */
function shopCatOf(s){s=(s||"").toLowerCase();
  if(/pollo|tacchino|manzo|vitell|maiale|prosciutto|bresaola|salame|carne|salmone|branzino|orata|tonno|merluzzo|gamber|sgombro|pesce|sushi/.test(s))return "Carne e pesce";
  if(/uova|uovo|kefir|yogurt|latte|ricotta|fiocchi di latte|mozzarell|caprino|scamorza|parmigiano|formagg|burro|skyr/.test(s))return "Uova e latticini";
  if(/pane|crostin|pasta|riso|quinoa|avena|farro|orzo|cous|couscous|fette biscottate|cracker|cereali|farina|pizza|piadina|gnocchi|polenta/.test(s))return "Cereali, pane e derivati";
  if(/ceci|fagioli|lenticchi|piselli|fave|soia|edamame|hummus|tofu|tempeh/.test(s))return "Legumi";
  if(/insalata|valeriana|verdur|carote|cetriol|cipoll|rucola|spinaci|zucchin|melanzan|peperon|pomodor|broccol|cavol|finocchi|patate|patata|zucca|funghi|asparag|sedano|porro|minestr|zuppa|passato/.test(s))return "Verdura";
  if(/frutta|frutto|frutti di bosco|limone|mela|pera|banana|arancia|kiwi|pesca|albicocc|uva|fragol|lampon|mirtill|anguria|melone|ananas|mango|datter|prugn/.test(s))return "Frutta";
  if(/olio|evo|semi|noci|noce|mandorl|nocciol|pistacch|anacard|avocado|olive|burro di arachidi|tahini/.test(s))return "Grassi, semi e frutta secca";
  if(/tisana|tisane|caffè|caffe|tè|the|acqua|sale|spezie|aceto|zucchero|miele|marmellat|cioccolat|integrator|gelato|bevanda|succo|vino|birra/.test(s))return "Dispensa e bevande";
  return "Altro";
}
/* Pulisce un pezzo di descrizione ("Pollo 200g" ecc.) */
function cleanIngredient(x){return (x||"").replace(/^\s*(🌸|☀️|🍂|❄️)\s*/,"").replace(/^\s*(libero|mensa)\s*:\s*/i,"").replace(/\s+/g," ").trim();}
/* Chiave per de-duplicare ingredienti simili ignorando le grammature */
function ingrKey(x){return cleanIngredient(x).toLowerCase().replace(/\d+[.,]?\d*\s*(g|kg|ml|l|gr|scatolette?|pallina)?/g,"").replace(/[^a-zàèéìòù ]/g,"").replace(/\s+/g," ").trim();}
/* Quantità: legge "150g", "1,5 kg", "200 ml" e le somma sulla settimana */
function parseQty(x){const m=String(x).match(/(\d+[.,]?\d*)\s*(kg|gr|g|ml|cl|l)\b/i);
  if(!m)return null;
  let v=parseFloat(m[1].replace(",","."));if(!(v>0))return null;
  let u=m[2].toLowerCase();
  if(u==="kg"){v*=1000;u="g";}else if(u==="gr"){u="g";}
  else if(u==="l"){v*=1000;u="ml";}else if(u==="cl"){v*=10;u="ml";}
  return {v:v,u:u};}
function fmtQty(v,u){
  const big=(x,lbl)=>String(Math.round(x/10)/100).replace(".",",")+" "+lbl;  /* 1050 g → 1,05 kg */
  if(u==="g"&&v>=1000)return big(v,"kg");
  if(u==="ml"&&v>=1000)return big(v,"l");
  return Math.round(v)+" "+u;}
/* Nome pulito senza la grammatura del singolo pasto */
function ingrName(x){return cleanIngredient(x)
  .replace(/\(?\s*\d+[.,]?\d*\s*(kg|gr|g|ml|cl|l)\b\s*\)?/ig," ")
  .replace(/\s{2,}/g," ").replace(/^[\s,;+·-]+|[\s,;+·-]+$/g,"").trim();}
/* Costruisce la lista della spesa dal piano (opzioni a casa) */
/* Le descrizioni dei pasti non usano sempre il "+": spesso sono frasi
   ("riso condito con olio, abbinato a petto di pollo e zucchine grigliate").
   Qui si spezzano anche su virgole e congiunzioni, si buttano le note fra
   parentesi e si scartano i frammenti che sono istruzioni, non ingredienti. */
const SHOP_STOP=/^(condit[oaie]|abbinat[oaie]|accompagnat[oaie]|serv[a-z]+|cott[oaie]|grigliat[oaie]|lessat[oaie]|saltat[oaie]|al vapore|al forno|ai ferri|a crudo|peso crudo|q\.?b\.?|privat[oaie].*|senza .*|circa|un filo|a piacere|opzionale)$/i;
const SHOP_COOK=/(condit|abbinat|accompagnat|servit|cott|grigliat|lessat|saltat|tostat|scottat|bollit|arrostit|sbucciat|privat|tagliat|frullat|mescolat)[oaie]/i;
function shopParts(txt){
  return String(txt||"")
    .replace(/\([^)]*\)/g," ")                       /* via le note fra parentesi */
    .split(/\+|,|;|\bcon\b|\be\b|\bo\b|\boppure\b|\babbinat[oaie]\sa\b|\baccompagnat[oaie]\sda\b/i)
    .map(x=>x.replace(/\s+/g," ").trim())
    /* via i participi di cottura attaccati all'inizio o alla fine del pezzo */
    .map(x=>x.replace(new RegExp("^\\s*"+SHOP_COOK.source+"\\s+","i"),"")
             .replace(new RegExp("\\s+"+SHOP_COOK.source+"\\s*$","i"),"")
             .replace(/\s+/g," ").trim())
    .filter(x=>x.length>2&&x.length<60&&!SHOP_STOP.test(x)&&/[a-zà-ù]{3}/i.test(x));}
/* ═══ FINESTRA DELLA SPESA ════════════════════════════════════════
   La settimana della spesa NON è lunedì-domenica: parte dal giorno in cui
   la fai. Chi fa la spesa di mercoledì deve coprire da mercoledì al martedì
   successivo. I pasti di oggi già spuntati o saltati sono esclusi: quelli
   sono già stati mangiati, non vanno comprati. */
function shopWindow(){
  const t=wd(new Date()),out=[];
  for(let n=0;n<7;n++){
    const di=(t+n)%7;const d=PLAN[di];if(!d)continue;
    d.meals.forEach(function(m,mi){
      if(n===0){const st=S.week.days[di]&&S.week.days[di].meals[mi];
        if(st&&(st.done||st.skip))return;}
      out.push({di:di,mi:mi,d:d,m:m});});}
  return out;}
function shopWindowLabel(){
  const t=wd(new Date());
  return PLAN[t]?("da "+PLAN[t].day+" a "+PLAN[(t+6)%7].day):"7 giorni";}
function buildShopFromPlan(){
  const order=SHOP_CATS,acc={},seq=[];
  const fact=shopForMe()?1:Math.max(1,famUnits());
  shopWindow().forEach(function(w){const d=w.d,m=w.m;
    const o=shopOptOf(d,m);if(!o)return;
    shopParts(o.d).forEach(function(part){
      const ing=cleanIngredient(part);if(!ing)return;
      const key=ingrKey(ing);if(!key)return;
      const q=parseQty(ing),nm=ingrName(ing)||ing;
      if(!acc[key]){acc[key]={cat:shopCatOf(ing),name:nm,v:0,u:null,n:0};seq.push(key);}
      const a=acc[key];a.n++;
      if(nm.length>a.name.length)a.name=nm;          /* tiene la dicitura più esplicita */
      if(q){if(!a.u)a.u=q.u;if(a.u===q.u)a.v+=q.v;}
    });
  });
  const byCat={};
  seq.forEach(k=>{const a=acc[k];
    const label=(a.u&&a.v>0)?(a.name+" "+fmtQty(a.v*fact,a.u)):(a.n>1?a.name+" ×"+a.n:a.name);
    (byCat[a.cat]=byCat[a.cat]||[]).push(label);});
  const out=[];order.forEach(cat=>{if(byCat[cat]&&byCat[cat].length)out.push([cat,byCat[cat]]);});
  Object.keys(byCat).forEach(cat=>{if(!order.includes(cat))out.push([cat,byCat[cat]]);});
  return out;
}

function weekSummary(){
  const days=PLAN.map((d,di)=>{const e=eatenOfDay(di),pl=plannedOfDay(di),D=S.week.days[di];
    // si salva TUTTO ciò che serve all'esportazione: le settimane archiviate
    // devono avere gli stessi campi di quella in corso, non zeri
    return {day:d.day,eat:e.k,prot:e.p,c:e.c,f:e.f,fib:e.fib,z:e.z||0,
      cycle:!!D.cycle,lact:D.lact||"no",physK:D.physK||0,hungerAvg:D.hungerAvg||0,
      planK:pl.k,planP:pl.p,planC:pl.c||0,planF:pl.f||0,planFib:pl.fib||0,planZ:pl.z||0,
      burn:burnedOfDay(di),def:deficitOfDay(di),tdee:tdeeOfDay(di),sk:skippedOfDay(di),
      mealsDone:dayItems(di).filter(it=>S.week.days[it.pdi].meals[it.mi].done).length,
      mealsTot:dayItems(di).length,extrasN:D.extras.filter(x=>x.st!=="skip").length,
      recovered:D.rgpRecovered||0,water:D.water||0,
      sgarri:extrasKcal(di),sleep:D.sleep,relax:D.relax,feel:D.feel,
      note:D.note||"",workouts:D.workouts.map(w=>w.sport+" "+w.min+"' "+(w.int||"media"))}});
  days.forEach((d,di)=>d.completed=dayCompleted(di));
  const done=days.filter(d=>d.completed);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  return {from:S.week.started,to:iso(new Date()),tdee:tdee(),weight:S.profile.w,nDone:done.length,
    avgEat:avg(done.map(d=>d.eat)),avgProt:avg(done.map(d=>d.prot)),avgDef:avg(done.map(d=>d.def)),
    totBurn:days.reduce((a,d)=>a+d.burn,0),days,ai:null};}

   PERIODI: Dieta 1 → Periodo libero 1 → Dieta 2 …
   Ogni periodo ha inizio/fine, aspettativa iniziale (★), motivazione
   di inizio, giudizio finale (★), motivazione di fine e — per i
   periodi chiusi — una valutazione AI (★ + indicazioni) basata su
   come hai mangiato, sugli allenamenti e sui risultati.
   ═══════════════════════════════════════════════════════════════ */
function activePeriod(){return S.periods.find(p=>!p.end)||null;}
/* ═══ CICLO DIETA: 3 MESI DI DEFICIT → 1 MESE DI MANTENIMENTO ══════
   Un deficit prolungato oltre i 3 mesi fa scendere il metabolismo e logora
   la testa. Il ciclo standard alterna 90 giorni di deficit e 30 di
   mantenimento: durante il mantenimento il deficit va a zero da solo, le
   grammature del piano risalgono e la spesa si adegua di conseguenza. */
/* Schemi standard fra cui scegliere. La scelta è dell'utente o del centro
   dimagrimento che lo segue: non esiste uno schema giusto per tutti. */
const CYC_PRESETS=[
  ["cost",   0,  0, "Sempre in deficit"],
  ["6_1",    6,  1, "6 giorni + 1"],
  ["12_2",  12,  2, "12 giorni + 2"],
  ["14_7",  14,  7, "2 settimane + 1"],
  ["21_7",  21,  7, "3 settimane + 1"],
  ["28_7",  28,  7, "4 settimane + 1"],
  ["42_14", 42, 14, "6 settimane + 2"],
  ["56_14", 56, 14, "8 settimane + 2"],
  ["90_30", 90, 30, "3 mesi + 1 mese"]
];
/* Quale preset corrisponde alla configurazione attuale (o "pers.") */
function cycPresetNow(){
  if(!cycOn())return "cost";
  const p=CYC_PRESETS.find(x=>x[1]===cycDefDays()&&x[2]===cycMaintDays());
  return p?p[0]:"pers";}
window.cycPresetSet=(v)=>{
  if(v==="pers")return;
  if(v==="cost"){S.profile.cycPhases=false;save();render("regole");
    return toast("Deficit costante: nessuna pausa programmata");}
  const p=CYC_PRESETS.find(x=>x[0]===v);if(!p)return;
  S.profile.cycPhases=true;S.profile.cycDefDays=p[1];S.profile.cycMaintDays=p[2];
  save();render("regole");toast(p[3]+" ✓");};
function cycDefDays(){const n=+S.profile.cycDefDays;return n>0?n:90;}
function cycMaintDays(){const n=+S.profile.cycMaintDays;return n>0?n:30;}
function cycOn(){return S.profile.cycPhases!==false;}
/* Giorni trascorsi nel periodo di dieta aperto (0 se non ce n'è uno) */
function dietDayNAt(date){
  const ap=activePeriod();
  if(!ap||ap.type!=="dieta")return 0;
  const a=safeDate(ap.start+"T12:00:00");if(!a)return 0;
  const d=new Date(date);d.setHours(12,0,0,0);
  return Math.max(1,Math.round((d-a)/864e5)+1);}
function dietDayN(){return dietDayNAt(new Date());}
/* Quel giorno cade in una pausa di mantenimento? Serve alla proiezione:
   nelle pause il peso non scende, e la curva deve dirlo. */
function cycMaintAtDate(date){
  if(!cycOn())return false;
  const n=dietDayNAt(date);if(!n)return false;
  const tot=cycDefDays()+cycMaintDays();
  return (((n-1)%tot)+1)>cycDefDays();}
/* Fase attuale del ciclo: "deficit" o "mantenimento" (null = ciclo spento
   o nessun periodo di dieta aperto) */
function cycPhase(){
  if(!cycOn())return null;
  const n=dietDayN();if(!n)return null;
  const tot=cycDefDays()+cycMaintDays();
  const pos=((n-1)%tot)+1;
  return pos<=cycDefDays()?"deficit":"mantenimento";}
function cycPhaseDay(){
  const n=dietDayN();if(!n||!cycOn())return 0;
  const tot=cycDefDays()+cycMaintDays();
  const pos=((n-1)%tot)+1;
  return pos<=cycDefDays()?pos:(pos-cycDefDays());}
function cycPhaseLen(){return cycPhase()==="mantenimento"?cycMaintDays():cycDefDays();}
function cycMaintOn(){return cycPhase()==="mantenimento";}
/* Chiave del blocco corrente: cambia a ogni passaggio di fase, così
   l'avviso ricompare al blocco successivo ma non ogni giorno. */
function cycPhaseKey(){
  const n=dietDayN();if(!n)return "";
  const tot=cycDefDays()+cycMaintDays();
  return Math.floor((n-1)/tot)+"_"+cycPhase();}
window.cycDismiss=()=>{S.ui.cycSeen=cycPhaseKey();save();render("oggi");};
window.cycApply=async()=>{
  S.ui.cycSeen=cycPhaseKey();save();
  if(!aiOn())return dlgAlert("Serve la chiave AI per ritarare il piano.\n\nIl target è già cambiato: le grammature del piano puoi adeguarle a mano.");
  if(await retunePlan()){await genShop(true);render("oggi");}};
function periodLabel(p){return (p.type==="dieta"?"Dieta ":"Periodo libero ")+p.n;}
function starsTxt(n){n=Math.max(0,Math.min(5,Math.round(+n||0)));return "★".repeat(n)+"☆".repeat(5-n);}
function nextPeriodN(type){return S.periods.filter(p=>p.type===type).length+1;}
function weightNear(dateISO,after){ // peso registrato più vicino alla data (after: primo dopo, altrimenti ultimo prima)
  const ws=(S.profile.weights||[]).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
  if(!ws.length)return null;const t=new Date(dateISO+"T12:00:00");
  if(after){const x=ws.find(w=>new Date(w.d)>=t);return x?x.w:ws[ws.length-1].w;}
  const before=ws.filter(w=>new Date(w.d)<=t);return before.length?before[before.length-1].w:ws[0].w;}
function periodStats(p){
  const endISO=p.end||iso(new Date());
  const days=flattenDiet().filter(d=>d.date>=p.start&&d.date<=endISO);
  const done=days.filter(d=>d.eat>0);
  const n=done.length||1;
  const avg=k=>Math.round(done.reduce((a,d)=>a+(d[k]||0),0)/n);
  const workouts=days.reduce((a,d)=>a+((d.workouts||[]).length),0);
  const w0=weightNear(p.start,true),w1=weightNear(endISO,false);
  const dW=(w0!=null&&w1!=null)?Math.round((w1-w0)*10)/10:null;
  const nDays=Math.max(1,Math.round((new Date(endISO+"T12:00:00")-new Date(p.start+"T12:00:00"))/864e5)+1);
  return{nDays,nDone:done.length,avgEat:avg("eat"),avgProt:avg("prot"),avgFib:avg("fib"),avgDef:avg("def"),workouts,w0,w1,dW};}
window.startPeriod=async (type)=>{

  S.periods.push({id:Date.now(),type,n:nextPeriodN(type),start,end:null,
    expStars:Math.max(1,Math.min(5,exp||3)),expNote:note,endStars:null,endNote:"",aiStars:null,aiText:""});
  save();render(cur);toast(periodLabel(S.periods[S.periods.length-1])+" iniziato ✓");};
window.endPeriod=async (id)=>{
  const p=S.periods.find(x=>x.id===id);if(!p||p.end)return;
  const end=await dlgPrompt("Data di fine (AAAA-MM-GG):",iso(new Date()));if(!end)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(end)||end<p.start)return dlgAlert("Data non valida (deve essere ≥ inizio).");

  p.end=end;p.endStars=Math.max(1,Math.min(5,st||3));p.endNote=note;
  save();render(cur);toast(periodLabel(p)+" chiuso ✓ Ora puoi chiedere la valutazione AI in Storico.");};
window.editPeriod=async (id)=>{
  const p=S.periods.find(x=>x.id===id);if(!p)return;

  save();render(cur);};
window.delPeriod=async (id)=>{const p=S.periods.find(x=>x.id===id);if(!p)return;
  if(!await dlgConfirm("Elimino "+periodLabel(p)+"? I dati giornalieri restano, sparisce solo il raggruppamento."))return;

window.aiRatePeriod=async(id)=>{

      +' Aspettativa iniziale dell\'utente: '+p.expStars+'/5 ("'+(p.expNote||"")+'"). Autovalutazione finale: '+p.endStars+'/5 ("'+(p.endNote||"")+'").'
      +' Dai un voto onesto in stelle (1-5) su come si è comportato davvero, e 3-4 indicazioni concrete e incoraggianti in italiano.'

/* Striscia del periodo in corso: sempre visibile in Oggi, così sai da quanto

function periodBarHTML(){

/* ═══ REGOLE DEL SISTEMA ═══════════════════════════════════════════
   Tutti i numeri che governano calcoli e proposte AI, in un posto solo e
   modificabili. In futuro questa sezione sarà riservata al professionista;
   per ora è aperta perché il sistema è in prova. */
/* ═══════════════════════════════════════════════════════════════
   BENVENUTO — percorso guidato per il primo avvio
   Nessun piano precompilato: si raccolgono i dati indispensabili,
   si spiega a cosa servono e dove si cambiano, poi si costruisce
   il piano insieme (o si parte da zero a mano).
   ═══════════════════════════════════════════════════════════════ */
const ONB_STEPS=["Benvenuto","I tuoi dati","AI","Chi sei","Obiettivo","Come mangi","Backup","Il piano"];
/* Rifare il percorso non riparte da zero: i campi restano compilati con quello
   che hai già inserito, così correggi solo ciò che è cambiato. */
/* Impostazione rapida dell'obiettivo dal punto in cui se ne nota l'assenza */
window.askGoalWeight=async()=>{
  const r=healthyRange();
  const v=await dlgPrompt("Peso obiettivo in kg"+(r?" (fascia sana per "+S.profile.h+" cm: "+String(r.min).replace(".",",")+"–"+String(r.max).replace(".",",")+" kg)":"")+
    ":\n\nEntra nel calcolo delle proteine, nella proiezione e nei grafici.",String(goalWeightSet()||""));
  if(v===null)return;
  const n=setGoalWeight(v);
  if(!n)return dlgAlert("Valore non valido: l'obiettivo resta come era.");
  save();render(cur);toast("Obiettivo impostato: "+n+" kg ✓");};
window.restartOnboarding=async()=>{
  if(!await dlgConfirm("Rifaccio il percorso guidato?\n\nTrovi tutti i campi già compilati con i tuoi dati attuali: cambia solo quello che serve e vai avanti. Niente viene azzerato, e il piano resta quello che hai adesso."))return;
  S.onboard.done=false;S.onboard.step=0;save();show("benvenuto");};
/* ═══ SALVATAGGIO IMMEDIATO DEI CAMPI DEL PERCORSO GUIDATO ═══════════
   Prima i dati venivano scritti solo premendo "Avanti": chi scriveva un
   valore e poi toccava qualsiasi altra cosa (Genera piano, un'altra pagina,
   la data in alto) lo perdeva senza accorgersene. Ora ogni modifica viene
   registrata subito, quindi nessun percorso può più perdere un dato. */
let ONBAUTO=false;
function onbAutoSave(){
  if(ONBAUTO)return;ONBAUTO=true;
  try{onbSave(true);}catch(e){}   /* salvataggio continuo: mai avvisi mentre scrivi */
  ONBAUTO=false;}
function onbBindAutoSave(){
  const el=document.getElementById("pg-benvenuto");if(!el||el._onbBound)return;
  el._onbBound=true;
  /* "change" scatta all'uscita dal campo e su ogni spunta o menù */
  el.addEventListener("change",e=>{
    const t=e.target;if(!t||!/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))return;
    onbAutoSave();},true);
  /* e alla prima uscita dal campo di testo, per chi non tocca altro */
  el.addEventListener("blur",e=>{
    const t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName))return;
    onbAutoSave();},true);}
function onbGo(n){S.onboard.step=Math.max(0,Math.min(ONB_STEPS.length-1,n));save();render("benvenuto");
  window.scrollTo(0,0);}
window.onbNext=()=>{if(onbSave())onbGo(S.onboard.step+1);};
window.onbBack=()=>{try{onbSave(true);}catch(e){}onbGo(S.onboard.step-1);};
/* Il percorso non si salta più: senza profilo ogni numero dell'app sarebbe
   inventato. Resta la funzione per compatibilità, ma avvisa e basta. */
window.onbSkip=()=>dlgAlert("La configurazione serve per calcolare il tuo fabbisogno: bastano pochi campi.\n\nSe non vuoi l'AI o il backup, puoi lasciarli vuoti e proseguire.");
window.onbFinish=(mode)=>{
  try{onbSave(true);}catch(e){}   /* niente si perde uscendo dal percorso */
  S.onboard.done=true;save();
  if(mode==="ai")return genPlanAI();
  if(mode==="photo"){show("piano");setTimeout(()=>importPlanPhotos(),250);return;}
  if(mode==="manual"){show("regole");setTimeout(()=>wizEditCurrent(),120);return;}
  show("oggi");};
/* salva i campi dello step corrente; torna false se manca qualcosa di essenziale */
/* Campo che identifica ogni passo: se non è sullo schermo, il passo non è
   visibile e non c'è niente da leggere. Serve perché ora onbSave viene
   chiamato anche uscendo dalla pagina, e non deve azzerare leggendo un DOM
   che appartiene a un'altra schermata. */
const ONB_PROBE={2:"obKey",3:"obName",4:"obGoal",5:"obTipo"};
function onbSave(silent){
  const g=id=>document.getElementById(id),v=id=>(g(id)?g(id).value.trim():"");
  const st=S.onboard.step,p=S.profile,D=S.diet;
  const probe=ONB_PROBE[st];
  if(probe&&!g(probe))return true;        /* passo non a schermo: nulla da salvare */
  if(st===3){
    if(!v("obName")||!v("obDob")||!(+v("obH")>0)||!(+v("obW")>0)){
      /* salvataggio morbido: registra quello che c'è e resta zitto.
         L'avviso arriva solo quando premi Avanti. */
      if(silent){if(v("obName"))p.name=v("obName");if(v("obGen"))p.gender=v("obGen");
        if(v("obDob"))p.dob=v("obDob");if(+v("obH")>0)p.h=+v("obH");if(+v("obW")>0)p.w=+v("obW");
        return false;}
      dlgAlert("Servono nome, data di nascita, altezza e peso: senza questi non posso calcolare il fabbisogno.");return false;}
    p.name=v("obName");p.gender=v("obGen");p.dob=v("obDob");
    p.h=+v("obH");p.w=parseFloat(v("obW"));
    const fat=parseFloat(v("obFat"));p.fatp=fat>0?fat:null;
    p.act=parseFloat(v("obAct"))||1.3;
    p.baseSteps=parseInt(v("obSteps"))||3000;
    if(!p.weights||!p.weights.length)p.weights=[{d:iso(new Date()),w:p.w,fat:p.fatp||null}];
  }
  if(st===4){p.goal=v("obGoal");
    setGoalWeight(v("obTargetW"));              /* unico punto di scrittura */
    {const cv=v("obCyc"),pr=CYC_PRESETS.find(x=>x[0]===cv);
     if(cv==="cost")p.cycPhases=false;
     else if(pr){p.cycPhases=true;p.cycDefDays=pr[1];p.cycMaintDays=pr[2];}}
    D.ritmo=v("obRitmo")||"";
    if(D.ritmo)p.defMode="ritmo";      /* il ritmo scelto guida davvero il deficit */
    /* se hai scelto lo sport ma non hai scritto quante volte, vale 1:
       prima la riga veniva scartata in silenzio e sembrava non salvarsi */
    p.goalWorkoutList=obWkSync().filter(r=>r.sport)
      .map(r=>({sport:r.sport,perWeek:Math.max(1,+r.perWeek||1),min:+r.min||45}));
    if(!silent)OBWK=null;   /* durante la compilazione le righe restano dove sono */
    if(p.goalWk!=null&&p.goalWk!=="")p.goalWk=null; /* la somma per sport torna a comandare */
    const wl=parseFloat(v("obWater"));p.waterGoalL=wl>0?wl:null;
  }
  if(st===5){
    const slots=readSlotsChecks("ob"),nS=parseSlots(slots).length;
    if(nS<2){if(silent)return false;
      dlgAlert("Seleziona almeno due pasti: con meno di due il piano non sta in piedi.");return false;}
    D.tipo=applyVeg("ob",v("obTipo"));
    D.slots=slots;D.nPasti=nS;
    D.mensaGiorni=readMensaChecks("ob");
    D.fuoriN=fuoriCount(D.mensaGiorni);
    D.cucina=v("obCucina");
    D.intol=readIntolChecks("ob");
    D.protocolli=readProtChecks("ob");
    D.fodmap=String(D.protocolli||"").toLowerCase().includes("fodmap");
    D.no=v("obNo");D.si=v("obSi");D.pastiLiberi=+v("obLiberi")||0;
    D.patologie=readPatChecks("ob");
    D.fuoriN=fuoriCount(D.mensaGiorni);           /* si contano dalle spunte */
    D.varieta=v("obVar")||"media";
    D.budget=v("obBudget");D.alcol=v("obAlcol");
    D.religiose=readTagChecks("ob","R",REL_LIST);
    D.integratori=readTagChecks("ob","G",INTEG_LIST);
    D.liberi=v("obOcc");
  }
  if(st===2){const k=v("obKey");if(k)S.ai.key=k;}
  if(st===6){const c=v("obCid");if(c)S.drive.cid=c;}
  save();return true;
}

/* Il ritmo proposto dipende dall'obiettivo: opzioni e testo cambiano insieme. */
/* Righe allenamento dell'onboarding: quante ne serve, non due fisse.
   OBWK è lo stato temporaneo del passo, letto dal DOM prima di ogni modifica. */
let OBWK=null;
function obWkRows(){
  if(!OBWK)OBWK=(S.profile.goalWorkoutList||[]).map(g=>({sport:g.sport||"",perWeek:g.perWeek||"",min:g.min||45}));
  if(!OBWK.length)OBWK=[{sport:"",perWeek:"",min:45}];
  return OBWK;}
window.obWkSync=()=>{const out=[];
  /* obWkRows() ricostruisce l'elenco se è stato azzerato da un salvataggio
     automatico: senza questo, aggiungere una riga andava in errore */
  obWkRows().forEach((r,i)=>{const g=id=>document.getElementById(id+i);
    const s=g("obWkS"),m=g("obWkM"),n=g("obWkN");
    out.push({sport:s?s.value:r.sport,min:m?(+m.value||45):r.min,perWeek:n?n.value:r.perWeek});});
  if(out.length)OBWK=out;
  return OBWK||[];};      /* mai null: onbSave ci chiama .filter() sopra */
window.obWkAdd=()=>{obWkSync();const rows=obWkRows();
  if(rows.length<8)rows.push({sport:"",perWeek:"",min:45});
  renderBenvenuto();};
window.obWkDel=i=>{obWkSync();const rows=obWkRows();rows.splice(i,1);
  if(!rows.length)OBWK=[{sport:"",perWeek:"",min:45}];
  renderBenvenuto();};
window.obGoalUI=()=>{
  const gEl=document.getElementById("obGoal");if(!gEl)return;
  const goal=gEl.value,D=S.diet;
  const box=document.getElementById("obRitmoBox"),hint=document.getElementById("obRitmoHint");
  let opts=[],def="",lbl="Ritmo (kg persi a settimana)",txt="";
  if(/deciso/.test(goal)){opts=["0.5","0.75","1"];def="0.75";
    txt="Ritmo spinto: funziona per periodi brevi, poi si paga in fame e stanchezza. Sopra <b>0,75 kg a settimana</b> serve la supervisione di un professionista.";}
  else if(/massa|aument/.test(goal)){opts=["0.1","0.2","0.3"];def="0.2";lbl="Ritmo (kg presi a settimana)";
    txt="In massa conviene salire piano: <b>0,1–0,3 kg a settimana</b> limita il grasso che si accumula insieme al muscolo.";}
  else if(/mantenimento/.test(goal)){opts=[];
    txt="In mantenimento non c'è ritmo da scegliere: il target coincide con il fabbisogno, né deficit né surplus.";}
  else{opts=["0.25","0.5"];def="0.5";
    txt="Un ritmo fra <b>0,25 e 0,5 kg a settimana</b> è quello che si regge più a lungo. Più veloce funziona all'inizio e poi si paga in fame e abbandono.";}
  const cur=String(D.ritmo||"");
  if(box)box.innerHTML=opts.length
    ?`<label>${lbl}</label><select id="obRitmo">${opts.map(o=>`<option ${(opts.includes(cur)?cur===o:def===o)?"selected":""}>${o}</option>`).join("")}</select>`
    :`<label>Ritmo</label><div class="obwhere" style="margin-top:12px">non serve per questo obiettivo</div>`;
  if(hint)hint.innerHTML=txt;
};

     (function(){const rr=tdeeReal();return rr
       ?out(rr.tdee+" kcal")+`<br><button class="btn ghost small" style="margin-top:6px" onclick="applyTdeeReal()">Allinea</button>`

/* Pulizia selettiva: azzera solo le voci scelte, opzionalmente limitandosi a

window.cleanupRange=(kind)=>{
  const f=document.getElementById("clFrom"),t=document.getElementById("clTo");
  const d=new Date();d.setHours(12,0,0,0);
  const iso2=x=>x.toISOString().slice(0,10);
  let from="",to="";
  if(kind==="oggi"){from=to=iso2(d);}
  else if(kind==="settimana"){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));from=iso2(m);to=iso2(d);}
  else if(kind==="mese"){from=iso2(new Date(d.getFullYear(),d.getMonth(),1));to=iso2(d);}
  else {from="";to="";}   // tutto
  if(f)f.value=from;if(t)t.value=to;
  const lb=document.getElementById("clRangeLbl");
  if(lb)lb.textContent=from?("dal "+from.split("-").reverse().join("/")+" al "+to.split("-").reverse().join("/")):"tutto lo storico";
  document.querySelectorAll(".clchip").forEach(b=>b.classList.toggle("on",b.dataset.k===kind));};
window.cleanupRun=async ()=>{
  const g=id=>document.getElementById(id),ck=id=>!!(g(id)&&g(id).checked);
  const from=(g("clFrom")&&g("clFrom").value)||"",to=(g("clTo")&&g("clTo").value)||"";
  const inRange=d=>{d=String(d||"").slice(0,10);return (!from||d>=from)&&(!to||d<=to);};
  const sel=[];
  if(ck("clStreak"))sel.push("serie 🔥");
  if(ck("clPeriods"))sel.push("periodi");
  if(ck("clWeights"))sel.push("pesate");
  if(ck("clWeek"))sel.push("settimana in corso");
  if(ck("clHistory"))sel.push("settimane archiviate");
  if(ck("clEvents"))sel.push("eventi");
  if(ck("clShop"))sel.push("lista della spesa");
  if(ck("clRecipes"))sel.push("piatti salvati");
  if(!sel.length)return dlgAlert("Seleziona almeno una voce da azzerare.");
  const range=(from||to)?("\n\nLimitato al periodo "+(from||"inizio")+" → "+(to||"oggi")):"\n\nSu tutto lo storico.";
  if(!await dlgConfirm("Azzero: "+sel.join(", ")+range+"\n\nProfilo, piano, regole e caratteristiche restano intatti.\nViene creata un'istantanea prima di procedere."))return;
  snapSave("prima della pulizia");
  // conteggi PRIMA, per poter dire davvero che cosa è stato rimosso
  const b={streak:(S.streak&&S.streak.count)||0,periodi:(S.periods||[]).length,
    pesate:(S.profile.weights||[]).length,storico:(S.history||[]).length,
    eventi:Object.keys(S.dayEvents||{}).length,
    spunte:S.week.days.reduce((a,d)=>a+(d.meals||[]).filter(m=>m.done||m.skip).length,0),
    extra:S.week.days.reduce((a,d)=>a+(d.extras||[]).length,0),
    sport:S.week.days.reduce((a,d)=>a+(d.workouts||[]).length,0),
    spesa:(S.customShop||[]).length};
  if(ck("clStreak"))S.streak={count:0,best:0,last:""};
  if(ck("clPeriods"))S.periods=(from||to)?(S.periods||[]).filter(p=>!inRange(p.start)):[];
  if(ck("clWeights"))S.profile.weights=(S.profile.weights||[]).filter(x=>!inRange(x.d));
  if(ck("clWeek"))S.week=freshWeek();
  if(ck("clHistory"))S.history=(from||to)?(S.history||[]).filter(w=>!inRange(w.from)):[];
  if(ck("clEvents")){
    if(from||to){Object.keys(S.dayEvents||{}).forEach(k=>{if(inRange(k))delete S.dayEvents[k];});
      Object.keys(S.hardDays||{}).forEach(k=>{if(inRange(k))delete S.hardDays[k];});}
    else {S.dayEvents={};S.hardDays={};}}
  if(ck("clShop")){S.shop={};S.customShop=null;}
  /* i piatti creati: con un intervallo si tolgono solo quelli salvati in quei
     giorni, senza intervallo si svuota tutto il repertorio */
  if(ck("clRecipes")){
    const pre=(S.recipes||[]).length;
    S.recipes=(from||to)?(S.recipes||[]).filter(r=>!(r.at&&inRange(String(r.at).slice(0,10)))):[];
    b.piatti=pre-(S.recipes||[]).length;}
  save();
  const a={streak:(S.streak&&S.streak.count)||0,periodi:(S.periods||[]).length,
    pesate:(S.profile.weights||[]).length,storico:(S.history||[]).length,
    eventi:Object.keys(S.dayEvents||{}).length,
    spunte:S.week.days.reduce((x,d)=>x+(d.meals||[]).filter(m=>m.done||m.skip).length,0),
    extra:S.week.days.reduce((x,d)=>x+(d.extras||[]).length,0),
    sport:S.week.days.reduce((x,d)=>x+(d.workouts||[]).length,0),
    spesa:(S.customShop||[]).length};
  const rep=[];
  const dif=(lbl,k,suf)=>{const n=b[k]-a[k];if(n>0)rep.push("• "+lbl+": "+n+(suf||""));};
  if(ck("clStreak")&&b.streak)rep.push("• serie 🔥 azzerata (era "+b.streak+")");
  dif("periodi rimossi","periodi");
  dif("pesate rimosse","pesate");
  dif("settimane archiviate rimosse","storico");
  dif("eventi rimossi","eventi");
  dif("spunte azzerate","spunte");
  dif("extra rimossi","extra");
  dif("allenamenti rimossi","sport");
  if(ck("clShop")&&b.spesa)rep.push("• lista della spesa svuotata");
  if(ck("clRecipes"))rep.push("• piatti salvati eliminati: "+(b.piatti||0));
  // ridisegna TUTTO, intestazione compresa: la fiamma vive lì
  renderHeader();render("io");
  dlgAlert(rep.length
    ? "Pulizia completata ✓\n\n"+rep.join("\n")+"\n\nSe qualcosa non torna, recuperi tutto da 🛟 Ripristino di emergenza."
    : "Non c'era nulla da rimuovere con questi criteri.\n\nControlla il periodo selezionato: con un intervallo di date vengono toccati solo pesate, settimane archiviate ed eventi che ci ricadono dentro.");};

function parseSlots(s){return String(s||"").split(",").map(x=>x.trim()).filter(Boolean);}
function slotsChecksHTML(pre,cur){const on=parseSlots(cur);
  return `<div class="ckgrid">`+SLOTS.map((s,i)=>`<label class="ck"><input type="checkbox" id="${pre}S${i}" ${on.includes(s)?"checked":""}> ${s}</label>`).join("")+`</div>`;}

const MENSA_DAYS=[["lun","Lunedì"],["mar","Martedì"],["mer","Mercoledì"],["gio","Giovedì"],["ven","Venerdì"],["sab","Sabato"],["dom","Domenica"]];
function parseMensa(s){const m={};String(s||"").toLowerCase().split(",").forEach(x=>{x=x.trim();if(!x)return;
  const day=MENSA_DAYS.find(d=>x.indexOf(d[0])===0);if(!day)return;
  m[day[0]]=(/entrambi/.test(x))?"entrambi":(/cena/.test(x)?"cena":"pranzo");});return m;}
/* Un giorno può avere il pranzo fuori, la cena fuori o entrambi: chi lavora
   in viaggio ha spesso tutti e due. Le spunte sono quindi due per giorno. */
function mensaChecksHTML(pre,cur){const m=parseMensa(cur);
  const has=(k,p)=>{const v=m[k];return v==="entrambi"?true:(v===p);};
  return `<div class="ckmensa-w">`+MENSA_DAYS.map(([k,lbl])=>
    `<div class="ckmensa"><span style="flex:1;font-weight:700;font-size:13.5px;color:var(--bosco)">${lbl}</span>
     <label class="ck" style="flex:none"><input type="checkbox" id="${pre}Mp${k}" ${has(k,"pranzo")?"checked":""}> pranzo</label>
     <label class="ck" style="flex:none"><input type="checkbox" id="${pre}Mc${k}" ${has(k,"cena")?"checked":""}> cena</label></div>`).join("")+`</div>`;}
function readMensaChecks(pre){const out=[];
  MENSA_DAYS.forEach(([k])=>{
    const p=document.getElementById(pre+"Mp"+k),c=document.getElementById(pre+"Mc"+k);
    const P=!!(p&&p.checked),C=!!(c&&c.checked);
    if(P&&C)out.push(k+" (entrambi)");
    else if(P)out.push(k+" (pranzo)");
    else if(C)out.push(k+" (cena)");});
  return out.join(", ");}

/* ═══ GENERATORE DI PIANO ═══════════════════════════════════════════
   Costruisce 7 giorni completi partendo da profilo, obiettivo e
   caratteristiche alimentari. Il piano è una proposta: va letta, corretta
   e — per scelte particolari — confermata con un professionista. */
/* Intervallo di peso sano per l'altezza dichiarata (BMI 18,5–24,9) */
function healthyRange(){const h=+S.profile.h;if(!(h>0))return null;
  const m=h/100;return{min:Math.round(18.5*m*m*10)/10,max:Math.round(24.9*m*m*10)/10};}
/* Controlla che l'obiettivo di peso sia sensato PRIMA di costruire il piano.
   Ritorna false solo se la persona decide di fermarsi per correggerlo. */
async function goalHealthCheck(){
  const p=S.profile,h=+p.h,gw=goalWeightSet();
  if(!h||!gw)return true;
  const b=bmiFor(gw),cl=bmiClass(b),r=healthyRange();
  if(!b||!r)return true;
  /* La fascia 18,5-24,9 è un riferimento statistico, non una regola: la
     costituzione, la massa muscolare e la struttura ossea cambiano molto da
     persona a persona. Quindi silenzio nella fascia allargata 18-27, nota
     informativa fuori, avviso vero solo sotto 18 o sopra 30. */
  if(b>=18&&b<27)return true;
  const tooLow=b<18;
  const msg=(tooLow?"⚠️ L'obiettivo che hai impostato non sembra salutare.":"ℹ️ Nota sull'obiettivo.")+
    "\n\nCon "+h+" cm, un peso di "+gw+" kg corrisponde a un BMI di "+String(b).replace(".",",")+
    " ("+cl.label+")."+
    "\n\nPer la tua altezza la fascia considerata sana (BMI 18,5–24,9) va da "+String(r.min).replace(".",",")+
    " a "+String(r.max).replace(".",",")+" kg."+
    "\n\nQuella fascia è un riferimento statistico, non una regola: costituzione, massa muscolare e struttura ossea cambiano molto da persona a persona, e stare un po' sopra o un po' sotto può essere del tutto normale per te."+
    (tooLow?("\n\nQui però il margine è ampio: scendere sotto "+String(r.min).replace(".",",")+" kg espone a perdita di massa muscolare, cali ormonali, "+
      "stanchezza e carenze. Un obiettivo intorno a "+Math.round(r.min+(r.max-r.min)*0.35)+"–"+Math.round(r.min+(r.max-r.min)*0.6)+
      " kg sarebbe più sostenibile, e vale la pena parlarne con un medico o un nutrizionista.")
      :("\n\n"+(cl.msg||"L'obiettivo resta sopra la fascia normopeso: come tappa intermedia va benissimo.")))+
    "\n\nPosso generare il piano su questo obiettivo, oppure puoi riscriverlo subito qui e rianalizzarlo.";
  if(await dlgConfirm(msg,{ok:"Genera così",ko:"Riscrivi obiettivo"}))return true;
  /* riscrittura in linea: si corregge il peso e si rianalizza, senza uscire */
  const nw=parseFloat(String(await dlgPrompt(
    "Nuovo peso desiderato in kg (fascia sana per "+h+" cm: da "+String(r.min).replace(".",",")+
    " a "+String(r.max).replace(".",",")+" kg).\n\nLascia vuoto per annullare la generazione.",
    String(Math.round((r.min+r.max)/2))||"")||"").replace(",","."));
  if(!(nw>0))return false;
  if(nw<25||nw>350)  {await dlgAlert("Quel valore non sembra un peso plausibile: riprova.");return goalHealthCheck();}
  setGoalWeight(nw);save();
  const nb=bmiFor(nw);
  await dlgAlert("Obiettivo aggiornato a "+nw+" kg (BMI "+String(nb).replace(".",",")+" · "+bmiClass(nb).label+") ✓"+
    "\n\nLo trovi anche in Io → Obiettivi. Adesso rianalizzo.");
  return goalHealthCheck();          /* rianalisi immediata del nuovo obiettivo */
}

/* ═══ STIMA DEI RISULTATI ════════════════════════════════════════
   Bilancio matematico del piano (media kcal vs fabbisogno + allenamenti
   pianificati) → kg/settimana e data stimata dell'obiettivo; poi, se
   l'AI è attiva, un giudizio qualitativo su sostenibilità e criticità. */
window.planForecast=async(afterImport,noRetune)=>{
  if(planIsEmpty())return dlgAlert("Il piano è vuoto: prima creane o importane uno.");
  const p=S.profile,t=tdeeTarget();
  /* stessa matematica dei totali mostrati nel Piano: tutte le portate (liberi e
     mensa compresi) e le modifiche permanenti, tramite plannedTemplateOfDay */
  const days=PLAN.map((d,di)=>plannedTemplateOfDay(di).k).filter(k=>k>0);
  if(!days.length)return dlgAlert("Nessun pasto con calorie nel piano: niente da stimare.");
  const avg=Math.round(days.reduce((a,b)=>a+b,0)/days.length);
  /* qui gli allenamenti contano: accorciano il tempo per arrivare all'obiettivo,
     senza aver alzato le calorie da mangiare */
  const burn=wkForecastBurn();
  const defDay=t+burn-avg;
  const wk=defDay*7/7700;
  let msg="🔮 Stima sul piano attuale\n\n• media del piano: ~"+avg+" kcal al giorno\n• fabbisogno per i target: "+t+" kcal + ~"+burn+" kcal di allenamenti pianificati ("+goalWkTotal()+" a settimana)\n• bilancio: "+(defDay>=0?"deficit":"surplus")+" di ~"+Math.abs(defDay)+" kcal al giorno → "+(defDay>=0?"circa −":"circa +")+Math.abs(wk).toFixed(2).replace(".",",")+" kg a settimana";
  const goalW=goalWeightSet()||null;
  const needSurplus=!!(goalW&&p.w&&goalW>p.w);
  const reachable=(goalW&&p.w)?(needSurplus?defDay<0:defDay>0):null;
  if(reachable){
    const daysTo=Math.round(Math.abs(p.w-goalW)*7700/Math.abs(defDay));
    const eta=new Date(Date.now()+daysTo*864e5);
    msg+="\n• obiettivo "+goalW+" kg: circa "+Math.round(daysTo/7)+" settimane, indicativamente entro "+eta.toLocaleDateString("it-IT",{month:"long",year:"numeric"})+(needSurplus?"":" (il ritmo rallenta man mano che scendi)");
  }
  if(defMode()==="ritmo"){
    msg+="\n• ritmo desiderato: "+ratePerWeek()+" kg a settimana";
    if(rateCapped())msg+="\n• ⚠️ "+rateNote();
    const rif=rateCapped()?rateEffective():ratePerWeek();
    if(reachable&&Math.abs(Math.abs(wk)-rif)>0.15)msg+="\n• il piano viaggia a un ritmo diverso da quello impostato: valuta un ritocco delle porzioni o del ritmo";
  }
  if(defDay>1000)msg+="\n• ⚠️ deficit molto aggressivo (oltre 1.000 kcal al giorno): sostenibile solo per brevi periodi e sotto controllo di un nutrizionista.";
  if(reachable===false&&noRetune)msg+="\n• ⚠️ anche dopo la ritaratura il bilancio non torna: rivedi obiettivo, allenamenti o piano insieme a un nutrizionista.";
  msg+="\n\n⚠️ Stima matematica indicativa: la verifica vera arriva dalle pesate, e il piano va validato da un nutrizionista.";
  await dlgAlert(msg);
  if(reachable===false&&!noRetune){
    if(aiOn()){
      if(await dlgConfirm("⚠️ Con questo piano l'obiettivo "+goalW+" kg NON sembra raggiungibile: il bilancio "+(needSurplus?"non è in surplus":"non è in deficit")+".\n\nMa sono un'AI e posso commettere errori: controlla tu i numeri della stima qui sopra.\n\nPosso ritararlo automaticamente modificando le grammature (i piatti restano gli stessi) verso ~"+dayTargetK()+" kcal al giorno, e poi rigenerare lista della spesa e stima.",{ok:"Ritara il piano",ko:"Mantieni com'è"})){
        if(await retunePlan()){await genShop(true);return planForecast(afterImport,true);}
      }
    }
    return;
  }
  if(!aiOn())return;
  const box=document.getElementById("planOut")||document.getElementById("rulesOut");
  if(box){box.style.display="block";box.textContent="🤖 Giudizio dell'AI sul piano in arrivo…";}
  try{
    const t2=await aiAsk('Valuta in modo onesto questo piano alimentare rispetto all\'obiettivo della persona. '+rulesForAI()+' Dati: media del piano '+avg+' kcal/giorno; fabbisogno per i target '+t+' kcal; allenamenti pianificati '+goalWkTotal()+' a settimana (~'+burn+' kcal/giorno); obiettivo: '+(p.goal||"—")+(goalW?'; peso '+p.w+' → '+goalW+' kg':'')+(defMode()==="ritmo"?'; ritmo desiderato '+ratePerWeek()+' kg/settimana'+(rateCapped()?' (ridotto a '+rateEffective()+' kg/settimana dal tetto di sicurezza)':''):'')+'. In massimo 130 parole: quanto è realistico raggiungere l\'obiettivo con questo piano e questi allenamenti, i 2-3 punti deboli principali (proteine, fibre, varietà, sostenibilità) e 2 consigli concreti. Chiudi ricordando la validazione da parte di un nutrizionista. Testo semplice, niente markdown.');
    if(box)box.textContent="🤖 "+t2;
  }catch(e){if(box)box.textContent="";if(!afterImport)aiFail(e);}};
/* ═══ RITARATURA DEL PIANO ═══════════════════════════════════════
   Quando la stima dice che l'obiettivo non è raggiungibile, l'utente può
   far ritarare il piano: i piatti restano gli stessi, cambiano SOLO le
   grammature, giorno per giorno, verso il target calorico dell'app. */
window.retunePlan=async()=>{
  if(!aiOn())return aiFail(new Error("nokey")),false;
  const target=dayTargetK(),protG=dayTargetP();
  snapSave("prima di: ritaratura del piano");
  if(!S.customPlan){S.customPlan=JSON.parse(JSON.stringify(PLAN));PLAN=S.customPlan;}
  const box=document.getElementById("planOut")||document.getElementById("rulesOut");
  /* La settimana da ritarare parte da OGGI, non dal lunedì: la ricalibratura
     si fa quando serve, anche di mercoledì, e deve coprire i 7 giorni
     successivi nell'ordine in cui verranno davvero vissuti. */
  const start=wd(new Date());
  try{
    for(let n=0;n<7;n++){
      const di=(start+n)%7;
      if(box){box.style.display="block";box.textContent="⚖️ Ritaro il giorno "+(n+1)+" di 7 — "+PLAN[di].day+" verso ~"+target+" kcal…\n⏳ Può volerci qualche minuto, abbi un po' di pazienza: l'AI mantiene i tuoi piatti e cambia solo le quantità.";}
      const idx=[],list=[];
      PLAN[di].meals.forEach((m,mi)=>{
        /* i pasti in mensa/fuori si ritarano solo se li prepari tu:
           altrimenti sono indicazioni generiche, non piatti con grammature */
        if(m.type!=="norm"&&!(m.type==="mensa"&&outTypeIsPorto()))return;
        idx.push(mi);
        list.push({slot:m.n,desc:m.o[0].d,kcal:m.o[0].k});});
      if(!list.length)continue;
      const q='Aggiusta le GRAMMATURE di questi pasti di una giornata per arrivare a un totale di circa '+target+' kcal (tolleranza ±5%) e almeno '+protG+' g di proteine, MANTENENDO i piatti: cambia solo le quantità, al massimo aggiungi contorni di verdura, non stravolgere i piatti. '+rulesForAI()+' Usa valori nutrizionali REALI per le quantità che scrivi e non scendere sotto '+minMealKcal()+' kcal a pasto principale. Pasti: '+JSON.stringify(list)+'. Rispondi SOLO JSON array nello stesso ordine e con lo stesso numero di voci: [{"slot":"...","desc":"descrizione con grammature","kcal":n,"prot":n,"carb":n,"gras":n,"fibre":n,"zuccheri":n}]';
      let arr=null;
      for(let att=0;att<2&&!arr;att++){
        try{const r=parseAIJSON(await aiAsk(q));if(Array.isArray(r)&&r.length===list.length)arr=r;}
        catch(e){if(att===1)throw e;}
      }
      if(!arr)throw new Error("giorno "+PLAN[di].day+" non ritarato: riprova");
      arr.forEach((v,k)=>{const m=PLAN[di].meals[idx[k]];
        m.o[0]={d:String(v.desc||m.o[0].d),k:Math.round(v.kcal)||m.o[0].k,p:Math.round(v.prot)||0,c:Math.round(v.carb)||0,f:Math.round(v.gras)||0,
          fib:Math.round(v.fibre)||estFiberOf(v.desc),z:Math.round(v.zuccheri)||estSugarOf(v.desc)};
        delete S.permMeals[di+"_"+idx[k]];});
    }
    S.customShop=null;S.shop={};   /* la spesa va ricalcolata sulle nuove grammature */
    save();render("piano");

/* ═══ STAGIONALIZZAZIONE ═════════════════════════════════════════
   Il piano base resta generico ("verdura di stagione"); qui l'AI aggiunge
   ai pasti principali un'ALTERNATIVA marcata 🍂 con piatti e ingredienti
   adatti alla stagione corrente. In Oggi e nel Piano si sceglie l'opzione
   che si preferisce; rilanciandola, le alternative 🍂 vengono rinnovate. */
function seasonNow(){const m=new Date().getMonth()+1;
  return (m===12||m<=2)?"inverno":m<=5?"primavera":m<=8?"estate":"autunno";}
function seasonEmoji(s){return {primavera:"🌸",estate:"☀️",autunno:"🍂",inverno:"❄️"}[s||seasonNow()]||"🍂";}
function seasonLabel(s){return {primavera:"Primaverile",estate:"Estivo",autunno:"Autunnale",inverno:"Invernale"}[s||seasonNow()]||"Stagionale";}
const SEASON_RE=/^(🌸|☀️|🍂|❄️)/;
function optLabel(o,oi){const m=String((o&&o.d)||"").match(SEASON_RE);
  if(!m)return "Opzione "+(oi+1);
  return m[1]+" "+({"🌸":"Primaverile","☀️":"Estivo","🍂":"Autunnale","❄️":"Invernale"}[m[1]]||"Stagionale");}
window.seasonalizePlan=async()=>{
  if(!aiOn())return aiFail(new Error("nokey"));
  if(planIsEmpty())return dlgAlert("Il piano è vuoto: prima creane o importane uno.");
  const sea=seasonNow();
  if(!await dlgConfirm(seasonEmoji(sea)+" Stagionalizzo il piano — stagione attuale: "+sea+".\n\nIl piano base resta com'è: per i pasti principali l'AI aggiunge un'ALTERNATIVA marcata "+seasonEmoji(sea)+" "+seasonLabel(sea)+" con piatti e ingredienti di stagione (es. niente polenta e spezzatino d'estate, niente insalatone fredde d'inverno). Potrai scegliere l'opzione che preferisci pasto per pasto.\n\nLe alternative stagionali precedenti, di qualunque stagione, vengono sostituite.\n\n⏳ Può volerci qualche minuto."))return;
  const box=document.getElementById("planOut")||document.getElementById("rulesOut");
  if(box){box.style.display="block";box.textContent=seasonEmoji(sea)+" Sto preparando le alternative di stagione ("+sea+")…\n⏳ Può volerci qualche minuto, abbi un po' di pazienza.";}
  try{
    const list=[];
    PLAN.forEach(d=>d.meals.forEach(m=>{
      if(m.type!=="norm")return;
      if(!/pranzo|cena/i.test(m.n||""))return;
      list.push({day:d.day,slot:m.n,piatto:m.o[0].d,kcal:m.o[0].k,prot:m.o[0].p});}));
    if(!list.length)throw new Error("nessun pranzo o cena nel piano");
    const t=await aiAsk('Stagione attuale in Italia: '+sea+'. Questi sono i pranzi e le cene di un piano alimentare: '+JSON.stringify(list)+'. Per OGNI voce proponi UNA variante di stagione: un piatto adatto alla stagione ('+sea+') con ingredienti di stagione reperibili in un supermercato italiano, grammature indicate, kcal entro ±10% e proteine entro ±5 g rispetto al piatto originale. '+rulesForAI()+' Se un piatto è già perfettamente stagionale puoi ometterlo. Rispondi SOLO JSON array: [{"day":"Lunedì","slot":"Pranzo","d":"piatto con grammature","k":n,"p":n,"c":n,"f":n,"fib":n,"z":n}]');
    const arr=parseAIJSON(t);
    if(!Array.isArray(arr)||!arr.length)throw new Error("nessuna variante proposta");
    if(!S.customPlan){S.customPlan=JSON.parse(JSON.stringify(PLAN));PLAN=S.customPlan;}
    snapSave("prima di: stagionalizzazione");
    let n=0;
    /* via le 🍂 vecchie, dentro le nuove */
    PLAN.forEach(d=>d.meals.forEach(m=>{m.o=m.o.filter(o=>!SEASON_RE.test(o.d||""));}));
    arr.forEach(v=>{
      const d=PLAN.find(x=>x.day===v.day);if(!d)return;
      const m=d.meals.find(x=>x.n===v.slot&&x.type==="norm");if(!m||!v.d)return;
      m.o.push({d:seasonEmoji(sea)+" "+String(v.d),k:Math.round(v.k)||0,p:Math.round(v.p)||0,c:Math.round(v.c)||0,f:Math.round(v.f)||0,
        fib:Math.round(v.fib)||estFiberOf(v.d),z:Math.round(v.z)||estSugarOf(v.d)});n++;});
    if(!n)throw new Error("nessuna variante applicabile");
    save();render("piano");
    if(box)box.textContent="";
    dlgAlert(seasonEmoji(sea)+" Aggiunte "+n+" alternative "+seasonLabel(sea).toLowerCase()+" ("+sea+") ✓\n\nLe riconosci dall'etichetta "+seasonEmoji(sea)+" "+seasonLabel(sea)+" tra le opzioni dei pasti: scegli quella che preferisci dal Piano o da Oggi. Il piano base resta intatto.");
  }catch(e){if(box)box.textContent="";aiFail(e);}};

  if(mode==="giorno")return{from:back(n-1),to:today,bucket:"day"};
  if(mode==="settimana")return{from:back((n-1)*7),to:today,bucket:"week"};
  if(mode==="mese"){const f=new Date(today.getFullYear(),today.getMonth()-(n-1),1);f.setHours(12,0,0,0);return{from:f,to:today,bucket:"month"};}
  if(mode==="anno"){const f=new Date(today.getFullYear()-(n-1),0,1);f.setHours(12,0,0,0);return{from:f,to:today,bucket:"year"};}

/* ── 💬 Chiedi all'AI: contesto con dieta PIANIFICATA vs dati REALI ── */
/* Riepilogo della dieta pianificata (cosa mangeresti seguendo il piano): media
   sui 7 giorni del piano. Serve per le proiezioni quando i pasti reali non sono
   ancora stati registrati (altrimenti i giorni "vuoti" darebbero deficit ~ TDEE). */
function plannedDietSummary(){
  let pk=0,pp=0,pc=0,pf=0;for(let di=0;di<7;di++){const o=plannedTemplateOfDay(di);pk+=o.k;pp+=o.p;pc+=(o.c||0);pf+=(o.f||0);}
  return {kcal_giorno:Math.round(pk/7),proteine_g:Math.round(pp/7),carboidrati_g:Math.round(pc/7),grassi_g:Math.round(pf/7)};}
/* Sport + passi: MEDIA GIORNALIERA vera sul periodo tracciato (i giorni di
   riposo contano come 0), NON il valore grezzo di un singolo giorno — che
   gonfierebbe il deficit. Riporta anche quanti giorni compongono la media, così
   l'AI sa se il campione è affidabile (con 1-2 giorni lo sport è occasionale). */
function activityDailyAvg(recent){
  const nDays=recent.length;
  const totBurn=recent.reduce((a,x)=>a+(x.burn||0),0);
  const activeDays=recent.filter(x=>(x.burn||0)>0).length;
  return {giorni_considerati:nDays,giorni_con_attivita:activeDays,
    media_giornaliera_kcal:nDays?Math.round(totBurn/nDays):0,campione_sufficiente:nDays>=7};}
function buildDiaryContext(){
  const all=flattenDiet();
  const recentAll=all.slice(-30);
  const hardCount=recentAll.filter(d=>d.hard).length;
  const recent=recentAll.filter(d=>!d.hard); // le giornate difficili non sporcano le medie
  const avgOf=(arr,f)=>arr.length?Math.round(arr.reduce((a,x)=>a+(x[f]||0),0)/arr.length):0;
  // REALE: solo i giorni in cui i pasti sono stati davvero registrati (eat>0).
  // I giorni senza pasti segnati mostrerebbero deficit ~ TDEE e falserebbero tutto.
  const withMeals=recent.filter(d=>(d.eat||0)>0);
  const TDEE=tdee();
  const plan=plannedDietSummary();
  // Deficit da DIETA (parte affidabile): TDEE − intake pianificato (senza sport).
  const deficitDieta=TDEE-plan.kcal_giorno;
  // Sport/passi come MEDIA GIORNALIERA (non il dato puro di oggi).
  const act=activityDailyAvg(recent);
  const sportAvg=act.media_giornaliera_kcal;
  // Nel deficit teorico lo sport si aggiunge SOLO se il campione è sufficiente,
  // altrimenti col dato di 1-2 giorni sballerebbe la stima.
  const deficitTeorico=deficitDieta+(act.campione_sufficiente?sportAvg:0);
  const realDeficit=withMeals.length?avgOf(withMeals,"def"):null;
  const workoutsCount={};recent.forEach(d=>(d.workouts||[]).forEach(w=>{const s=String(w).split(" ")[0];if(s)workoutsCount[s]=(workoutsCount[s]||0)+1;}));
  // Ritmo peso osservato (kg/settimana) dallo storico pesate, se abbastanza dati
  let rateKgWeek=null;const W=(S.profile.weights||[]).filter(x=>x.w).slice(-10);
  if(W.length>=2){const days=(new Date(W[W.length-1].d)-new Date(W[0].d))/864e5;if(days>=5)rateKgWeek=Math.round((W[W.length-1].w-W[0].w)/days*7*100)/100;}
  const kgToGoal=(S.profile.goalW&&S.profile.w)?Math.round((S.profile.w-S.profile.goalW)*10)/10:null;
  return {
    obiettivo_peso_kg:S.profile.goalW||null,
    peso_attuale_kg:S.profile.w||null,
    kg_da_perdere:kgToGoal,
    tdee_kcal:TDEE,
    dieta_pianificata:{kcal_giorno:plan.kcal_giorno,proteine_g:plan.proteine_g,carboidrati_g:plan.carboidrati_g,grassi_g:plan.grassi_g,
      deficit_dieta_giorno:deficitDieta,
      sport_passi_media_giornaliera_kcal:sportAvg,
      giorni_considerati_per_sport:act.giorni_considerati,giorni_con_attivita:act.giorni_con_attivita,campione_sport_sufficiente:act.campione_sufficiente,
      deficit_teorico_giorno:deficitTeorico,
      spiegazione:"Deficit da dieta = TDEE("+TDEE+") − intake("+plan.kcal_giorno+") = "+deficitDieta+" kcal/giorno. Sport+passi vanno aggiunti come MEDIA GIORNALIERA ("+sportAvg+" kcal su "+act.giorni_considerati+" giorni, riposo incluso), non col valore di un singolo giorno; con pochi giorni consideralo occasionale. Deficit teorico = "+deficitTeorico+" kcal/giorno."},
    dati_reali:{giorni_con_pasti_registrati:withMeals.length,
      kcal_medie:withMeals.length?avgOf(withMeals,"eat"):null,
      proteine_medie_g:withMeals.length?avgOf(withMeals,"prot"):null,
      carboidrati_medi_g:withMeals.length?avgOf(withMeals,"c"):null,
      grassi_medi_g:withMeals.length?avgOf(withMeals,"f"):null,
      deficit_medio_reale_kcal:realDeficit,
      ritmo_peso_kg_settimana:rateKgWeek,
      giornate_difficili_escluse:hardCount},
    sonno_medio:avgOf(recent,"sleep")||null,relax_medio:avgOf(recent,"relax")||null,umore_medio:avgOf(recent,"feel")||null,
    allenamenti_per_tipo:workoutsCount,
    obiettivi:{passi_giorno_nota:"passi base ("+(((+S.profile.baseSteps>0)?+S.profile.baseSteps:3000))+"/giorno) già inclusi nel TDEE, nessun obiettivo passi separato",
      allenamenti_settimana:(S.profile.goalWorkoutList||[]).map(g=>({sport:g.sport,volte_settimana:g.perWeek,minuti:g.min})),
      dispendio_extra_medio_giornaliero_kcal:plannedActivityBurnFor(S.profile.w||70)},
    proiezione:(()=>{const s=simulateWeightDescent(S.profile.w,new Date());if(!s)return null;
      const Wt=(S.profile.weights||[]).filter(x=>x.w).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
      let delta=null,ideale=null;if(Wt.length){const last=Wt[Wt.length-1];ideale=projectedWeightAt(last.d);if(ideale!=null)delta=Math.round((last.w-ideale)*10)/10;}
      return {data_stimata:s.stalled?null:iso(s.etaDate),giorni_stimati:s.stalled?null:s.etaDays,deficit_iniziale_giorno:s.dailyDeficitStart,stallo:s.stalled,
        peso_reale_ultimo:Wt.length?Wt[Wt.length-1].w:null,peso_ideale_stessa_data:ideale,delta_kg_vs_ideale:delta,
        nota_delta:"delta>0 = sei indietro rispetto al piano; delta<0 = sei in anticipo"};})(),
    resoconti_settimanali:S.history.slice(-4).map(w=>({periodo:dateIT(w.from)+"→"+dateIT(w.to),kcal_medie:w.avgEat,deficit_medio:w.avgDef,peso:w.weight}))
  };}

  if(!silent&&S.history.length>=3){

    if(defOk&&wDrop<0.3){

      const cutoff=new Date(last3[0].from).getTime();
      const fats=S.profile.weights.filter(x=>x.fat!=null&&new Date(x.d).getTime()>=cutoff).map(x=>x.fat);

      }else if(fats.length<2){
        if(await dlgConfirm("⚖️ Peso fermo da 3 settimane. Prima di correggere il TDEE: la tua % di massa grassa È SCESA (bilancia impedenziometrica o plicometria)?\n\nOK = sì, è scesa (ricomposizione) · Annulla = no / non lo so")){
          recomp=true;
          dlgAlert("Perfetto: è ricomposizione (grasso giù, muscolo su a parità di peso). Nessuna correzione necessaria. Consiglio: registra la % di massa grassa nelle pesate per tracciarla.");
        }
      }
      if(!recomp){
      let sugg="Da 3 settimane il deficit teorico c'è ma il peso non scende: probabilmente il TDEE reale è più basso o il NEAT è calato.";
      if(aiOn()){try{
        const t=await aiAsk("In 3 settimane deficit teorico medio "+Math.round(last3.reduce((a,x)=>a+x.avgDef,0)/3)+" kcal/g ma peso invariato ("+last3[0].weight+"→"+last3[2].weight+" kg). Suggerisci in 2 frasi in italiano: correzione del moltiplicatore TDEE e/o aumento passi/NEAT quotidiano.");
        sugg=t;}catch(e){}}
      if(await dlgConfirm("📉 "+sugg+"\n\nAbbasso il fattore attività di 0.05, così il fabbisogno stimato diventa più prudente?",{ok:"Abbassa",ko:"Lascia così"})){
        S.profile.act=Math.max(1.15,Math.round((S.profile.act-0.05)*100)/100);}
      }
    }}
  S.week=freshWeek();save();if(!silent){render(cur);
  dlgAlert("Settimana salvata"+(wk.ai?" con report AI":"")+". Buona settimana nuova!");}}

/* ── Target giornalieri ────────────────────────────────────────────
   Le calorie del piano NON sono il fabbisogno: sono il fabbisogno meno il
   deficit che serve davvero per il ritmo di dimagrimento scelto.
   1 kg di grasso ≈ 7.700 kcal, quindi 0,5 kg a settimana ≈ 550 kcal al
   giorno di deficit. Il deficit viene comunque limitato al 25% del
   fabbisogno e il target non scende mai sotto un pavimento di sicurezza. */
function ratePerWeek(){const r=parseFloat((S.diet||{}).ritmo);return r>0?r:0.5;}
/* Ritmo che il target produce DAVVERO: il deficit è limitato al 30% del
   fabbisogno per sicurezza, quindi un ritmo molto ambizioso viene ridotto.
   Prima la riduzione era silenziosa e l'app mostrava un ritmo che non era
   quello reale: ora viene dichiarata. */
function rateEffective(){return Math.round(Math.abs(deficitTarget())*7/7700*100)/100;}
function rateCapped(){return defMode()==="ritmo"&&Math.abs(rateEffective()-ratePerWeek())>0.03;}
function rateNote(){
  if(!rateCapped())return "";
  const n=x=>String(x).replace(".",",");
  const su=/massa|aument/i.test(S.profile.goal||"");
  return "il ritmo richiesto ("+n(ratePerWeek())+" kg a settimana) supera il tetto di sicurezza"+
    (su?" del surplus":" del 30% del fabbisogno")+": il piano lavora a ~"+n(rateEffective())+" kg a settimana";}
/* Fabbisogno usato per i TARGET del piano. Il moltiplicatore di attività è
   una stima: se i tuoi giorni sono più fermi di quanto dichiarato, il
   fabbisogno risulta gonfiato e il target troppo alto. La "prudenza" lo
   abbassa di una percentuale scelta da te (0 = nessuna correzione). */
function prudence(){return Math.max(0,Math.min(20,+S.profile.prud||0));}
function tdeeTarget(){return Math.round(tdee()*(1-prudence()/100));}
/* Due modi di fissare il deficit:
   • "pct"   → una percentuale del fabbisogno (il più leggibile: 20% significa
               mangiare l'80% di quello che consumi)
   • "ritmo" → i chili a settimana desiderati (1 kg ≈ 7.700 kcal)

   professionista, e l'app lo segnala. */
function defMode(){return S.profile.defMode||"pct";}
function defPct(){return Math.max(5,Math.min(30,+S.profile.defPct||20));}
function deficitTarget(){
  const t=tdeeTarget(),g=(S.profile.goal||"").toLowerCase();
  /* Malattia e gravidanza non sono momenti da deficit: si va a mantenimento */
  if(illOn()||pregOn()!=="no")return 0;
  /* Mese di mantenimento programmato dopo i 3 mesi di deficit */
  if(cycMaintOn())return 0;
  if(/mantenimento/.test(g))return 0;
  if(/massa|aument/.test(g)){
    /* surplus coerente col ritmo scelto (kg presi a settimana), con tetto */
    const s=(defMode()==="ritmo")?Math.round(ratePerWeek()*7700/7):Math.round(t*0.12);
    return -Math.min(500,Math.max(150,s));}
  let d;
  if(defMode()==="pct")d=Math.round(t*defPct()/100);
  /* il ritmo scelto è il deficit, senza maggiorazioni nascoste: altrimenti
     l'app viaggiava a un ritmo diverso da quello dichiarato all'utente */
  else d=Math.round(ratePerWeek()*7700/7);
  return Math.min(d,Math.round(t*0.30));}
/* Pavimento del target. NON è il metabolismo basale: per dimagrire si deve
   per forza stare sotto il consumo totale, e con un peso elevato è normale
   (e sicuro) mangiare anche sotto il basale stimato, perché la differenza la
   copre il grasso corporeo. Il limite vero è un minimo assoluto sotto il
   quale diventa difficile coprire proteine e micronutrienti. */
/* ═══ FASE 1 · IL CONTRIBUTO FISIOLOGICO ═══════════════════════════
   physBonus() è un'AGGIUNTA al fabbisogno: base + questo, mai "compreso". */
function cycleDaysMax(){const n=+S.profile.cycleDays;return n>0?n:7;}
/* Ciclo, allattamento e gravidanza: solo profilo femminile */
function isFemale(){return S.profile.gender==="f";}
function physAllowed(){return isFemale()||PHYS_TEST_UNLOCK;}
/* Gravidanza: il fabbisogno cresce per trimestre (riferimenti LARN/EFSA:

const PREG_LBL={t1:"1° trimestre",t2:"2° trimestre",t3:"3° trimestre"};
function pregOn(){const p=(S.phys&&S.phys.preg)||"no";return (physAllowed()&&PREG_LBL[p])?p:"no";}
function pregKcal(){
  const p=pregOn();if(p==="no")return 0;

/* Infortunio e malattia riducono il MOVIMENTO, non il metabolismo basale:

   (quella dovuta all'attività), mai al basale stesso. */
function injOn(){return !!(S.phys&&S.phys.inj);}
function illOn(){return !!(S.phys&&S.phys.ill);}
function injPct(){const n=+S.profile.injPct;return n>0?Math.min(90,n):50;}
function illPct(){const n=+S.profile.illPct;return n>0?Math.min(90,n):30;}
function movePct(){ /* se coesistono, comanda il taglio maggiore: non si sommano */
  return Math.max(injOn()?injPct():0, illOn()?illPct():0);}
function moveCut(){
  const p=movePct();if(!p)return 0;
  const sopra=Math.max(0,tdee()-bmr());

function cyclePct(){const n=+S.profile.cyclePct;return n>0?n:5;}
function lactKcal(){

/* Giorni trascorsi dall'inizio della fase luteale; scaduta, si spegne da sola */
function cycleDay(){

  const a=safeDate(S.phys.cycleStart+"T12:00:00");if(!a)return 0;
  /* si confrontano i GIORNI, non gli istanti: prima di mezzogiorno la
     differenza sarebbe negativa e il primo giorno risultava zero */

  const n=Math.round((oggi-a)/864e5)+1;

   gravidanza) meno quello che si TOGLIE (movimento ridotto). Può essere
   negativo: in quel caso il target scende e le porzioni si riducono. */

function physNote(){
  const p=[];

  if(pregKcal())p.push("gravidanza, "+PREG_LBL[pregOn()]+": +"+pregKcal()+" kcal");
  if(injOn())p.push("infortunio, movimento ridotto del "+injPct()+"%: −"+(illOn()&&illPct()>injPct()?0:moveCut())+" kcal");
  if(illOn())p.push("malattia: deficit sospeso"+((!injOn()||illPct()>=injPct())?", movimento ridotto del "+illPct()+"%: −"+moveCut()+" kcal":""));

function cycleEndDate(){

  const a=safeDate(S.phys.cycleStart+"T12:00:00");if(!a)return null;

/* ═══ AVVISO SULLE DURATE ══════════════════════════════════════════

/* Etichetta breve per marcare le porzioni riscalate */
function physTag(){
  if(pregKcal())return "gravidanza";
  if(lactKcal())return "allattamento";
  if(cycleKcal())return "ciclo";
  if(illOn())return "malattia";
  if(injOn())return "infortunio";
  return "fisiologia";}
/* ═══ FASE 2 · fasce ottimizzate (allineamento LARN) ═════════════════
   L'unità di misura è la donna adulta: tutti gli altri sono un multiplo. */
const FAM_BANDS=[
  {k:"infante",  min:1,  max:3,  c:0.50, ico:"👶", l:"Infante (1-3 anni)",      rif:1000},
  {k:"bambino",  min:4,  max:9,  c:0.75, ico:"🧒", l:"Bambino (4-9 anni)",      rif:1500},
  {k:"adolescente",min:10,max:14,c:1.10, ico:"👦", l:"Adolescente (10-14 anni)",rif:2200}
];
function famAge(dob){const d=safeDate(dob);if(!d)return null;
  const t=new Date();let a=t.getFullYear()-d.getFullYear();
  const m=t.getMonth()-d.getMonth();
  if(m<0||(m===0&&t.getDate()<d.getDate()))a--;
  return a;}
/* Categoria e coefficiente da sesso + età */
function famBand(m){
  const a=famAge(m&&m.dob);
  if(a===null)return {k:"?",c:1,ico:"👤",l:"data mancante",rif:2000,age:null};
  const b=FAM_BANDS.find(x=>a>=x.min&&a<=x.max);
  if(b)return Object.assign({},b,{age:a});
  if(a<1)return {k:"infante",c:0.50,ico:"👶",l:"Infante (sotto 1 anno)",rif:1000,age:a};
  return (m.gender==="m")
    ? {k:"uomo", c:1.25,ico:"👨",l:"Uomo (15+ anni)",  rif:2500,age:a}
    : {k:"donna",c:1.00,ico:"👩",l:"Donna (15+ anni)", rif:2000,age:a};}
function famCoef(m){return famBand(m).c;}
/* Nome da mostrare: "Io" per l'utente, il nome scelto per gli altri
   (con la categoria come riserva se il nome non è stato scritto). */
function famName(m){return (m&&m.me)?"Io":(((m&&m.nome)||"").trim()||famBand(m).l.split(" (")[0]);}
/* L'utente stesso, come membro della tavola */
function meAsMember(){return {gender:S.profile.gender||"f",dob:S.profile.dob,me:true};}
function famAll(){return [meAsMember()].concat(S.family||[]);}
/* Somma dei coefficienti: quante "porzioni base" servono in pentola */
/* La MIA porzione vale sempre 1 — sono a dieta e il target è il mio.
   Gli altri valgono in proporzione al loro fabbisogno rispetto al mio. */
function famUnits(list){const all=list||famAll();
  const meC=famCoef(meAsMember())||1;
  return Math.round(all.reduce((a,m)=>a+(m&&m.me?1:famCoef(m)/meC),0)*100)/100;}
function famForAI(){
  if(!(S.family||[]).length)return "";
  return " IN CASA: oltre alla persona ci sono "+S.family.length+" familiari — "+
    S.family.map(m=>{const b=famBand(m);const base=b.l.split(" (")[0].toLowerCase()+" di "+b.age+" anni";return (m.nome||"").trim()?m.nome.trim()+" ("+base+")":base;}).join(", ")+
    ". Quando serve, ragiona sulle quantità per tutti: in totale valgono "+
    (Math.round(famUnits()*100)/100)+" porzioni di riferimento (donna adulta = 1).";}

  PLAN.forEach((d,di)=>{const dk=MENSA_DAYS.find(x=>x[1]===d.day);const v=dk?fm[dk[0]]:null;if(!v)return;

      if((v==="entrambi"&&/pranzo|cena/.test(sl))||(v==="pranzo"&&/pranzo/.test(sl))||(v==="cena"&&/cena/.test(sl)))out.push({di:di,mi:mi});});});

/* Allinea il TIPO dei pasti fuori casa alla scelta porto/fuori:
   "li preparo io" → type norm (entrano nella spesa),
   "li mangio fuori" → type mensa (esclusi dalla spesa). */
function outRetagMeals(){
  if(planIsEmpty())return false;
  if(!S.customPlan){S.customPlan=JSON.parse(JSON.stringify(PLAN));PLAN=S.customPlan;}
  const want=outTypeIsPorto()?"norm":"mensa";let ch=false;
  outMealsOfPlan().forEach(x=>{const m=PLAN[x.di].meals[x.mi];if(m&&m.type!==want){m.type=want;ch=true;}});
  if(ch){S.customShop=null;S.shop={};save();}
  return ch;}
/* Riscrive con l'AI i pasti fuori casa: trasportabili se li prepari tu,
   composizione generica se li mangi fuori. */
async function outMealsRewrite(v){
  const list=outMealsOfPlan().map(x=>{const m=PLAN[x.di].meals[x.mi];const o=(m.o&&m.o[0])||{};
    return {di:x.di,mi:x.mi,giorno:PLAN[x.di].day,slot:m.n,d:o.d,k:o.k,p:o.p};});
  if(!list.length)return false;
  snapSave("prima di: adattamento pasti fuori casa");
  const box=document.getElementById("planOut")||document.getElementById("rulesOut");
  if(box){box.style.display="block";box.textContent="🍱 Adatto i pasti fuori casa…";}
  try{
    const t=await aiAsk((v==="porto"
      ?'Questi pasti li prepara la persona e se li porta da casa. Riscrivili ESATTAMENTE come un normale pasto del piano — stessa struttura, stesse grammature, stesso livello di dettaglio degli altri pasti — con l\'unico vincolo che siano trasportabili in un contenitore e buoni anche freddi o riscaldati. Niente ricette elaborate. Mantieni per ogni pasto circa le stesse kcal e proteine indicate. '
      :'Questi pasti si consumano FUORI CASA (mensa, bar o ristorante): NON scegliere piatti precisi e non dare grammature precise. Per ciascuno scrivi UNA RIGA generica su come comporre il piatto (es. "una fonte proteica + verdura abbondante + una porzione di pane o pasta"), mantenendo circa le stesse kcal e proteine indicate. ')+rulesForAI()+
      ' Pasti: '+JSON.stringify(list)+'. Rispondi SOLO JSON array nello stesso ordine: [{"di":n,"mi":n,"d":"...","k":n,"p":n,"c":n,"f":n}]');
    const arr=parseAIJSON(t);
    if(Array.isArray(arr))arr.forEach(x=>{const m=PLAN[+x.di]&&PLAN[+x.di].meals[+x.mi];if(!m||!x.d)return;
      m.o=[{d:String(x.d),k:Math.round(x.k)||((m.o[0]||{}).k||0),p:Math.round(x.p)||((m.o[0]||{}).p||0),
        c:Math.round(x.c)||0,f:Math.round(x.f)||0,fib:estFiberOf(x.d),z:estSugarOf(x.d)}];});
    save();render(cur);if(box)box.textContent="";toast("Pasti fuori casa adattati ✓");return true;
  }catch(e){if(box)box.textContent="";aiFail(e);return false;}}
