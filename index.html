<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous" defer onerror="window._noScan=1"></script>

<style>
/* ══════════════════════════════════════════════════════════════
   NUTRY UI 2.0 — design system moderno
   Glass cards, gradienti animati, micro-interazioni, reveal on
   scroll, dock di navigazione flottante, zoom sui grafici.
   Tutti i selettori originali sono preservati.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bosco:#0E5132; --salvia:#16A34A; --menta:#E9F9EE; --crema:#F2F6F1; --card:#FFFFFF;
  --ink:#152218; --grigio:#5F7263; --linea:#DEEAE0;
  --zaff:#EA8A1F; --zaffbg:#FFF4E3; --mensa:#2563EB; --mensabg:#EAF1FE;
  --rosso:#DC4444; --rossobg:#FDECEC; --ok:#16A34A; --okbg:#E9F9EE;
  --grad:linear-gradient(135deg,#16A34A,#0E5132);
  --gradz:linear-gradient(135deg,#F5B142,#EA8A1F);
    --glass:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(14,60,30,.05),0 8px 24px -6px rgba(14,60,30,.10);
  --shadow-lift:0 2px 4px rgba(14,60,30,.06),0 18px 44px -10px rgba(14,60,30,.18);
  --hdr1:#0A3B22; --hdr2:#16A34A; --hdr3:#0E7A57;
  --r-lg:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
  --bosco:#8FE3A8; --salvia:#3ECF6E; --menta:#12301C; --crema:#0B120D; --card:#131E15;
  --ink:#E8F3E9; --grigio:#93A896; --linea:#243527;
  --zaff:#F2A94F; --zaffbg:#2C2110; --mensa:#7FA9F2; --mensabg:#131E31;
  --rosso:#EF8B8B; --rossobg:#2F1717; --ok:#3ECF6E; --okbg:#12301C;
  --glass:rgba(19,30,21,.72);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -6px rgba(0,0,0,.45);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 20px 48px -10px rgba(0,0,0,.6);
  --hdr1:#071F12; --hdr2:#1C7A3E; --hdr3:#0D4A34;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ═══ SOLO SCORRIMENTO VERTICALE ═══════════════════════════════════
   Niente barre laterali: tutto si adatta alla larghezza dello schermo.
   Le tre regole sotto sono la rete di sicurezza — se un elemento futuro
   dovesse sforare, si stringe invece di spingere fuori la pagina. */
html,body{overflow-x:hidden;max-width:100%}
img,canvas,table,pre,iframe,video{max-width:100%}
input,select,textarea,button{max-width:100%}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--crema);color:var(--ink);font-size:15px;padding-bottom:96px;transition:background .3s,color .3s;position:relative;min-height:100vh}
/* sfondo vivo: blob sfocati che fluttuano lentissimi */
/* v5.1: nessun blob animato/sfocato in sfondo (batteria) */
body::before,body::after{display:none!important}


h1,h2,.dayname{font-family:'Fraunces',Georgia,'Noto Serif',serif}
::selection{background:var(--salvia);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--linea);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--grigio)}
/* ══ HEADER: aurora animata + shrink allo scroll ══ */
header{background:linear-gradient(115deg,var(--hdr1),var(--hdr2),var(--hdr3),var(--hdr1));background-size:320% 320%;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:50;box-shadow:0 6px 24px -8px rgba(4,26,12,.55);transition:padding .3s var(--ease)}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.logo-badge{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:900;font-size:20px;letter-spacing:-.4px;line-height:1.15;transition:transform .25s var(--ease)}
.logo-badge:hover{transform:rotate(-2deg) scale(1.05)}
.hbtns{display:flex;gap:6px;align-items:center}
.hbtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:11px;padding:7px 10px;font-size:15px;cursor:pointer;transition:background .2s,transform .15s var(--ease)}
.hbtn:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.hbtn:active{transform:scale(.92)}
.streak{background:rgba(255,255,255,.16);border-radius:11px;padding:7px 10px;font-size:13px;font-weight:700}
.qstreak{margin-left:5px;display:inline-flex;align-items:center;gap:5px}
.qstreak .qdot{box-shadow:0 0 0 2px rgba(255,255,255,.6)}

/* ══ Scorrimento date ══ */
.datebar{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;flex:1;min-width:0}
.datebar button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:28px;height:28px;flex:none;font-size:15px;cursor:pointer;transition:transform .18s var(--ease),background .2s}
.datebar button:hover{background:rgba(255,255,255,.32);transform:scale(1.12)}
.datebar button:active{transform:scale(.88)}
.datebar .dt{font-size:13px;font-weight:600;text-transform:capitalize;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;cursor:pointer;transition:opacity .2s}
.datebar .dt:hover{opacity:.85}
.datebar .dt small{display:block;font-size:10px;opacity:.8}
/* ══ PAGINE: transizione slide+fade ══ */
.page{display:none;padding:16px;max-width:640px;margin:0 auto}
.page.active{display:block}

/* ══ NAV: dock flottante in vetro ══ */
.tabs{position:fixed;bottom:10px;left:6px;right:6px;background:var(--card);border:1px solid var(--linea);display:flex;z-index:60;padding:6px;border-radius:24px;box-shadow:var(--shadow-lift);margin-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 1px 6px;font-size:9.6px;letter-spacing:-.01em;white-space:nowrap;color:var(--grigio);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px;transition:background .25s,color .25s,transform .2s var(--ease);position:relative}
.tabs button .ic{font-size:20px;line-height:1;transition:transform .3s var(--ease)}
.tabs button:hover .ic{transform:translateY(-2px)}
.tabs button:active{transform:scale(.93)}
.tabs button.on{color:#fff;font-weight:700;background:var(--grad);box-shadow:0 6px 16px -4px rgba(22,163,74,.55)}

/* ══ CARD: vetro + lift al hover ══ */
.card{background:var(--card);border:1px solid var(--linea);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}

.card h2{font-size:16.5px;color:var(--bosco);margin-bottom:10px;letter-spacing:.1px}
.dayname{font-size:23px;color:var(--bosco);margin:24px 0 2px;display:flex;align-items:center;gap:9px}
.dayctx{font-size:12px;color:var(--grigio);font-style:italic;margin-bottom:10px}
/* ══ PASTI ══ */
.meal{background:var(--card);border:1px solid var(--linea);border-left:4px solid var(--salvia);border-radius:16px;padding:13px 14px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .4s}

.meal.free{border-left-color:var(--zaff);background:linear-gradient(135deg,var(--zaffbg),var(--card))}
.meal.mensa{border-left-color:var(--mensa);background:linear-gradient(135deg,var(--mensabg),var(--card))}
.meal.done{opacity:.55;filter:saturate(.7)}.meal.done .mdesc{text-decoration:line-through}
.meal.skip{opacity:.55;border-left-color:var(--rosso)}
.meal.skip .mdesc{text-decoration:line-through;color:var(--rosso)}
.chk{min-width:30px;height:30px;margin-top:1px;border:2px solid var(--salvia);border-radius:50%;background:var(--card);cursor:pointer;font-size:15px;line-height:26px;text-align:center;color:#fff;transition:transform .2s var(--ease),background .25s,box-shadow .25s}
.chk:hover{transform:scale(1.1)}
.chk:active{transform:scale(.82)}
.meal.free .chk{border-color:var(--zaff)}
.chk.c{background:var(--salvia);border-color:var(--salvia);box-shadow:0 0 0 5px color-mix(in srgb,var(--salvia) 18%,transparent)}
.meal.free .chk.c{background:var(--zaff);border-color:var(--zaff);box-shadow:0 0 0 5px color-mix(in srgb,var(--zaff) 18%,transparent)}
.chk.s{background:var(--rosso)!important;border-color:var(--rosso)!important}


.mbody{flex:1;min-width:0}
.mtop{display:flex;justify-content:space-between;gap:6px;font-size:12px;margin-bottom:2px}
.mname{font-weight:700;color:var(--bosco)}
.meal.free .mname{color:var(--zaff)}
.meal.mensa .mname{color:var(--mensa)}
.meal.skip .mname{color:var(--rosso)}
.mtime{color:var(--grigio)}
.qdot{display:inline-block;border-radius:50%;vertical-align:-1px;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.85) inset,0 1px 2px rgba(0,0,0,.18)}
.qdot.empty{background:transparent;border:2px dashed var(--linea);box-shadow:none}
.qwrap{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--grigio);white-space:nowrap}
.mdesc{font-size:13.5px;line-height:1.5}
.mkcal{font-size:12px;font-weight:700;color:var(--salvia);margin-top:3px}
.mopts{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.mopts button,.chipbtn{border:1.5px solid var(--linea);background:var(--card);border-radius:20px;padding:5px 12px;font-size:11.5px;cursor:pointer;color:var(--grigio);transition:all .2s var(--ease)}
.mopts button:hover,.chipbtn:hover{border-color:var(--salvia);color:var(--salvia);transform:translateY(-1px)}
.mopts button.sel{border-color:var(--zaff);color:var(--zaff);font-weight:700;background:var(--zaffbg)}
.mtools{margin-top:10px;display:flex;gap:8px;row-gap:8px;align-items:center;flex-wrap:wrap}
.mtools .btn{margin-top:0}
.mtools select{border:1px solid var(--linea);border-radius:10px;padding:7px 9px;font-size:11.5px;color:var(--grigio);background:var(--card);flex:1 1 120px;min-width:0}
.badge{font-size:10.5px;background:var(--okbg);color:var(--ok);border-radius:8px;padding:3px 9px;font-weight:700}
.badge.moved{background:var(--rossobg);color:var(--rosso)}
.badge.ai{background:var(--mensabg);color:var(--mensa)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--grigio);margin-top:6px;flex-wrap:wrap}
.legend b{font-size:14px}
.daytotal{font-size:13px;font-weight:700;color:var(--bosco);padding:6px 2px 14px}
.daytotal span{color:var(--salvia)}
/* ══ FORM ══ */
textarea,input[type=text],input[type=number],input[type=date],input[type=password],select{width:100%;border:1.5px solid var(--linea);border-radius:12px;padding:10px 11px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea:focus,input:focus,select:focus{border-color:var(--salvia);box-shadow:0 0 0 4px color-mix(in srgb,var(--salvia) 14%,transparent);outline:none}
textarea{min-height:54px;resize:vertical}
label{font-size:12px;font-weight:700;color:var(--grigio);display:block;margin:10px 0 4px}
/* ══ BOTTONI: gradiente + lift ══ */
.btn{display:inline-block;border:0;background:var(--grad);color:#fff;border-radius:13px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 6px 18px -6px rgba(22,163,74,.55);transition:transform .22s var(--ease),box-shadow .25s,filter .2s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px rgba(22,163,74,.65)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.96)}
html[data-theme="dark"] .btn{color:#04170B}
.btn.ghost{background:var(--card);color:var(--salvia);border:1.5px solid var(--salvia);box-shadow:none}
.btn.ghost:hover{background:var(--menta)}
.btn.warn{background:linear-gradient(135deg,#F06060,#DC4444);box-shadow:0 6px 18px -6px rgba(220,68,68,.55)}
.btn.small{padding:7px 13px;font-size:12.5px;margin-top:4px}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.row3{display:flex;gap:10px}.row3>*{flex:1;min-width:0}
/* Il troncamento vale SOLO per le etichette dentro le righe a colonne strette:
   applicato a tutte tagliava a metà le etichette lunghe in tutta l'app. */
.row2 label,.row3 label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Nessun contenuto deve uscire dal riquadro: parole lunghe, link e numeri
   vanno a capo invece di sfondare il bordo. */
.card,.obbox,.obwarn,.hint,.wline,.aibox{overflow-wrap:anywhere;word-break:break-word}
.card>*{max-width:100%}
/* ══ SPESA ══ */
.shopcat{font-weight:700;color:#fff;background:var(--grad);background-size:200% 200%;border-radius:16px 16px 0 0;padding:10px 14px;font-size:13.5px;margin-top:14px;letter-spacing:.2px}
.shopitems{background:var(--card);border:1px solid var(--linea);border-top:0;border-radius:0 0 16px 16px;padding:4px 0;box-shadow:var(--shadow)}
.shopitem{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--linea);font-size:13.5px;transition:background .2s,opacity .3s}
.shopitem:hover{background:color-mix(in srgb,var(--menta) 55%,transparent)}
.shopitem:last-child{border-bottom:0}
.shopitem.c{opacity:.42}.shopitem.c .st{text-decoration:line-through}
.shopitem .box{min-width:23px;height:23px;border:2px solid var(--salvia);border-radius:8px;text-align:center;line-height:19px;color:#fff;font-size:13px;cursor:pointer;flex-shrink:0;transition:transform .2s var(--ease),background .25s}
.shopitem .box:active{transform:scale(.8)}
.shopitem.c .box{background:var(--salvia)}
.shopitem .st{flex:1;cursor:pointer}
.ibtn{border:1px solid var(--linea);background:var(--card);border-radius:9px;padding:4px 8px;font-size:13px;cursor:pointer;flex-shrink:0;transition:transform .18s var(--ease),border-color .2s,color .2s;text-decoration:none;color:var(--ink)}
.ibtn:hover{transform:translateY(-1px) scale(1.06);border-color:var(--salvia)}
.ibtn:active{transform:scale(.9)}
/* ══ GAUGE / STATISTICHE ══ */
.gaugecard{background:var(--card);border:1px solid var(--linea);border-radius:22px;padding:18px;margin-bottom:13px;box-shadow:var(--shadow);text-align:center;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}


.stat3{display:flex;gap:9px;margin-top:12px}
.stat3>div{flex:1;background:var(--menta);border-radius:14px;padding:10px 4px;text-align:center;transition:transform .25s var(--ease),box-shadow .25s}
.stat3>div:hover{transform:translateY(-2px) scale(1.03);box-shadow:var(--shadow)}
.stat3 .v{font-weight:800;font-size:16px;color:var(--bosco)}
.stat3 .l{font-size:10.5px;color:var(--grigio)}
.mtx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mtx>div{background:var(--menta);border-radius:14px;padding:9px 8px 10px;min-width:0}
.mtx .v{font-weight:800;font-size:15.5px;color:var(--bosco);line-height:1.15}
.mtx .l{font-size:10px;color:var(--grigio);margin-top:1px}
.mtx .s{font-size:9.5px;color:var(--grigio);margin-top:3px}
.wline{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea);font-size:13.5px;gap:8px;transition:background .2s}
.wline:last-child{border-bottom:0}
.wline .del{color:var(--rosso);cursor:pointer;font-weight:700;padding:0 7px;transition:transform .15s var(--ease)}
.wline .del:hover{transform:scale(1.25)}
.water{display:flex;gap:4px;flex-wrap:nowrap;margin-top:6px}
.water span{flex:1 1 0;min-width:0;max-width:34px;height:36px;border:2px solid #B7CFEA;border-radius:8px 8px 12px 12px;cursor:pointer;font-size:clamp(11px,3.4vw,16px);text-align:center;line-height:33px;transition:all .28s var(--ease)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.duo .stars{font-size:19px;gap:3px}
.ckrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.ckrow2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0 10px}
.ckrow2 .ck{justify-content:center;padding:8px 3px;font-size:clamp(10px,3vw,12.5px);min-width:0;text-align:center;line-height:1.2}
.ckrow3 .ck{justify-content:center;padding:8px 3px;font-size:clamp(10px,3vw,12.5px);min-width:0;text-align:center;line-height:1.2}
.water span:hover{transform:translateY(-3px)}
.water span.f{background:linear-gradient(180deg,#EAF4FF,#C8E1FB);border-color:var(--mensa);transform:translateY(-3px);box-shadow:0 6px 12px -4px rgba(37,99,235,.35)}

html[data-theme="dark"] .water span.f{background:#1E3350}
.stars{display:flex;gap:5px;font-size:23px;cursor:pointer;user-select:none}
.stars span{filter:grayscale(1);opacity:.4;transition:all .25s var(--ease)}
.stars span:hover{transform:scale(1.25) rotate(8deg)}
.stars span.on{filter:none;opacity:1}

.hint{font-size:12px;color:var(--grigio);margin-top:7px;line-height:1.55}
.gtable{width:100%;font-size:13px}
.gtable td{padding:6px 6px;vertical-align:top;border-bottom:1px solid var(--linea)}
.gtable td:first-child{width:64px;text-align:center;font-size:17px}
.obwrap{max-width:620px;margin:0 auto}
.obtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.obstep{font-size:12px;font-weight:700;color:var(--grigio);letter-spacing:.03em}
.obdots{display:flex;gap:6px;margin-bottom:12px}
.obd{flex:1;height:5px;border-radius:3px;background:var(--linea)}
.obd.ok{background:var(--salvia);opacity:.55}
.obd.on{background:var(--salvia)}
.obp{font-size:14.5px;line-height:1.55;color:var(--ink);margin:0 0 12px}
.obwrap label{white-space:normal}
.obwrap .card{padding:16px 15px}
.obwrap input,.obwrap select,.obwrap textarea{max-width:100%}
.obbox{background:var(--menta);border-left:4px solid var(--salvia);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;margin:12px 0}
.obwarn{background:var(--zaffbg);border-left:4px solid var(--zaff);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;margin:12px 0}
.obwhere{font-size:12.5px;color:var(--grigio);margin-top:10px;padding-top:8px;border-top:1px dashed var(--linea)}
.obol{margin:8px 0 0 18px;padding:0;font-size:13px;line-height:1.7}
.obstat{display:inline-block;margin:0 14px 12px 0}
.obstat .n{font-size:30px;font-weight:800;color:var(--bosco);line-height:1}
.obstat .l{font-size:11.5px;color:var(--grigio);margin-top:3px}
.obchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.obcard{border:1px solid var(--linea);border-radius:14px;padding:13px}
.obcard h3{margin:0 0 6px;font-size:15px;color:var(--bosco)}
.obcard p{font-size:12.8px;line-height:1.5;color:var(--grigio);margin:0 0 10px}
@media(max-width:560px){.obchoice{grid-template-columns:1fr}}
.wzbar{display:flex;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.wzbar .btn{flex:1 1 104px;min-width:0;margin-top:0;text-align:center}
.wzval{margin:8px 0 0;padding:9px 11px;overflow-wrap:anywhere;line-height:1.5;border:1px dashed var(--linea);border-radius:12px;font-size:13px;color:var(--bosco);font-weight:600;background:var(--menta)}
.ctlrow{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:7px 11px;border-radius:14px;
  background:var(--card);border:1px solid var(--linea);font-size:12.5px;flex-wrap:wrap}
.ctlrow .cl{font-weight:700;color:var(--grigio);flex-shrink:0}
.ctlrow select{max-width:132px;min-width:0;flex:1 1 96px;font-size:12px;padding:5px 6px;margin:0}
.ctlrow .ck{display:flex;align-items:center;gap:4px;color:var(--grigio);flex-shrink:0}
.ctlrow .ck input{width:19px;height:19px;margin:0}
.ctlrow .ck input:disabled+span{opacity:.45}
.lnk{color:var(--salvia);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.wtab{font-size:12.5px;width:100%;table-layout:auto}
.wtab th,.wtab td{padding:7px 5px;white-space:nowrap}
.wtab th:first-child,.wtab td:first-child{padding-left:2px}
.wtab td:first-child{font-weight:600;color:var(--ink)}
@media(max-width:400px){.wtab{font-size:11.5px}.wtab th,.wtab td{padding:6px 3px}}
.card.pesata{border-left:4px solid var(--salvia);background:linear-gradient(180deg,var(--menta) 0%,var(--card) 42%)}
.card.pesata h2{color:var(--bosco)}
.clchip.on{border-color:var(--salvia);color:var(--salvia);font-weight:700;background:var(--menta)}
.ckline{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;font-weight:500;color:var(--ink)}
.ckline input{width:20px;height:20px;margin:0}
.ckline small{color:var(--grigio);font-weight:400}
.ctlrow .coff{color:var(--grigio);opacity:.6;flex-shrink:0}
.ctlrow .vbtn{flex-shrink:0;margin-left:auto;border:0;background:var(--salvia);color:#fff;font-size:15px;font-weight:800;
  width:38px;height:32px;border-radius:11px;cursor:pointer;line-height:1}
.ctlrow .vbtn.done{background:var(--menta);color:var(--salvia)}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px;padding:9px 13px;border-radius:14px;
  background:var(--menta);border-left:4px solid var(--salvia);cursor:pointer;font-size:12.5px}
.pbar.libero{background:var(--zaffbg);border-left-color:var(--zaff)}
.pbar.none{background:var(--card);border-left-color:var(--linea);color:var(--grigio)}
.pbar .pl{font-weight:700;color:var(--bosco)}
.pbar.none .pl{color:var(--grigio);font-weight:600}
.pbar .pd{color:var(--grigio)}
.pbar .pv{margin-left:auto;font-weight:700;color:var(--bosco)}
.pbar .pv+.pv{margin-left:0}
.pbar .pv.ok{color:var(--salvia)}
.pbar .pv.up{color:var(--rosso)}
.gsec{font-weight:700;color:var(--bosco);margin:10px 0 2px;font-size:13.5px}
details.why{margin-top:5px}
details.why>summary{cursor:pointer;color:var(--salvia);font-weight:600;font-size:11.5px;list-style:none;display:inline-block}
details.why>summary::-webkit-details-marker{display:none}
details.why>summary::after{content:" ▸"}
details.why[open]>summary::after{content:" ▾"}
details.why>div{margin-top:5px;padding-left:9px;border-left:2px solid var(--linea)}
details.adv{margin:12px 0 2px;border-top:1px solid var(--linea);padding-top:10px}
details.adv>summary{cursor:pointer;font-weight:700;color:var(--grigio);font-size:13px;list-style:none;padding:8px 10px;background:var(--crema);border-radius:10px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"▸ ";color:var(--salvia)}
details.adv[open]>summary::before{content:"▾ "}
details.adv[open]>summary{margin-bottom:6px}
.aibox{background:var(--mensabg);border:1px solid var(--linea);border-radius:14px;padding:12px;margin-top:9px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.histweek{border:1px solid var(--linea);border-radius:16px;background:var(--card);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .3s}
.histweek:hover{box-shadow:var(--shadow-lift)}
.histweek .hh{padding:12px 14px;display:flex;justify-content:space-between;cursor:pointer;font-weight:700;color:var(--bosco);font-size:14px;transition:background .2s}
.histweek .hh:hover{background:color-mix(in srgb,var(--menta) 50%,transparent)}
.histweek .hb{display:none;padding:0 14px 12px;font-size:13px}
.histweek.open .hb{display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 4px;border-bottom:1px solid var(--linea);text-align:left}
th{color:var(--grigio);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr{transition:background .15s}
tbody tr:hover,table tr:hover td{background:color-mix(in srgb,var(--menta) 40%,transparent)}
.pill{display:inline-block;font-size:11px;border-radius:14px;padding:3px 10px;background:var(--okbg);color:var(--ok);font-weight:700;margin:2px 3px 0 0}
.todaytag{background:var(--gradz);color:#fff;border-radius:8px;font-size:10.5px;padding:3px 9px;font-family:system-ui;font-weight:700;box-shadow:0 3px 8px -2px rgba(234,138,31,.5)}
/* ══ GRAFICI: zoomabili ══ */
canvas{max-width:100%;cursor:zoom-in;border-radius:10px;transition:transform .25s var(--ease)}

#zoomOv{position:fixed;inset:0;background:rgba(6,14,8,.88);z-index:120;display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#zoomOv.on{display:flex}

#zoomOv img{max-width:96vw;max-height:82vh;background:#fff;border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);transform-origin:center;cursor:grab;user-select:none;-webkit-user-drag:none}
html[data-theme="dark"] #zoomOv img{background:#131E15}

#zoomOv .ztools{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;background:var(--card);border:1px solid var(--linea);border-radius:20px;padding:8px;box-shadow:var(--shadow-lift)}
#zoomOv .ztools button{border:0;background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:40px;font-size:17px;cursor:pointer;transition:transform .18s var(--ease),background .2s}
#zoomOv .ztools button:hover{transform:scale(1.1);background:var(--menta)}
#zoomOv .zhint{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font-size:12px;opacity:.8;background:rgba(0,0,0,.35);border-radius:14px;padding:6px 13px}
#scanbox{display:none;margin-top:10px}
#scanreader{width:100%;border-radius:14px;overflow:hidden}

function estFiberOf(d){const s=(d||"").toLowerCase();let f=0;const add=(re,g)=>{if(re.test(s))f+=g;};

  return Math.min(22,Math.round(f));}

   • auto      → Katch-McArdle se conosci la % di grasso, altrimenti Mifflin
   • mifflin   → sempre su peso/altezza/età (la più usata)
   • katch     → solo su massa magra (richiede la % di grasso)

function bmr(){const p=S.profile;
  if(!(+p.w>0)||!(+p.h>0))return 0; // profilo non ancora compilato
  const fat=parseFloat(p.fatp);
  const lbm=fat>0?p.w*(1-fat/100):parseFloat(p.lbm); // magra in kg dalla % di grasso
  const F=bmrFormula();
  const mifflin=()=>{const b=10*p.w+6.25*p.h-5*age();return Math.round(p.gender==="m"?b+5:b-161);};
  const katch=()=>lbm>0?Math.round(370+21.6*lbm):mifflin();
  const harris=()=>Math.round(p.gender==="m"      /* Harris-Benedict rivista (Roza 1984) */
    ?88.362+13.397*p.w+4.799*p.h-5.677*age()
    :447.593+9.247*p.w+3.098*p.h-4.330*age());
  if(F==="mifflin")return mifflin();
  if(F==="katch")return katch();
  if(F==="harris")return harris();

function extrasKcal(di){return S.week.days[di].extras.reduce((a,e)=>a+(e.st==="skip"?0:e.k),0);}
function skippedOfDay(di){return dayItems(di).filter(it=>S.week.days[it.pdi].meals[it.mi].skip).length;}
/* Opzione di PIANO di un pasto: quella prevista dal piano (o l'override
   permanente), MAI la modifica temporanea della settimana (ribilancio, foto,
   barcode, matita). Serve a tenere il "pianificato" del giorno FISSO e a
   confrontarlo con quello realmente mangiato. */
/* Opzione GREZZA del piano: quella scritta dall'utente (o l'override
   permanente), senza alcuna correzione fisiologica. È la base neutra. */
function rawPlanOpt(pdi,mi){const st=S.week.days[pdi].meals[mi];
  const perm=S.permMeals[pdi+"_"+mi];
  if(perm&&st.opt===0)return perm;
  return PLAN[pdi].meals[mi].o[st.opt]||PLAN[pdi].meals[mi].o[0];}
/* ═══ RISCALATURA FISIOLOGICA DELLE PORZIONI ═══════════════════════
   Ciclo, allattamento, gravidanza (in più) e movimento ridotto (in meno)
   NON riscrivono il piano: agiscono come un MOLTIPLICATORE calcolato sulle
   kcal del piano DELL'UTENTE, non su quelle stimate dal sistema. Così una
   forzatura fatta a mano non viene persa, e quando lo stato si spegne le
   grammature tornano esattamente quelle di base (il fattore torna a 1).
   Presupposto: il piano di base deve essere in stato NEUTRO, cioè scritto
   senza avere già conteggiato ciclo/allattamento/gravidanza. */
function planBaseKOfDay(di){let k=0;
  if(!S||!S.week||!S.week.days||!S.week.days[di]||!PLAN||!PLAN.length)return 0;
  dayItems(di).forEach(it=>{const o=rawPlanOpt(it.pdi,it.mi);k+=(o&&+o.k)||0;});return k;}
function physFactor(di){
  const d=physDelta();if(!d)return 1;
  const base=planBaseKOfDay(di);
  if(!(base>0))return 1;
  /* limiti di sicurezza: mai meno del 70% né più del 160% del piano */
  return Math.max(0.7,Math.min(1.6,Math.round((1+d/base)*1000)/1000));}
function physPct(di){return Math.round((physFactor(di)-1)*100);}
function scaleOpt(o,fac){
  if(!o||fac===1)return o;
  const r=x=>(x==null?x:Math.round(x*fac));
  const pct=Math.round((fac-1)*100);
  return {d:String(o.d||"")+(pct?" · porzioni "+(pct>0?"+":"−")+Math.abs(pct)+"% ("+physTag()+")":""),
    k:Math.round((+o.k||0)*fac),p:r(o.p),c:r(o.c),f:r(o.f),fib:r(o.fib),z:r(o.z)};}
function planOpt(pdi,mi){return scaleOpt(rawPlanOpt(pdi,mi),physFactor(assignedDay(pdi,mi)));}
function plannedOfDay(di){let k=0,p=0,c=0,f=0,fib=0,z=0;
  dayItems(di).forEach(it=>{const o=planOpt(it.pdi,it.mi);
    k+=o.k;p+=o.p;c+=o.c||0;f+=o.f||0;fib+=o.fib||0;z+=o.z||0;});return{k,p,c,f,fib,z};}
/* v5: i passi quotidiani sono dentro al TDEE (passi base, vedi tdee()).
   Le camminate "vere" si registrano come sport. stepsKcal resta per
   compatibilità ma vale sempre 0. */
function burnedOfDay(di){return S.week.days[di].workouts.reduce((a,w)=>a+workoutKcal(w),0);}
function deficitOfDay(di){return tdeeOfDay(di)+burnedOfDay(di)-eatenOfDay(di).k;}
/* ── Obiettivi passi/allenamenti e PROIEZIONE non lineare del peso ──────────
   Man mano che si dimagrisce il BMR cala (dipende dal peso), quindi il deficit
   si riduce e il calo rallenta: la discesa NON è lineare. Simuliamo giorno per
   giorno ricalcolando BMR sul peso corrente. Sport e passi vengono dagli
   OBIETTIVI (media giornaliera), non dal singolo dato. */
function bmrForWeight(w){const p=S.profile;const fat=parseFloat(p.fatp);
  const lbm=fat>0?w*(1-fat/100):parseFloat(p.lbm);
  if(lbm>0)return Math.round(370+21.6*lbm);
  const base=10*w+6.25*p.h-5*age();return Math.round(p.gender==="m"?base+5:base-161);}
function workoutBurnFor(sport,min,intensity,w){ // stessa formula usata ovunque
  return Math.round(metUsed(sport,intensity)*w*((+min||0)/60));}
/* Dispendio EXTRA medio giornaliero dagli obiettivi (passi/giorno + lista allenamenti/sett) */
function plannedActivityBurnFor(w){let b=0;const p=S.profile;
  (p.goalWorkoutList||[]).forEach(g=>{if(g.sport&&g.perWeek)b+=Math.round(workoutBurnFor(g.sport,g.min||30,"media",w)*g.perWeek/7);});
  return b;}
/* Simulazione della discesa del peso a partire da (startW,startDate) fino
   all'obiettivo, con deficit = TDEE(peso) + attività pianificata − intake dieta.
   Ritorna i punti (campionati ~settimanalmente), i giorni stimati e la data. */
function simulateWeightDescent(startW,startDate){
  const p=S.profile,goal=p.goalW;
  startW=startW||p.w;const start=startDate?new Date(startDate):new Date();start.setHours(12,0,0,0);
  if(!goal||!startW||startW<=goal)return null;
  const intake=plannedDietSummary().kcal_giorno;
  const dailyDeficitStart=Math.round(bmrForWeight(startW)*p.act)+plannedActivityBurnFor(startW)-intake;
  let w=startW;const pts=[{d:new Date(start),w:Math.round(w*10)/10}];
  let day=0;const MAX=3650;let stalled=false,pausa=0;
  while(w>goal&&day<MAX){day++;
    const dt=new Date(start);dt.setDate(dt.getDate()+day);
    /* Nelle settimane di mantenimento programmate si mangia a fabbisogno:
       il peso resta fermo e la curva si appiattisce. Non è uno stallo. */
    if(cycMaintAtDate(dt)){pausa++;
      if(day%7===0)pts.push({d:dt,w:Math.round(w*10)/10});
      continue;}
    const def=Math.round(bmrForWeight(w)*p.act)+plannedActivityBurnFor(w)-intake;
    if(def<=0){stalled=true;break;}
    w-=def/7700;if(w<goal)w=goal;
    if(day%7===0||w<=goal)pts.push({d:dt,w:Math.round(w*10)/10});}
  const reached=w<=goal+0.05&&!stalled;
  const etaDate=new Date(start);etaDate.setDate(etaDate.getDate()+day);
  return {points:pts,etaDays:day,etaDate,reached,stalled,dailyDeficitStart,intake,pausa};}
/* Peso "ideale" proiettato a una certa data, partendo dalla prima pesata reale */
function projectedWeightAt(dateISO){
  const W=(S.profile.weights||[]).filter(x=>x.w).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
  if(!W.length)return null;
  const sim=simulateWeightDescent(W[0].w,W[0].d);if(!sim)return null;
  const target=new Date(dateISO).getTime();let best=sim.points[0];
  sim.points.forEach(pt=>{if(pt.d.getTime()<=target)best=pt;});
  return best?best.w:null;}
/* ═══ ACQUA ═══════════════════════════════════════════════════════
   Il fabbisogno idrico TOTALE non coincide con l'acqua da bere: una
   quota arriva dagli alimenti (frutta, verdura, minestre, latte…) e,
   in misura minore, dal metabolismo. Le linee guida europee stimano
   che circa il 20-25% dell'acqua totale venga dal cibo.
   Inoltre i ml/kg non scalano in modo lineare: il tessuto adiposo
   contiene molta meno acqua del muscolo, quindi su BMI alti un
   coefficiente fisso di 35 ml/kg sovrastima il bisogno reale. */
const WATER_FOOD_SHARE=0.22;              /* quota che arriva dal cibo */
function waterMlPerKg(){
  const p=S.profile,b=(p.h>0&&p.w>0)?(p.w/Math.pow(p.h/100,2)):22;
  if(b>=30)return 28;                     /* molta massa grassa: meno acqua per kg */
  if(b>=25)return 32;
  return 35;}
/* Fabbisogno idrico totale in litri (cibo + bevande) */
function waterTotalL(){
  const w=+S.profile.w||70;
  return Math.min(6,Math.max(1.8,w*waterMlPerKg()/1000));}
/* Proposta di acqua DA BERE: totale meno la quota che arriva dal cibo,
   arrotondata a 0,25 L (= un bicchiere esatto) */
function waterSuggestL(){
  const drink=waterTotalL()*(1-WATER_FOOD_SHARE);
  return Math.min(4,Math.max(1.25,Math.round(drink*4)/4));}
/* Spiegazione del calcolo, mostrata sotto al campo */
function waterExplain(){
  const tot=waterTotalL(),food=tot*WATER_FOOD_SHARE,drink=waterSuggestL();
  const n=x=>String(Math.round(x*100)/100).replace(".",",");
  return "fabbisogno totale ~"+n(tot)+" L ("+waterMlPerKg()+" ml per kg), di cui ~"+n(food)+
    " L arriva già dal cibo → <b>~"+n(drink)+" L da bere</b> ("+Math.round(drink*4)+" bicchieri)";}
/* Obiettivo acqua: l'utente lo sceglie in IO (litri/giorno); se non impostato
   si usa la proposta in base al peso. +2 bicchieri se allenamento intenso o >45'.
   1 bicchiere = 250 ml. */
function waterGoal(di){const hard=S.week.days[di].workouts.some(w=>w.int==="alta"||w.min>45);
  const litri=(+S.profile.waterGoalL>0)?+S.profile.waterGoalL:waterSuggestL();
  const base=Math.min(24,Math.max(4,Math.round(litri*4))); // bicchieri da 250 ml
  return base+(hard?2:0);}

/* ═══════════════════════════════════════════════════════════════
   5. STREAK 🔥 (giorni in target consecutivi) — congelata in vacanza
   ═══════════════════════════════════════════════════════════════ */
function dayInTarget(di){const e=eatenOfDay(di);
  return e.k>0&&deficitOfDay(di)>=0&&extrasKcal(di)<=300;}
function isHard(dISO){return !!(S.hardDays&&S.hardDays[dISO]);}
function bumpStreak(){const y=new Date();y.setDate(y.getDate()-1);y.setHours(12,0,0,0);
  const yIso=iso(y);if(S.streak.last===yIso)return;
  if(S.ui.vacanza||isHard(yIso)){S.streak.last=yIso;save();return;} // vacanza o giornata difficile: congela
  const prev=new Date(y);prev.setDate(prev.getDate()-1);
  if(dayInTarget(wd(y))){S.streak.count=(S.streak.last===iso(prev)||S.streak.count===0)?S.streak.count+1:1;
    if(S.streak.count>0&&S.streak.count%7===0)setTimeout(()=>{confetti();toast("🔥 "+S.streak.count+" giorni in target di fila!");},600);}
  else S.streak.count=0;
  S.streak.last=yIso;save();}

/* ═══════════════════════════════════════════════════════════════
   6. AI GEMINI (chiave utente) — con fallback manuale ovunque
   ═══════════════════════════════════════════════════════════════ */
/* Catena modelli Gemini aggiornata (giu 2026): 2.0/1.5 sono stati spenti.
   "auto" prova in ordine; un modello scelto a mano viene provato per primo. */
const GEM_CHAIN=["gemini-3.5-flash","gemini-3.1-flash-lite","gemini-2.5-flash","gemini-2.5-flash-lite"];
const GEM_ALL=["auto"].concat(GEM_CHAIN,["gemini-2.5-pro"]).filter((m,i,a)=>a.indexOf(m)===i);
/* I modelli nuovi non richiedono un aggiornamento dell'app: l'elenco vero
   viene chiesto a Google e i più recenti finiscono in cima alla catena.
   Il controllo si fa da solo una volta a settimana, e si può forzare da Io. */
function gemDiscovered(){const d=(S.ai&&S.ai.models)||null;
  return (d&&Array.isArray(d.list)&&d.list.length)?d.list:null;}
function gemVer(n){const m=String(n).match(/gemini-(\d+)(?:\.(\d+))?/);
  return m?(+m[1])+(m[2]?(+m[2])/10:0):0;}
function gemScore(n){
  const m=String(n).match(/gemini-(\d+)(?:\.(\d+))?/);
  if(!m)return -1;
  let s=(+m[1])*1000+(+(m[2]||0))*100;
  if(/pro/.test(n))s+=60; else if(/flash-lite/.test(n))s+=10; else if(/flash/.test(n))s+=40;
  if(/preview|exp/.test(n))s-=15;                 /* i preview restano dietro */
  return s;}
async function gemRefreshModels(silent){
  const key=(S.ai&&S.ai.key||"").trim();if(!key)return null;
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?key="+encodeURIComponent(key));
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const list=(j.models||[])
      .filter(m=>(m.supportedGenerationMethods||[]).indexOf("generateContent")>-1)
      .map(m=>String(m.name||"").replace(/^models\//,""))
      /* solo modelli stabili, con versione esplicita e non troppo vecchi:
         niente preview/exp/varianti sperimentali, niente sotto la 2.5 */
      .filter(n=>/^gemini-\d/.test(n)
        &&!/embedding|aqa|image|tts|audio|native|vision/.test(n)
        &&!/preview|exp|experimental|customtools|thinking|latest|\d{3,}/.test(n)
        &&gemVer(n)>=2.5)
      .sort((a,b)=>gemScore(b)-gemScore(a));
    if(!list.length)throw new Error("nessun modello disponibile");
    S.ai.models={at:Date.now(),list:list};save();
    if(!silent){
      render("io");                       /* la tendina si ricostruisce coi modelli trovati */
      await dlgAlert("Modelli disponibili sul tuo account: "+list.length+"\n\nI più recenti:\n• "+list.slice(0,6).join("\n• ")+
        "\n\nLi trovi ora nella tendina qui sotto. In modalità «auto» l'app usa il migliore disponibile e scende agli altri se non risponde: quando Google pubblica un modello nuovo lo prende da solo, senza aggiornare l'app.");
    }
    return list;
  }catch(e){if(!silent)dlgAlert("Non riesco a leggere l'elenco dei modelli: "+e.message+"\n\nL'app continua a funzionare con la catena predefinita.");return null;}
}
window.gemRefreshModels=gemRefreshModels;
/* L'elenco dei modelli si aggiorna da solo a OGNI apertura dell'app, in
   silenzio e senza bloccare nulla: quando Google ne pubblica uno nuovo lo
   si trova già in lista, senza dover aggiornare l'app. Una sola volta per
   sessione, e non prima di 6 ore dall'ultimo controllo riuscito. */
setTimeout(()=>{const d=(S.ai&&S.ai.models)||null;
  if((S.ai&&S.ai.key)&&(!d||Date.now()-(d.at||0)>6*36e5))gemRefreshModels(true);},3000);
/* e anche quando si torna sull'app dopo averla lasciata in secondo piano */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  const d=(S.ai&&S.ai.models)||null;
  if((S.ai&&S.ai.key)&&(!d||Date.now()-(d.at||0)>6*36e5))gemRefreshModels(true);});
function gemModels(){const m=S.ai.model||"auto";
  /* in auto: prima i modelli scoperti (ordinati per generazione), poi la
     catena predefinita come rete di sicurezza */
  const disc=gemDiscovered();
  const base=disc?disc.slice(0,4).concat(GEM_CHAIN.filter(x=>disc.indexOf(x)<0)):GEM_CHAIN;
  return m==="auto"?base:[m].concat(base.filter(x=>x!==m));}
/* parts extra (immagini) in formato Gemini inline_data */
/* Registra consumo giornaliero (chiamate + token dichiarati da Gemini) */
function trackUsage(tok,err){const t=new Date().toISOString().slice(0,10);
  if(S.usage.day!==t){S.usage.day=t;S.usage.calls=0;S.usage.tokens=0;S.usage.errors=0;}
  if(err){S.usage.errors++;}else{S.usage.calls++;S.usage.tokens+=tok||0;}
  S.usage.last=new Date().toISOString();save();
  const el=document.getElementById("usageLine");if(el)el.innerHTML=usageHtml();}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* Indicatore "elaborazione in corso" per ogni chiamata AI */
let AIBUSY=0;
function aiBusy(){AIBUSY++;const e=document.getElementById("aiSpin");if(e)e.classList.add("on");}
function aiDone(){AIBUSY=Math.max(0,AIBUSY-1);if(AIBUSY===0){const e=document.getElementById("aiSpin");if(e)e.classList.remove("on");}}
let toastT=null;
function toast(msg){const e=document.getElementById("toast");if(!e)return;
  e.textContent=msg;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),2600);}
/* v5.1: coriandoli disattivati (26 nodi animati per volta = batteria) */
function confetti(){}
function vibra(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
/* Chiamata Gemini robusta: fino a 3 tentativi per modello con backoff su 429/503/rete;
   passa al modello successivo su 404/quota; errori tipizzati per messaggi chiari. */
/* Il tempo di risposta cresce con la lunghezza del prompt e con le immagini:
   un limite fisso di 25 s faceva fallire la generazione del piano (prompt
   lunghi, un giorno alla volta) con un errore che sembrava di rete. */
function aiTimeoutFor(prompt,imgs){
  const n=(imgs||[]).length,len=String(prompt||"").length;
  if(n>0)return 120000;                  /* foto: analisi più lenta */
  if(len>1800)return 90000;              /* piano, ribilanci, report */
  return 45000;}
async function geminiCall(prompt,imgs){
  const key=(S.ai&&S.ai.key||"").trim();if(!key)throw new Error("nokey");
  const parts=[];
  (imgs||[]).forEach(im=>parts.push({inline_data:{mime_type:im.mime||"image/jpeg",data:im.b64}}));
  parts.push({text:prompt});
  aiBusy();
  try{
  let lastErr=null;
  for(const m of gemModels()){
    for(let attempt=0;attempt<3;attempt++){
      /* dichiarato QUI e non dentro il try: il catch deve poterlo leggere,
         altrimenti ogni errore diventa un ReferenceError e la logica di
         riprova non parte mai */
      let timedOut=false;
      try{
        const ctrl=new AbortController();
        const to=setTimeout(()=>{timedOut=true;ctrl.abort();},aiTimeoutFor(prompt,imgs));
        let r;
        try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(key),{
          method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}]}),signal:ctrl.signal});}
        finally{clearTimeout(to);}
        if(r.status===429){lastErr=new Error("quota");break;}              // quota: cambia modello
        if(r.status===404){lastErr=new Error("modello");break;}            // modello assente: cambia
        if(r.status===503||r.status===500){lastErr=new Error("busy");await wait(800*(attempt+1));continue;} // sovraccarico: riprova
        if(r.status===400){throw new Error("badkey");}                     // chiave/permessi
        if(!r.ok)throw new Error("HTTP "+r.status);
        const j=await r.json();
        if(j.promptFeedback&&j.promptFeedback.blockReason)throw new Error("blocked");
        const txt=(j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.map(p=>p.text||"").join(""))||"";
        trackUsage((j.usageMetadata&&j.usageMetadata.totalTokenCount)||0,false);
        return txt;
      }catch(e){lastErr=e;
        const msg=String(e.message||e);
        if(timedOut){lastErr=new Error("timeout");await wait(900*(attempt+1));continue;}   // troppo lento: riprova
        if(e.name==="AbortError"||/Failed to fetch|NetworkError|load failed/i.test(msg)){lastErr=new Error("rete");await wait(900*(attempt+1));continue;} // rete: riprova
        if(/quota|modello/.test(msg))break; // gestiti sopra
        break; // badkey/blocked/altro: non riprovare, prova prossimo modello
      }
    }
  }
  trackUsage(0,true);
  throw lastErr||new Error("errore");
  }finally{aiDone();}}
const aiOn=()=>!!(S.ai&&S.ai.key);
async function aiAsk(prompt){return geminiCall(prompt);}
async function aiAskVision(prompt,imgs){return geminiCall(prompt,imgs);}
/* Scatta/scegli una foto e ridimensionala (max 1024px, JPEG) per contenere i token */
/* Riduce l'immagine prima di mandarla all'AI: meno dati, meno attesa */
function shrinkImg(f){return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{
    const MAX=1024,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res({b64:c.toDataURL("image/jpeg",0.82).split(",")[1],mime:"image/jpeg"});
    URL.revokeObjectURL(img.src);};
  img.onerror=()=>{URL.revokeObjectURL(img.src);rej(new Error("immagine non leggibile"));};
  img.src=URL.createObjectURL(f);});}
/* Due sorgenti separate, ognuna col suo pulsante:
   - fotocamera: capture="environment" apre direttamente l'obiettivo
   - galleria:   nessun capture + multiple, per immagini già salvate
     (indispensabile quando manca la rete o la foto è stata scattata prima) */
function pickPhoto(opts){opts=opts||{};return new Promise((res,rej)=>{
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  if(opts.gallery){if(opts.multi)inp.multiple=true;}
  else inp.setAttribute("capture","environment");   /* la fotocamera scatta una foto alla volta */
  inp.style.position="fixed";inp.style.left="-9999px";
  document.body.appendChild(inp);
  const cleanup=()=>{try{inp.remove();}catch(_){}};
  inp.onchange=e=>{const files=Array.prototype.slice.call((e.target&&e.target.files)||[]);
    cleanup();
    if(!files.length)return rej(new Error("annullato"));
    Promise.all(files.map(shrinkImg)).then(list=>res((opts.gallery&&opts.multi)?list:list[0]),rej);};
  inp.click();});}
/* 📸 scatta ora */
function snapPhoto(){return pickPhoto({});}
/* 🖼️ scegli dalla galleria (multi = più immagini in una volta) */
function galPhoto(multi){return pickPhoto({gallery:true,multi:multi!==false});}
/* Sorgente scelta dall'interfaccia: gal=true → galleria */
function anyPhoto(gal,multi){return gal?galPhoto(multi):snapPhoto();}
/* fascia oraria corrente, per il selezionatore di menù */
const IT_RULE="Stile obbligatorio: cucina italiana/mediterranea autentica; NON mescolare ingredienti in accostamenti non italiani — componi il pasto in elementi SEPARATI (es. con riso, mozzarella e cetrioli: riso in bianco + mozzarella e cetrioli a parte, NON tutto insieme).";
function dietStr(){const D=S.diet;
  const L=[];
  let tipoTxt=(D.tipo||"mediterranea");
  if(tipoTxt==="vegetariana")tipoTxt+=" (uova "+(D.vegUova!==false?"AMMESSE":"ESCLUSE")+", pesce "+(D.vegPesce?"AMMESSO":"ESCLUSO")+")";
  if(tipoTxt==="vegana")tipoTxt+=" (nessun alimento di origine animale)";

   moltiplicatore di attività, perché non è una stima ma una misura. */
function tdeeReal(minDays){
  const rows=flattenDiet().filter(d=>d.eat>0);
  if(rows.length<(minDays||14))return null;
  const ws=(S.profile.weights||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(ws.length<2)return null;
  const from=rows[0].date,to=rows[rows.length-1].date;
  const w0=ws.filter(x=>x.d<=from).pop()||ws[0];
  const w1=ws.filter(x=>x.d<=to).pop()||ws[ws.length-1];
  const days=Math.round((new Date(w1.d)-new Date(w0.d))/86400000);
  if(days<10)return null;
  const inRange=rows.filter(d=>d.date>=w0.d&&d.date<=w1.d);
  if(inRange.length<10)return null;
  const avgEat=inRange.reduce((a,d)=>a+d.eat,0)/inRange.length;
  const avgBurn=inRange.reduce((a,d)=>a+(d.burn||0),0)/inRange.length;
  const dW=w1.w-w0.w;                       // kg (negativo se dimagrito)
  const real=avgEat-(dW*7700/days)-avgBurn; // fabbisogno base, sport escluso
  return {tdee:Math.round(real),days,dW:Math.round(dW*10)/10,
    avgEat:Math.round(avgEat),n:inRange.length,stimato:tdee()};}

function parseAIJSON(t){
  /* NIENTE regex greedy qui: su risposte lunghe (es. un piano intero) faceva
     esplodere lo stack del motore regex ("maximum call stack size exceeded",
     soprattutto su iOS). Si cercano invece le parentesi con indexOf. */
  t=String(t==null?"":t).replace(/```(json)?/g,"").trim();
  const io_=t.indexOf("{"),ia=t.indexOf("[");
  let s=-1,e=-1;
  if(ia>-1&&(io_===-1||ia<io_)){s=ia;e=t.lastIndexOf("]");}

  return JSON.parse(t);}

let DLGQ=Promise.resolve();
function dlgShow(msg,opts){opts=opts||{};
  const run=()=>new Promise(res=>{

    w.innerHTML=`<div class="mcard" role="alertdialog" aria-modal="true" style="max-width:440px">

        <button class="btn small dlg-ok">${esc(opts.ok||"OK")}</button></div></div>`;
    document.body.appendChild(w);
    w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");
    const foc=()=>Array.prototype.slice.call(w.querySelectorAll("button,input,select,textarea,a[href]")).filter(el=>!el.disabled);
    const f0=foc()[0];if(f0)setTimeout(()=>{try{f0.focus();}catch(e){}},30);

      if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();b.focus();}
      else if(!ev.shiftKey&&document.activeElement===b){ev.preventDefault();a.focus();}});

    if(inp){inp.value=opts.def!=null?String(opts.def):"";setTimeout(()=>{try{inp.focus();inp.select();}catch(_){}},80);}
    const done=v=>{try{w.remove();}catch(_){}res(v);};
    w.querySelector(".dlg-ok").onclick=()=>done(inp?inp.value:true);
    const ko=w.querySelector(".dlg-ko");if(ko)ko.onclick=()=>done(inp?null:false);
    if(inp)inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value);};
  });

/* ── SCAMBIO PASTI v5: bidirezionale e automatico ─────────────────
   Se sposti il pranzo di mercoledì alla cena di venerdì, l'app mette
   AUTOMATICAMENTE la cena di venerdì al pranzo di mercoledì: uno
   scambio solo, senza dover ricordare cosa hai preso da dove. */
function findCounterpart(toDi,slot,excludePdi,excludeMi){
  // trova il pasto che occupa (toDi, slot) in questo momento
  for(let pdi=0;pdi<7;pdi++)for(let mi=0;mi<PLAN[pdi].meals.length;mi++){
    if(pdi===excludePdi&&mi===excludeMi)continue;
    const st=S.week.days[pdi].meals[mi];const m=PLAN[pdi].meals[mi];
    const effDay=(st.movedTo!==-1&&st.movedTo!=null)?st.movedTo:pdi;
    const effSlot=st.movedAs||m.n;
    if(effDay===toDi&&effSlot===slot)return{pdi,mi};}
  return null;}
function applyMove(pdi,mi){
  const st=S.week.days[pdi].meals[mi];const m=PLAN[pdi].meals[mi];
  const toDi=(st.movedTo!==-1&&st.movedTo!=null)?st.movedTo:pdi;
  const toSlot=st.movedAs||m.n;
  if(toDi===pdi&&toSlot===m.n){save();render(cur);return;} // tornato a casa: niente scambio
  const other=findCounterpart(toDi,toSlot,pdi,mi);
  if(other){ // scambio SEMPRE automatico: mai due pasti sullo stesso slot
    const ost=S.week.days[other.pdi].meals[other.mi];
    if(!ost.done&&!ost.skip){
      ost.movedTo=(pdi===other.pdi)?-1:pdi;ost.movedAs=m.n;
      toast("🔄 Scambiati: "+m.n+" ⇄ "+PLAN[other.pdi].meals[other.mi].n+" (🔙 per annullare)");}}
  save();render(cur);}
/* 🔙 Riporta il pasto (e il suo gemello scambiato) al giorno di origine */
window.unmoveMeal=(pdi,mi)=>{
  const st=S.week.days[pdi].meals[mi];const m=PLAN[pdi].meals[mi];
  // il gemello è chi ora occupa la MIA posizione originale
  const twin=findCounterpart(pdi,m.n,pdi,mi);
  st.movedTo=-1;st.movedAs=null;
  if(twin){const tst=S.week.days[twin.pdi].meals[twin.mi];
    tst.movedTo=-1;tst.movedAs=null;} // sempre: l'altro pasto è invisibile da qui
  save();render(cur);toast("Pasti riportati al giorno di origine ✓");}

/* ✅📷 #2 — Spunta con foto: fotografi il pasto e l'AI capisce a quale pasto del
   piano corrisponde (o se è un extra), lo spunta e, se lo scostamento è
   rilevante, registra i valori reali della foto. */
window.rebalance=async(di)=>{
  /* v5.0.3 — logica a BUDGET, idempotente:
     budget residuo = kcal pianificate della giornata − kcal già mangiate;
     eccesso = pianificato dei pasti RIMANENTI − budget residuo.
     Se eccesso ≤ 50 non si tocca nulla (cliccare due volte non ri-taglia). */
  const dayPlan=plannedOfDay(di).k;                 // la "giornata tipo"
  const eaten=eatenOfDay(di).k;                     // mangiato finora (pasti ✓ + extra)
  const remaining=dayItems(di).filter(it=>{const st=S.week.days[it.pdi].meals[it.mi];
    return !st.done&&!st.skip&&PLAN[it.pdi].meals[it.mi].type==="norm";});
  const remPlanned=remaining.reduce((a,it)=>a+mealOpt(it.pdi,it.mi).k,0);
  const budget=dayPlan-eaten;
  const excess=Math.round(remPlanned-budget);
  if(!remaining.length)return dlgAlert("Non ci sono pasti normali ancora da consumare da ribilanciare.");
  if(excess<=50)return dlgAlert("✅ Sei in linea con la giornata: pasti rimanenti ~"+remPlanned+" kcal, budget residuo ~"+Math.max(0,budget)+" kcal (su "+dayPlan+" pianificate). Nessun ribilanciamento necessario.");
  if(!aiOn())return aiFail(new Error("nokey"));
  const list=remaining.map(it=>{const o=mealOpt(it.pdi,it.mi);return {slot:it.slot,desc:o.d,kcal:o.k,prot:o.p};});
  const targetRem=Math.max(remaining.length*minMealKcal(),budget); // mai sotto ~250 kcal/pasto
  try{
    const t=await aiAsk('Devo restare dentro un budget di circa '+Math.round(targetRem)+' kcal TOTALI per questi pasti rimanenti di oggi (ora sommano '+remPlanned+' kcal): '+JSON.stringify(list)+'. REGOLE OBBLIGATORIE: (1) usa i valori nutrizionali REALI degli alimenti nelle quantità che scrivi, mai numeri adattati per far tornare il conto; (2) per ridurre parti sempre ABBASSANDO LE GRAMMATURE degli ingredienti (es. "pasta 80g"→"pasta 60g"); (3) SOLO se il pasto così diventa poco saziante, sostituisci un ingrediente con uno più leggero e voluminoso (es. parte dei carboidrati con verdure); (4) è vietato lasciare la descrizione uguale abbassando solo i numeri; (5) NESSUN pasto va eliminato o ridotto sotto ~250 kcal: meglio restare un poco sopra il budget. Riduci carboidrati e grassi, MAI le proteine. La SOMMA delle kcal proposte deve essere vicina a '+Math.round(targetRem)+'. '+dietStr()+' Rispondi SOLO JSON array: [{"slot":"...","desc":"descrizione COMPLETA con le nuove grammature","kcal":n,"prot":n}]');
    const arr=parseAIJSON(t);
    // scarta le proposte "furbe": kcal più basse ma descrizione identica = barare
    const valid=arr.filter(a=>{const it=remaining.find(r=>r.slot===a.slot);if(!it)return false;
      const o=mealOpt(it.pdi,it.mi);
      return String(a.desc).trim()!==String(o.d).trim()||Math.round(a.kcal)>=o.k;});
    if(!valid.length)return dlgAlert("L'AI non ha proposto grammature nuove valide: riprova.");
    let msg="Ribilanciamento (budget residuo ~"+Math.max(0,budget)+" kcal, eccesso "+excess+" kcal):\n";
    valid.forEach(a=>{const it=remaining.find(r=>r.slot===a.slot);const o=mealOpt(it.pdi,it.mi);
      msg+="\n• "+a.slot+" ("+o.k+"→"+Math.round(a.kcal)+" kcal): "+a.desc+" (~"+a.prot+"p)";});
    if(!await dlgConfirm(msg+"\n\nOK = applica ai pasti rimanenti"))return;
    valid.forEach(a=>{const it=remaining.find(r=>r.slot===a.slot);if(it)
      S.week.days[it.pdi].meals[it.mi].custom={d:a.desc+" (ribilanciato)",k:Math.round(a.kcal),p:Math.round(a.prot)};});
    save();render(cur);
  }catch(e){aiFail(e);}};
/* 🔁 Recupero del GIORNO SUCCESSIVO: alleggerisce pranzo e cena di toDi per
   assorbire l'eccesso (surplus) di fromDi. Avvisa, propone e applica solo se
   l'utente conferma. Segna il giorno come già ribilanciato per non insistere. */
window.rebalanceNextDay=async(fromDi,toDi)=>{
  // eccesso del giorno passato = mangiato − pianificato dell'INTERA giornata
  const sg=Math.max(0,Math.round(eatenOfDay(fromDi).k-plannedOfDay(fromDi).k));
  if(sg<=50)return dlgAlert("✅ "+PLAN[fromDi].day+" non risulta sforato (mangiate "+eatenOfDay(fromDi).k+" su "+plannedOfDay(fromDi).k+" pianificate): pasti di oggi invariati.");
  if(!aiOn())return aiFail(new Error("nokey"));
  const mains=dayItems(toDi).filter(it=>{const st=S.week.days[it.pdi].meals[it.mi];
    return !st.done&&!st.skip&&PLAN[it.pdi].meals[it.mi].type==="norm";});
  if(!mains.length)return dlgAlert("Non ci sono pasti ancora da consumare da alleggerire.");
  const list=mains.map(it=>{const o=mealOpt(it.pdi,it.mi);return {slot:it.slot,desc:o.d,kcal:o.k,prot:o.p};});
  const remPlanned=list.reduce((a,x)=>a+x.kcal,0);
  const targetRem=Math.max(mains.length*minMealKcal(),remPlanned-sg);
  try{
    const t=await aiAsk('Ieri ho ecceduto di '+sg+' kcal. Alleggerisci i pasti di OGGI ancora da consumare (ora sommano '+remPlanned+' kcal) portandone la SOMMA vicino a '+Math.round(targetRem)+' kcal. REGOLE OBBLIGATORIE: (1) i valori nutrizionali devono essere quelli REALI degli alimenti nelle quantità che scrivi, mai adattati per far tornare il conto; (2) per ridurre le kcal RISCRIVI il pasto: prima sostituisci ingredienti con alternative più leggere, e se non basta ABBASSA LE GRAMMATURE (es. "riso 90g"→"riso 60g") o togli componenti; (3) è vietato lasciare la descrizione uguale abbassando solo i numeri; (4) se col cibo scelto non riesci a rientrare nel totale, riduci ancora le quantità: meglio un totale leggermente diverso ma VERO che numeri falsi. Riduci carboidrati e grassi (MAI le proteine), senza scendere sotto ~250 kcal a pasto. Pasti: '+JSON.stringify(list)+'. '+dietStr()+' Rispondi SOLO JSON array: [{"slot":"...","desc":"descrizione COMPLETA con le nuove grammature","kcal":n,"prot":n}]');
    const arr=parseAIJSON(t);
    const valid=arr.filter(a=>{const it=mains.find(r=>r.slot===a.slot);if(!it)return false;
      const o=mealOpt(it.pdi,it.mi);
      return String(a.desc).trim()!==String(o.d).trim()||Math.round(a.kcal)>=o.k;});
    if(!valid.length)return dlgAlert("L'AI non ha proposto grammature nuove valide: riprova.");
    let msg="Recupero dello sforo di "+PLAN[fromDi].day+" (~"+sg+" kcal):\n";
    valid.forEach(a=>{const it=mains.find(r=>r.slot===a.slot);const o=mealOpt(it.pdi,it.mi);
      msg+="\n• "+a.slot+" ("+o.k+"→"+Math.round(a.kcal)+" kcal): "+a.desc+" (~"+a.prot+"p)";});
    if(!await dlgConfirm(msg+"\n\nOK = applica ai pasti di oggi"))return;
    valid.forEach(a=>{const it=mains.find(r=>r.slot===a.slot);if(it)
      S.week.days[it.pdi].meals[it.mi].custom={d:a.desc+" (recupero)",k:Math.round(a.kcal),p:Math.round(a.prot)};});
    S.week.days[toDi].rebalancedFrom=fromDi;save();render(cur);
    dlgAlert("Fatto: pasti di oggi alleggeriti per recuperare lo sforo di "+PLAN[fromDi].day+".");
  }catch(e){aiFail(e);}};
/* ═══ RGP — Recupero dei giorni precedenti (v5.2) ═══════════════════
   Principi:
   • SOGLIA DI TOLLERANZA: sotto una certa quota lo sforo non si recupera
     (rientra nell'errore di stima delle porzioni). Default: 10% del
     pianificato del giorno, con un minimo di 150 kcal — regolabile in Io.
   • MAI GIORNI DI DIGIUNO: in un giorno si recupera al massimo una quota
     del pianificato (default 25%), e i pasti non scendono sotto ~250 kcal.
     Se lo sforo è grande, il resto si recupera nei giorni successivi.
   • Recupero PARZIALE tracciato: ogni giorno sforato ricorda quanto è già
     stato recuperato, così non si conta due volte. */
function minMealKcal(){return (S.profile.minMeal!=null?+S.profile.minMeal:250);}
function rgpThresh(di){ // kcal sotto le quali NON vale la pena recuperare
  const pct=(S.profile.rgpPct!=null?+S.profile.rgpPct:10);
  const min=(S.profile.rgpMin!=null?+S.profile.rgpMin:150);
  return Math.max(min,Math.round(plannedOfDay(di).k*pct/100));}
function rgpCapPct(){return (S.profile.rgpCap!=null?+S.profile.rgpCap:25);}
function rgpCapMax(){return (S.profile.rgpCapMax!=null?+S.profile.rgpCapMax:400);}
function overOfDay(di){return Math.round(eatenOfDay(di).k-plannedOfDay(di).k);}
function residualOfDay(di){ // sforo ancora da recuperare (al netto di quanto già fatto)
  return Math.max(0,overOfDay(di)-(S.week.days[di].rgpRecovered||0));}
function rgpDays(di){
  const out=[];
  const maxD=Math.max(1,Math.min(7,+S.profile.rgpDays||5));
  for(let d=di-1;d>=0&&out.length<maxD;d--){ // giorni precedenti considerati (Regole)
    const res=residualOfDay(d),th=rgpThresh(d);
    out.push({di:d,over:overOfDay(d),res,th,tracked:eatenOfDay(d).k>0,
      done:(S.week.days[d].rgpRecovered||0)>0&&res<th,
      todo:eatenOfDay(d).k>0&&res>=th});}
  return out;}
function rgpControlHTML(di){
  const days=rgpDays(di),over=days.filter(d=>d.todo);
  if(!over.length)return `<span class="coff" title="Nessuno degli ultimi giorni supera la soglia di recupero">niente da recuperare</span>`;
  const tot=over.reduce((a,d)=>a+d.res,0);
  const opts=[`<option value="">— non recuperare —</option>`,`<option value="all">tutti · +${tot} kcal</option>`]
    .concat(over.map(d=>`<option value="${d.di}">${PLAN[d.di].day} · +${d.res} kcal</option>`)).join("");
  return `<select id="rgpSel" title="Scegli cosa recuperare, poi conferma con ✓">${opts}</select>`;}
/* Un solo pulsante ✓ rende effettivi evento e recupero della giornata. */
window.applyCtl=(dISO,di,isToday)=>{
  const ev=(S.dayEvents||{})[dISO]||"";
  S.ui.evOk=S.ui.evOk||{};

window.rgpRun=async(toDi)=>{
  const el=document.getElementById("rgpSel");const v=el?el.value:"";
  const over=rgpDays(toDi).filter(d=>d.todo);
  const sel=(v==="all")?over.map(d=>d.di):(v===""?[]:[+v]);
  if(!sel.length)return;
  const tot=sel.reduce((a,d)=>a+residualOfDay(d),0);
  if(!tot)return dlgAlert("✅ Non c'è nulla da recuperare: pasti di oggi invariati.");
  if(!aiOn())return aiFail(new Error("nokey"));
  const mains=dayItems(toDi).filter(it=>{const st=S.week.days[it.pdi].meals[it.mi];
    return !st.done&&!st.skip&&PLAN[it.pdi].meals[it.mi].type==="norm";});
  if(!mains.length)return dlgAlert("Non ci sono pasti di oggi ancora da consumare da alleggerire.");
  const list=mains.map(it=>{const o=mealOpt(it.pdi,it.mi);return {slot:it.slot,desc:o.d,kcal:o.k,prot:o.p};});
  const remPlanned=list.reduce((a,x)=>a+x.kcal,0);
  // tetto giornaliero: mai più di X% del pianificato, e mai sotto ~250 kcal a pasto
  const capDay=Math.min(Math.round(plannedOfDay(toDi).k*rgpCapPct()/100),rgpCapMax());
  const floor=mains.length*minMealKcal();
  const cut=Math.max(0,Math.min(tot,capDay,remPlanned-floor));
  if(cut<50)return dlgAlert("Oggi non c'è margine per recuperare senza farti saltare un pasto (restano "+mains.length+" pasti da ~"+Math.round(remPlanned/mains.length)+" kcal). Meglio rimandare a domani.");
  const targetRem=remPlanned-cut;
  const nomi=sel.map(d=>PLAN[d].day).join(", ");
  try{
    const t=await aiAsk('Devo recuperare '+cut+' kcal di sforo dei giorni '+nomi+' alleggerendo i pasti di OGGI ancora da consumare (ora sommano '+remPlanned+' kcal): la loro SOMMA deve arrivare vicino a '+targetRem+' kcal. REGOLE OBBLIGATORIE: (1) usa i valori nutrizionali REALI degli alimenti nelle quantità che scrivi, mai numeri adattati per far tornare il conto; (2) per ridurre parti sempre ABBASSANDO LE GRAMMATURE degli ingredienti (es. "riso 90g"→"riso 60g"); (3) SOLO se il pasto così diventa poco saziante, sostituisci un ingrediente con uno più leggero e voluminoso (es. parte del riso con verdure); (4) è vietato lasciare la descrizione uguale abbassando solo i numeri; (5) NESSUN pasto va eliminato o ridotto sotto ~250 kcal: meglio recuperare meno del richiesto. Riduci carboidrati e grassi, MAI le proteine. Pasti: '+JSON.stringify(list)+'. '+dietStr()+' Rispondi SOLO JSON array: [{"slot":"...","desc":"descrizione COMPLETA con le nuove grammature","kcal":n,"prot":n}]');
    const arr=parseAIJSON(t);
    const valid=arr.filter(a=>{const it=mains.find(r=>r.slot===a.slot);if(!it)return false;
      const o=mealOpt(it.pdi,it.mi);
      return String(a.desc).trim()!==String(o.d).trim()||Math.round(a.kcal)>=o.k;});
    if(!valid.length)return dlgAlert("L'AI non ha proposto grammature nuove valide: riprova.");
    let applied=0;
    valid.forEach(a=>{const it=mains.find(r=>r.slot===a.slot);const o=mealOpt(it.pdi,it.mi);
      applied+=Math.max(0,o.k-Math.round(a.kcal));});
    let msg="Recupero da "+nomi+" — "+applied+" kcal di alleggerimento oggi";
    if(applied<tot)msg+=" (restano ~"+(tot-applied)+" kcal, le recuperi nei prossimi giorni)";
    msg+=":\n";
    valid.forEach(a=>{const it=mains.find(r=>r.slot===a.slot);const o=mealOpt(it.pdi,it.mi);
      msg+="\n• "+a.slot+" ("+o.k+"→"+Math.round(a.kcal)+" kcal): "+a.desc;});
    if(!await dlgConfirm(msg+"\n\nOK = applica ai pasti di oggi"))return;
    valid.forEach(a=>{const it=mains.find(r=>r.slot===a.slot);if(it)
      S.week.days[it.pdi].meals[it.mi].custom={d:a.desc+" (recupero)",k:Math.round(a.kcal),p:Math.round(a.prot)};});
    // ripartisci il recuperato sui giorni scelti, dal più vecchio
    let rest=applied;
    sel.slice().sort((a,b)=>a-b).forEach(d=>{if(rest<=0)return;
      const q=Math.min(rest,residualOfDay(d));
      S.week.days[d].rgpRecovered=(S.week.days[d].rgpRecovered||0)+q;rest-=q;});
    save();render(cur);
  }catch(e){aiFail(e);}};

/* ═══ 💧 PERCHÉ OGGI LA BILANCIA SALE ══════════════════════════════ */
function waterPredict(di){
  const prev=di>0?di-1:-1;if(prev<0)return "";
  const d=S.week.days[prev];if(!d)return "";
  const e=eatenOfDay(prev);const carb=e.c||0;
  const wk=(d.workouts||[]);const dur=wk.reduce((a,w)=>a+(+w.min||0),0);
  const intenso=wk.some(w=>w.int==="alta")||dur>60;
  const cause=[];let g=0;
  if(carb>=250){cause.push("ieri hai preso <b>"+Math.round(carb)+" g di carboidrati</b>, e ogni grammo di glicogeno trattiene circa 3 g d'acqua");g+=0.8;}
  else if(carb>=180){cause.push("i carboidrati di ieri ("+Math.round(carb)+" g) hanno ricaricato il glicogeno, che porta acqua con sé");g+=0.4;}
  if(intenso){cause.push("l'allenamento di ieri"+(dur?" ("+dur+" minuti)":"")+" lascia una <b>infiammazione da riparazione</b> che trattiene liquidi nei muscoli");g+=0.5;}
  if((d.water||0)&&(d.water||0)<Math.round(waterGoal(prev)*0.6)){cause.push("hai bevuto poco, e il corpo trattiene più acqua quando ne riceve meno");g+=0.3;}
  if(cycleDay()){cause.push("sei in fase luteale, quando la ritenzione è fisiologica");g+=0.8;}
  if(!cause.length)return "";
  return "💧 Se ti pesi stamattina, potresti trovare fino a <b>"+(Math.round(g*10)/10).toString().replace(".",",")+" kg in più</b> rispetto a ieri: "+
    cause.join("; ")+". È <b>acqua, non grasso</b> — se ne va da sola in un paio di giorni. Non cambiare il piano per questo.";}

function chronoForAI(di){
  const d=S.week.days[di===undefined?viewIdx():di];if(!d)return "";
  const p=[];
  if(d.sleep&&d.sleep<=2)p.push("ha dormito male (sonno "+d.sleep+"/5): sposta la maggior parte dei carboidrati a pranzo, tieni la cena più leggera e proteica, niente zuccheri semplici la sera");
  if(d.relax&&d.relax<=2)p.push("giornata stressata (relax "+d.relax+"/5): pasti semplici e qualcosa di caldo e confortante che non sfori");
  if(d.feel&&d.feel<=2)p.push("non si sente bene (umore "+d.feel+"/5): proponi cose che le piacciono davvero, dentro i numeri");
  if(d.hungerAvg>=4)p.push("oggi ha avuto molta fame (media "+d.hungerAvg+"/5): più fibre, proteine e volume a parità di calorie");
  return p.length?(" COME STA OGGI: "+p.join("; ")+"."):"";}

/* ═══ INFRASTRUTTURA DEI TOOL ══════════════════════════════════════
   Tutti gli strumenti seguono lo stesso giro: box, chiamata all'AI,
   risultato con i pulsanti per usarlo. Scritto una volta sola. */
let TOOLPICK=null;
let SNACKT=null;
function bindSwipe(root){
  if(!root||root._swipeBound)return;root._swipeBound=true;
  let x0=0,y0=0,el=null,act=null,dx=0,lock=null;
  root.addEventListener("touchstart",ev=>{
    const w=ev.target.closest?ev.target.closest(".swipe"):null;
    if(!w||ev.target.closest("button"))return;
    el=w.querySelector(".meal");act=w.getAttribute("data-del");
    x0=ev.touches[0].clientX;y0=ev.touches[0].clientY;dx=0;lock=null;},{passive:true});
  root.addEventListener("touchmove",ev=>{
    if(!el)return;
    const cx=ev.touches[0].clientX-x0,cy=ev.touches[0].clientY-y0;
    if(lock===null)lock=Math.abs(cx)>Math.abs(cy)+6?"x":"y";
    if(lock!=="x")return;
    dx=Math.min(0,cx);el.style.transform="translateX("+dx+"px)";
    const bg=el.parentNode.querySelector(".swipebg");
    if(bg)bg.style.opacity=String(Math.min(1,Math.abs(dx)/90));},{passive:true});
  root.addEventListener("touchend",()=>{
    if(!el)return;
    const bg=el.parentNode.querySelector(".swipebg");
    if(dx<-90&&act){el.style.transform="translateX(-110%)";
      const fn=act;setTimeout(()=>{try{(new Function(fn))();}catch(e){}},160);}
    else{el.style.transform="";if(bg)bg.style.opacity=0;}
    el=null;act=null;dx=0;lock=null;});}
function snackUndo(msg,undo,ms){
  const old=document.getElementById("snackBar");if(old)old.remove();
  if(SNACKT)clearTimeout(SNACKT);
  const el=document.createElement("div");el.className="snack";el.id="snackBar";
  el.innerHTML=`<span>${esc(msg)}</span><button id="snackUndo">ANNULLA</button>`;
  document.body.appendChild(el);
  el.querySelector("#snackUndo").onclick=()=>{try{undo&&undo();}catch(e){}
    el.remove();if(SNACKT)clearTimeout(SNACKT);toast("Annullato ✓");};
  SNACKT=setTimeout(()=>{const e2=document.getElementById("snackBar");if(e2)e2.remove();},ms||4500);}
function toolBox(id){const b=document.getElementById(id);if(b){b.style.display="block";}return b;}

  c.forEach(x=>{if(!x.pasto)return;perPasto[x.pasto]=(perPasto[x.pasto]||0)+1;});

   Lo sgarro si gestisce PRIMA: si mette da parte un tesoretto nei giorni
   che precedono l'evento, così ci si arriva con budget e senza sensi di colpa. */
window.predFillMeals=()=>{
  const dEl=document.getElementById("predDay"),sel=document.getElementById("predMeal");
  if(!dEl||!sel)return;
  const pdi=+dEl.value;
  sel.innerHTML=(PLAN[pdi]?PLAN[pdi].meals:[]).map((m,mi)=>`<option value="${mi}" ${/cena/i.test(m.n||"")?"selected":""}>${esc(m.n)}</option>`).join("");};
/* Tutti i pasti pendenti da adesso fino al pasto dell'occasione (escluso) */
function pendingBefore(di,pdi,mi){
  const out=[];
  for(let k=di;k<=pdi;k++)pendingMeals(k).forEach(m=>{if(k<pdi||m.mi<mi)out.push(m);});
  return out;}
window.predictive=async(di)=>{
  const dEl=document.getElementById("predDay"),mEl=document.getElementById("predMeal");
  const pdi=dEl?+dEl.value:NaN,mi=mEl?+mEl.value:NaN;
  if(isNaN(pdi)||isNaN(mi)||!PLAN[pdi]||!PLAN[pdi].meals[mi])return dlgAlert("Scegli il giorno e il pasto dell'occasione.");
  const cosa=((document.getElementById("predWhat")||{}).value||"").trim();
  if(!cosa)return dlgAlert("Scrivi cosa prevedi di mangiare (es. «pizza e birra», «cena aziendale»).");
  const stE=S.week.days[pdi].meals[mi]||{};
  if(stE.done||stE.skip)return dlgAlert("Quel pasto risulta già spuntato o saltato: scegline uno ancora da fare.");
  const evento=mealOpt(pdi,mi);
  const prima=pendingBefore(di,pdi,mi);
  if(!prima.length)return dlgAlert("Non ci sono pasti ancora da fare fra adesso e l'occasione su cui distribuire il delta.");
  return toolRun("predOut",
    'OCCASIONE PREVISTA: '+PLAN[pdi].day+', pasto «'+PLAN[pdi].meals[mi].n+'». Mangerò: «'+cosa+'». '+
    'Il piano prevedeva per quel pasto: «'+evento.d+'» (~'+evento.k+' kcal). '+rulesForAI()+
    ' 1) Stima quante kcal costerà davvero ciò che mangerò. 2) Calcola il DELTA = stima − '+evento.k+' kcal già previste. '+
    '3) Se il delta è positivo, distribuiscilo TOGLIENDOLO in piccoli tagli dai pasti ancora da fare da qui ad allora (elenco sotto), '+
    'senza mai scendere sotto '+minMealKcal()+' kcal nei pasti principali e senza toccare le proteine: solo carboidrati e grassi. '+
    'Se il delta è zero o negativo, non serve alcun taglio: dillo e lascia "pasti" vuoto. '+
    'Deve essere impercettibile: piccoli tagli distribuiti, non un giorno di digiuno. '+
    'Pasti disponibili prima dell\'occasione: '+JSON.stringify(prima)+
    '. Rispondi SOLO JSON: {"costo":n,"giaPrevisto":'+evento.k+',"delta":n,"pasti":[{"pdi":n,"mi":n,"slot":"...","nuovo":"...","kcal":n,"prot":n,"tolto":n}],"messaggio":"una riga rassicurante"}',
    j=>{PRED=j.pasti||[];
      const tot=PRED.reduce((a,x)=>a+(+x.tolto||0),0);
      return '🔮 <b>'+esc(cosa)+'</b> — '+PLAN[pdi].day+', '+esc(PLAN[pdi].meals[mi].n)
        '\n\nCosto stimato: <b>~'+Math.round(j.costo||0)+' kcal</b> · già previste dal piano: '+Math.round(j.giaPrevisto||0)+
        ' · da mettere da parte: <b>'+Math.round(j.delta||0)+' kcal</b>'+
        (PRED.length?'\n\n<b>Il tesoretto</b> (piccoli tagli, proteine intatte)\n'+
          PRED.map(x=>'• '+esc(x.slot||"")+': −'+Math.round(x.tolto||0)+' kcal → '+esc(x.nuovo||"")).join('\n')+
          '\n\nTotale accantonato: <b>'+Math.round(tot)+' kcal</b>':'\n\n✅ Il delta è coperto dal piano: nessun taglio necessario.')+
        (j.messaggio?'\n\n<i>'+esc(j.messaggio)+'</i>':'')+
        (PRED.length?'<div class="btngrid2" style="margin-top:8px"><button class="btn small" onclick="applyMealEdits(PRED)">Costruisci il tesoretto</button></div>':'');});};

/* ═══ 🍳 MEAL-PREP MATRIX ═════════════════════════════════════════ */
/* Opzioni "fino a … a cena": giornate intere, max 3; se oggi è già iniziato
   (un pasto spuntato o saltato) si parte da domani. */
function prepUntilOpts(di){
  const anyDone=dayItems(di).some(it=>{const st=S.week.days[it.pdi].meals[it.mi];return st.done||st.skip;});
  const start=anyDone?di+1:di;let o="";
  for(let k=start;k<Math.min(7,start+3);k++){if(!PLAN[k])continue;
    o+=`<option value="${k}">fino a ${PLAN[k].day}${k===di?" (oggi)":""} a cena</option>`;}
  return o;}
function prepHomeType(m){return m.type==="norm"||(m.type==="mensa"&&outTypeIsPorto());}
window.mealPrep=(di)=>{
  const sel=document.getElementById("prepUntil");
  const end=(sel&&sel.value!=="")?+sel.value:NaN;
  if(isNaN(end)||!PLAN[end])return dlgAlert("La settimana è quasi finita: non ci sono giornate intere da coprire. Riprova da lunedì.");
  const gg=[];
  pendingMeals(di).forEach(m=>{if(prepHomeType(PLAN[m.pdi].meals[m.mi]))gg.push({giorno:PLAN[di].day+" (oggi, ancora da fare)",slot:m.slot,d:m.d});});
  for(let k=di+1;k<=end;k++){
    (PLAN[k]?PLAN[k].meals:[]).forEach((m,mi)=>{if(!prepHomeType(m))return;
      const o=mealOpt(k,mi);gg.push({giorno:PLAN[k].day,slot:m.n,d:o.d});});}
  if(!gg.length)return dlgAlert("Non ci sono pasti da coprire nel periodo scelto.");
  return toolRun("prepOut",
    'Questi sono i pasti da coprire con il batch cooking, da adesso fino a '+PLAN[end].day+' a cena compresa (i pasti di oggi già consumati sono esclusi): '+JSON.stringify(gg)+'. '+rulesForAI()+
    ' Estrai le PREPARAZIONI BASE comuni e costruisci un piano di batch cooking da fare tutto in una volta oggi, che copra ESATTAMENTE quel periodo. '+
    'Per ogni preparazione: quanto cucinarne in totale (a crudo), come conservarla e in quali pasti verrà usata. '+
    'Aggiungi anche un ordine di esecuzione sensato (cosa mettere sul fuoco per primo) e quanto tempo si risparmia. '+
    'Rispondi SOLO JSON: {"prep":[{"cosa":"...","quanto":"...","come":"cottura e conservazione","serve_per":["Lunedì pranzo","Martedì cena"]}],"ordine":"in che ordine procedere","risparmio":"quanto tempo risparmi"}',
    j=>'🍳 <b>Batch cooking dei prossimi giorni</b>\n\n'+
       (j.prep||[]).map(x=>'• <b>'+esc(x.cosa||"")+'</b>: '+esc(x.quanto||"")+'\n  '+esc(x.come||"")+
         (x.serve_per&&x.serve_per.length?'\n  <i>serve per: '+esc(x.serve_per.join(", "))+'</i>':'')).join('\n\n')+
       (j.ordine?'\n\n<b>Ordine</b>: '+esc(j.ordine):'')+
       (j.risparmio?'\n⏱️ '+esc(j.risparmio):''));};

/* ═══ 🛑 INTERCETTORE DI FAME EMOTIVA ═════════════════════════════
   Non blocca niente: si mette in mezzo con una domanda e tre alternative. */
const BINGE_RE=/nutella|cioccolat|merend|biscott|patatin|gelat|torta|brioche|cornett|caramell|dolc|crackers|snack|pizza|birra|vino/i;
function bingeRisk(desc,k){
  const h=new Date().getHours();
  const tardi=(h>=22||h<5);
  const denso=BINGE_RE.test(String(desc||""))||(+k>=350);
  return (tardi||denso)?{tardi:tardi,denso:denso}:null;}
window.bingeCheck=async(desc,k)=>{
  const r=bingeRisk(desc,k);
  if(!r)return true;                     /* niente da intercettare */
  const motivo=r.tardi?"È tardi":"È un alimento denso di zuccheri o grassi";
  const ok=await dlgConfirm("🛑 Un attimo, senza giudizio.\n\n"+motivo+
    ": hai <b>fame fisica</b> o è noia, stanchezza, nervoso?\n\n"+
    "Prova così: bevi un bicchiere d'acqua e aspetta 15 minuti. Se dopo la fame c'è ancora, è vera — e allora mangiala, con la mia benedizione.\n\n"+
    "Se l'hai già mangiato non è successo niente: la prossima volta prova il metodo dell'acqua.",
    {ok:"Registro comunque",ko:"Aspetto 15 minuti"});
  if(ok)return true;
  /* ha scelto di aspettare: proponiamo alternative dentro i macro */
  const di=viewIdx(),e=eatenOfDay(di);
  const resto=Math.max(0,dayTargetK()-e.k);
  toolRun("bingeOut",
    'Sto per cedere a: '+String(desc||"qualcosa di goloso")+'. Ho deciso di aspettare 15 minuti. '+
    'Mi restano circa '+resto+' kcal oggi. '+rulesForAI()+
    ' Dammi 3 alternative DOLCI ma sazianti che rientrino in quelle calorie e che soddisfino davvero la voglia (non consigli moralisti). '+
    'Rispondi SOLO JSON: {"opzioni":[{"nome":"...","d":"con grammature","kcal":n,"prot":n}],"nota":"una riga gentile"}',
    j=>'🛑 <b>Mentre aspetti, tre idee che ci stanno</b>\n\n'+
       (j.opzioni||[]).map((x,i)=>'• <b>'+esc(x.nome||"")+'</b> — ~'+Math.round(x.kcal||0)+' kcal · '+Math.round(x.prot||0)+' g prot\n  '+esc(x.d||"")).join('\n')+
       (j.nota?'\n\n<i>'+esc(j.nota)+'</i>':''));
  return false;};

window.reverseStep=async()=>{

  const W=(S.profile.weights||[]).slice(-6);
  if(W.length<2)return dlgAlert("Servono almeno due pesate per capire come sta andando.");
  const a=W[0].w,b=W[W.length-1].w,d=Math.round((b-a)*10)/10;
  const su=d>0.4;
  const msg="📈 Uscita morbida · settimana "+((S.reverse.step||0)+1)+
    "\n\nPeso: "+a+" kg → "+b+" kg ("+(d>=0?"+":"")+d+" kg)\n"+
    "Calorie già risalite: +"+reverseBonus()+" kcal al giorno\n\n"+
    (su?"Il peso sta salendo: conviene fermarsi qui. Hai trovato il tuo tetto."
       :"Il peso è stabile: possiamo salire ancora di 60 kcal e vedere cosa succede.");
  if(!await dlgConfirm(msg,{ok:su?"Mi fermo qui":"Sali di 60 kcal",ko:su?"Salgo lo stesso":"Resto così"}))
    {if(su){S.reverse.kcal=reverseBonus()+60;S.reverse.step=(S.reverse.step||0)+1;}}
  else if(!su){S.reverse.kcal=reverseBonus()+60;S.reverse.step=(S.reverse.step||0)+1;}
  S.reverse.lastCheck=iso(new Date());save();render(cur);
  toast(reverseOn()?("Target: +"+reverseBonus()+" kcal al giorno"):"");};

/* ═══ 🏦 FONDO FIDUCIARIO DEL WEEKEND ═════════════════════════════ */
S.bank=Object.assign({on:false,pct:8},S.bank||{});
function bankOn(){return !!(S.bank&&S.bank.on);}
function bankPct(){return Math.max(3,Math.min(15,+S.bank.pct||8));}
/* lun-ven si toglie una micro-quota, sabato si restituisce tutta insieme */
/* Il giorno si legge dalla DATA vera del giorno visualizzato, non dall'indice:
   navigando fuori dalla settimana il calcolo resta corretto. */
function bankAdjust(di){
  if(!bankOn())return 0;
  const st=safeDate((S.week&&S.week.started)+"T12:00:00");
  const d=(di>=0&&st)?new Date(st.getTime()+di*864e5):VIEW;
  const dow=(d||new Date()).getDay();          /* 0 domenica … 6 sabato */
  const g=(dow===0)?6:dow-1;                   /* 0 lunedì … 6 domenica */
  const quota=Math.round(dayTargetKBase()*bankPct()/100);
  if(g<=4)return -quota;                       /* lun-ven: si mette da parte */
  if(g===5)return quota*5;                     /* sabato: si restituisce tutto */
  return 0;}
window.bankToggle=async()=>{
  if(bankOn()){S.bank.on=false;save();render(cur);return toast("Tassa weekend disattivata");}
  if(!await dlgConfirm("🏦 Attivo il fondo fiduciario del weekend?\n\n"+

    "Il bilancio della settimana resta identico: cambia solo come è distribuito."))return;
